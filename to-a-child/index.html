function home(){const next=CHAPTERS.findIndex((c,i)=>!state.completed[i]);const target=next<0?0:next;return `<section class="hero"><div class="hero-art">${svgArt('citadel')}</div><div class="hero-content"><div class="eyebrow">AN INTERACTIVE BOOK OF COURAGE & REASON</div><h1>THE INNER<br>CITADEL</h1><p class="lead">Some doors open into kingdoms. Others open into the mind.</p><p>Inherit an ancient house. Venture into impossible worlds. Solve curious puzzles, challenge philosophers, and decide what kind of person you want to become.</p><div class="button-row"><button class="btn" data-chapter="${target}">${progress()?'CONTINUE THE CHRONICLE':'BEGIN THE CHRONICLE'} →</button><button class="btn secondary" data-nav="atlas">OPEN THE ATLAS ✧</button></div><p class="micro">A book that asks questions. It does not award virtue points.</p></div></section>${resumeBanner()}${atlasGallery()}<div class="section-head"><div><div class="eyebrow">THE THREE PARTS OF THE PRIMER</div><h2>Adventure. Practice. Inquiry.</h2></div></div><div class="grid"><div class="tile"><small>THE CHRONICLE</small><h3>Fifteen chapters</h3><p>Political intrigue, honor, duty, friendships and consequences at House Vale. All five volumes remain open.</p><button class="btn small secondary" data-nav="chapters">EXPLORE THE STORY →</button></div><div class="tile"><small>THE TRAINING COURT</small><h3>Trials of reason</h3><p>Fifteen original games and riddles, plus four new symbolic interactive challenges. No moral scores.</p><button class="btn small secondary" data-nav="trials">TRY THE GAMES →</button></div><div class="tile"><small>THE SCHOLAR'S SHELVES</small><h3>Twenty-five studies</h3><p>Serious introductions, objections, and paths to the real writings of Epictetus, Seneca and Marcus Aurelius.</p><button class="btn small secondary" data-nav="library">STUDY THE TEXTS →</button></div><div class="tile"><small>THE READER'S VOICE</small><h3>Read your way</h3><p>Switch between clear, story and scholar language. Tap unfamiliar words, or request plain-language explanations.</p><button class="btn small secondary" data-action="settings">READING OPTIONS →</button></div></div><div class="section-head"><div><div class="eyebrow">THE ATLAS OF UNDERSTANDING</div><h2>Ideas form a constellation.</h2></div></div>${constellation()}<p class="notice">This is historical fiction and interactive philosophical study, not a generative AI tutor or therapeutic service. The Council uses scripted dialogue. Your records stay in browser storage until exported. External primary-source links require internet access.</p>`}
function chapters(){return `<div class="reading" style="max-width:960px"><div class="eyebrow">THE BOOK OF ROADS</div><h1>The Chronicle</h1><p class="lead">There are many paths through a hard choice. A worthy path is one you can explain and examine.</p><p class="subtle">Every chapter is open from the beginning. Study freely, return to old decisions, or proceed in narrative order.</p>${VOLUMES.map(v=>`<div class="volume-head">${v.title} <span style="font-family:DM Sans,sans-serif;font-size:10px;color:var(--muted);letter-spacing:0;display:block;margin-top:5px">${v.sub}</span></div><div class="chapter-grid">${CHAPTERS.map((c,i)=>({...c,i})).filter(c=>c.vol===v.id).map(c=>`<button class="chapter-card" data-chapter="${c.i}"><div class="chapter-illustration">${svgArt(artForChapter(c.i),true)}</div><span class="num">CHAPTER ${String(c.i+1).padStart(2,'0')}</span>${state.completed[c.i]?'<span class="check">◆</span>':''}<h3>${escapeHtml(c.title)}</h3><p>${escapeHtml(c.sub)}</p></button>`).join('')}</div>`).join('')}</div>`}

const ECHOES={
 3:{0:[`Rumor travels quickly in House Vale. Sera recalls the sharp letter you once sent, and today she watches your words carefully.`,`Sera remembers that you came to verify her meaning before you judged her. She offers you a quiet nod across the yard.`,`Sera seems uncertain whether your silence was patience or avoidance. Today may offer a clearer answer.`]},
 7:{4:[`After the mill investigation, the council still quarrels over how publicly you challenged the accusation.`,`Tamsin's family remembers that you defended her privately, but the question of the missing grain still shadows the stores.`,`Some servants hesitate to bring troubling news to the council after Tamsin was blamed without a hearing.`]},
 10:{5:[`At the archery festival, a courtier recalls your refusal to flatter the host, though some now call you needlessly proud.`,`A courtier remembers that you refused to trade false praise for a ring.`,`Some guests remember your public criticism of the host more clearly than the reason for your refusal.`]},
 12:{8:[`At the gate, Iven recalls that you once stayed quietly beside him at the healer's memorial.`,`At the gate, Iven recalls that you once tried to explain mortality when he wanted company.`,`At the gate, Iven recalls that you listened to his story about the healer.`]},
 14:{12:[`Since the imperial order, people have talked of your public defiance; the captain now prepares for a hard response.`,`The negotiations won House Vale precious time, but the capital never truly abandoned its demand.`,`The capital was satisfied with your obedience, but the lower quarter has not forgotten its shortage.`]}
};
function storyEcho(i){const e=ECHOES[i];if(!e)return '';const previous=Number(Object.keys(e)[0]);const choice=state.choices[previous];return choice===undefined?'':e[previous][choice]||''}

function story(){const i=state.chapter,c=CHAPTERS[i],phase=state.phase,vol=VOLUMES[c.vol],opt=state.choices[i];let body='';if(phase===0){body=`<div class="eyebrow">${vol.title} · CHAPTER ${String(i+1).padStart(2,'0')}</div><h1>${escapeHtml(c.title)}</h1><p class="lead">${escapeHtml(c.sub)}</p><div class="line-ornament">✦</div><div class="story-frame"><div class="prose">${storyEcho(i)?`<p style="color:var(--gold);font-size:.84em">✦ AN ECHO FROM AN EARLIER CHOICE</p><p>${escapeHtml(storyEcho(i))}</p>`:``}${paragraphs(state.readMode==='clear'?CLEAR_INTROS[i]:c.intro)}</div></div><div class="button-row"><button class="btn" data-phase="1">CONTINUE THE STORY →</button></div>`}
if(phase===1){body=`<div class="eyebrow">THE STORY · CHAPTER ${i+1}</div><h2>${escapeHtml(c.title)}</h2><div class="story-frame"><div class="speaker">${escapeHtml(c.speaker)}</div><div class="prose"><p>“${readable(state.readMode==='clear'?CLEAR_DIALOGUE[i]:c.dialogue.replace(/^“|”$/g,''))}”</p></div><div class="line-ornament">✧</div><h3>${escapeHtml(c.question)}</h3><p class="micro">Choose a course. The narrative responds, but no choice earns moral points. Your reasoning matters more than the result.</p>${c.options.map((o,n)=>`<button class="choice-btn" data-choice="${n}"><span class="choice-tag">COURSE ${['I','II','III'][n]}</span>${escapeHtml(o[0])}</button>`).join('')}</div>`}
if(phase===2){body=`<div class="eyebrow">THE CONSEQUENCE · CHAPTER ${i+1}</div><h2>The world answers.</h2><div class="story-frame"><div class="prose"><p>${readable(c.options[opt??0][1])}</p><p>Beyond the walls of House Vale, the rest of the city continues. Some consequences are immediate. Others become visible only after the choice has been made.</p></div><div class="line-ornament">✦</div><div class="speaker">MASTER ORIN</div><div class="quote">“Now explain your choice. Was it reason, fear, loyalty, justice, ambition—or a mixture? You may change your mind without dishonor.”</div><p class="subtle">${escapeHtml(c.question)}</p><div class="button-row"><button class="btn ghost small" data-phase="1">RECONSIDER THE CHOICE</button><button class="btn" data-phase="3">ENTER THE TRIAL →</button></div></div>`}
if(phase===3){body=trialView(c.trial,i)}
if(phase===4){body=`<div class="eyebrow">THE STUDY · ${escapeHtml(SOURCES[c.source].name)}</div><h2>Examine the teaching.</h2><div class="story-frame"><div class="eyebrow">THE CENTRAL CLAIM</div><p class="lead">${readable(c.thesis)}</p><div class="read-panel"><h4>A more difficult reading</h4><p>${readable(c.depth)}</p></div><details class="lesson-accord" open><summary>THE CHALLENGE TO THIS IDEA</summary><div>${escapeHtml(c.tension)}</div></details><details class="lesson-accord"><summary>THE HISTORICAL TEXT AND CONTEXT</summary><div>${escapeHtml(c.history)}<div>${sourceLink(c.source,c.ref)}</div></div></details><div class="button-row"><button class="btn secondary" data-action="related-library">EXPLORE RELATED READING ↗</button><button class="btn" data-phase="5">WRITE YOUR MEDITATION →</button></div></div>`}
if(phase===5){body=`<div class="eyebrow">THE JOURNAL · CHAPTER ${i+1}</div><h2>Speak in your own voice.</h2><p class="lead">${escapeHtml(c.journal)}</p><p class="subtle">Write a paragraph, one sentence, or nothing. These reflections are yours, not a test. Your writing remains on this device.</p><textarea id="chapter-journal" class="reflection" placeholder="What I think…">${escapeHtml(state.journals[i]||'')}</textarea><p class="micro">Saved locally when you leave the text box or finish the chapter.</p><div class="button-row"><button class="btn" data-action="finish">SEAL THIS CHAPTER ✦</button><button class="btn ghost" data-action="journal-save">SAVE WITHOUT FINISHING</button></div>`}
if(phase===6){body=`<div class="eyebrow">THE SEAL · CHAPTER ${i+1}</div><h1>The chapter is written.</h1><div class="line-ornament">✦</div><div class="story-frame"><p class="lead">${escapeHtml(c.title)} has joined your chronicle.</p><p>Your answer is not engraved in stone. The best thinkers often return to an earlier conclusion with better questions.</p><div class="read-panel"><h4>The idea you examined</h4><p>${escapeHtml(c.thesis)}</p></div><p>${state.journals[i]?'Your meditation is preserved in your journal.':'You completed the chapter without leaving a written meditation. You can return and write one whenever you like.'}</p><div class="button-row"><button class="btn" data-chapter="${(i+1)%CHAPTERS.length}">${i===CHAPTERS.length-1?'RETURN TO THE FIRST CHAPTER':'NEXT CHAPTER →'}</button><button class="btn secondary" data-nav="council">ASK THE COUNCIL</button><button class="btn ghost small" data-phase="0">READ AGAIN</button></div></div>`}
return `<div class="reading">${illustratedHeader(artForChapter(i),c.title,'THE CHRONICLE · CHAPTER '+String(i+1).padStart(2,'0'),phase!==0)}<div class="phase-track">${Array.from({length:6},(_,n)=>`<div class="${n<=Math.min(phase,5)?'on':''} ${n<phase?'done':''}"></div>`).join('')}</div>${body}${phase<5?`<div class="reading-margins">${detailPrompt()}${plainBubble(phase===0?CLEAR_INTROS[i]:phase===1?CLEAR_DIALOGUE[i]:phase===2?c.thesis:phase===3?'This exercise is practice, not a grade on your character. Try it, skip it, or return later.':c.thesis)}</div>${state.readMode==='scholar'&&phase===4?`<div class="reading-note"><div class="eyebrow">SCHOLAR’S QUESTION</div><p>${escapeHtml(c.tension)}</p></div>`:''}`:''}${phase<6?`<div class="story-actions"><button class="btn ghost small" data-phase="${Math.max(0,phase-1)}" ${phase===0?'disabled':''}>← PREVIOUS PAGE</button><button class="btn ghost small" data-nav="chapters">CHAPTER INDEX</button></div>`:''}</div>`}
function trialView(key,i){const t=TRIALS[key],already=!!state.trials[i];let body=`<div class="eyebrow">THE TRAINING COURT · CHAPTER ${i+1}</div><h2>${escapeHtml(t.title)}</h2><p class="lead">${escapeHtml(t.intro)}</p>`;
if(t.kind==='classify'){body+=`<div class="story-frame"><div class="micro">MATCH EACH OBSERVATION TO THE MOST REASONABLE CATEGORY</div>${t.items.map(([txt,ans],n)=>`<div class="sort-item"><p>${n+1}. ${escapeHtml(txt)}</p><select class="classify-select" data-q="${n}"><option value="">Choose...</option>${t.labels.map((l,x)=>`<option value="${x}" ${ui.trialSelections[n]===x?'selected':''}>${escapeHtml(l)}</option>`).join('')}</select></div>`).join('')}<button class="btn" data-action="check-classify">EXAMINE MY ANSWERS</button>${ui.trialFeedback?`<div class="result" role="status">${ui.trialFeedback}</div>`:''}</div>`}
if(t.kind==='riddle'){body+=`<div class="story-frame"><div class="micro">A TEST OF REASONING, NOT A TEST OF CHARACTER</div>${t.choices.map((a,n)=>`<button class="choice-btn ${ui.answer===n?'selected':''}" data-answer="${n}"><span class="choice-tag">${['I','II','III','IV'][n]}</span>${escapeHtml(a)}</button>`).join('')}${ui.trialFeedback?`<div class="result" role="status">${ui.trialFeedback}</div>`:''}</div>`}
if(t.kind==='allocation'){if(!ui.alloc){ui.alloc=[3,3,3,3]}let sum=ui.alloc.reduce((a,b)=>a+b,0);body+=`<div class="story-frame"><div class="eyebrow">TWELVE HOURS TO SPEND</div><p class="lead" style="font-size:28px">${sum} / 12 allocated ${sum===12?'✦':''}</p>${t.categories.map((cat,n)=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) 145px 26px;align-items:center;gap:12px;border-bottom:1px solid #504b4f;padding:13px 0"><label for="alloc-${n}">${escapeHtml(cat)}</label><input id="alloc-${n}" type="range" min="0" max="12" step="1" value="${ui.alloc[n]}" data-alloc="${n}" style="accent-color:var(--gold);width:100%"><strong>${ui.alloc[n]}</strong></div>`).join('')}<p class="hint">A plan must add up to exactly 12 hours. There is no hidden ideal allocation.</p><button class="btn" data-action="check-alloc" ${sum===12?'':'disabled'}>CONSIDER THE TRADEOFFS</button>${ui.trialFeedback?`<div class="result" role="status">${ui.trialFeedback}</div>`:''}</div>`}
if(t.kind==='maze'){if(!ui.maze)ui.maze={x:0,y:0,steps:0,done:false};const rows=t.map;body+=`<div class="story-frame"><p class="micro">Move with the arrow keys or the controls. Find the green goal. A route is a plan, not proof of virtue.</p><div class="logic-grid">${rows.flatMap((row,y)=>[...row].map((tile,x)=>`<div class="logic-cell ${tile==='#'?'wall':''} ${tile==='G'?'goal':''} ${ui.maze.x===x&&ui.maze.y===y?'player':''}">${ui.maze.x===x&&ui.maze.y===y?'♞':tile==='#'?'▥':tile==='G'?'✦':''}</div>`)).join('')}</div><p class="micro" style="text-align:center">MOVES: ${ui.maze.steps} · ${ui.maze.done?'PASSAGE REACHED':'REACH THE ✦'}</p><div class="arrow-pad"><span></span><button data-move="up" aria-label="Move up">↑</button><span></span><button data-move="left" aria-label="Move left">←</button><button data-move="down" aria-label="Move down">↓</button><button data-move="right" aria-label="Move right">→</button></div><div class="button-row" style="justify-content:center"><button class="btn ghost small" data-action="reset-maze">RESET THE PATH</button>${ui.maze.done?'<span class="tag">PASSAGE FOUND ✦</span>':''}</div>${ui.trialFeedback?`<div class="result">${ui.trialFeedback}</div>`:''}</div>`}
body+=`<div class="button-row"><button class="btn ${already||ui.trialFeedback?'':'secondary'}" data-phase="4">${already||ui.trialFeedback?'CONTINUE TO THE STUDY':'PASS FOR NOW · CONTINUE'} →</button></div><p class="micro">You may skip or repeat any training exercise. A missed riddle is an invitation to reconsider, never a mark against your character.</p>`;return `<div class="reading">${body}</div>`}
function checkClassify(){const t=TRIALS[CHAPTERS[state.chapter].trial];const selects=[...$$('.classify-select')];selects.forEach(el=>{ui.trialSelections[+el.dataset.q]=el.value===''?null:Number(el.value)});if(selects.some(el=>el.value==='')){ui.trialFeedback='Select an answer for every statement. You can change any of them.';render();return}let correct=t.items.reduce((n,item,i)=>n+(ui.trialSelections[i]===item[1]?1:0),0);const misses=t.items.map((it,i)=>ui.trialSelections[i]===it[1]?'':`<div style="margin-top:7px">${i+1}. ${escapeHtml(it[0])} → <b>${escapeHtml(t.labels[it[1]])}</b></div>`).join('');ui.trialFeedback=`<strong>${correct} / ${t.items.length} classifications matched.</strong>${misses?`<p>Compare these with your selections:</p>${misses}`:''}<p>${escapeHtml(t.debrief)}</p>`;state.trials[state.chapter]={played:true,result:correct+'/'+t.items.length};save();render()}
function chooseAnswer(n){const t=TRIALS[CHAPTERS[state.chapter].trial];ui.answer=n;ui.trialFeedback=`<strong>${n===t.correct?'The inference holds.':'Consider the alternatives.'}</strong><p>${escapeHtml(t.explain)}</p>`;state.trials[state.chapter]={played:true,result:n===t.correct?'reasoned':'reconsider'};save();render()}
function checkAlloc(){const t=TRIALS[CHAPTERS[state.chapter].trial];let sum=ui.alloc.reduce((a,b)=>a+b,0);if(sum!==12){ui.trialFeedback='The ledger must account for exactly 12 hours.'}else{const hi=Math.max(...ui.alloc),lo=Math.min(...ui.alloc);const high=t.categories.filter((c,i)=>ui.alloc[i]===hi).join(' and ');const low=t.categories.filter((c,i)=>ui.alloc[i]===lo).join(' and ');ui.trialFeedback=`<strong>The ledger balances.</strong><p>You gave the most time to ${escapeHtml(high)} and the least to ${escapeHtml(low)}. What would someone who depends on your time think of this plan?</p><p>${escapeHtml(t.debrief)}</p>`;state.trials[state.chapter]={played:true,result:ui.alloc.slice()};save()}render()}
function moveMaze(dir){let m=ui.maze;if(!m||m.done)return;const deltas={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};if(!deltas[dir])return;const [dx,dy]=deltas[dir],x=m.x+dx,y=m.y+dy,map=TRIALS[CHAPTERS[state.chapter].trial].map;if(y<0||y>=map.length||x<0||x>=map[0].length||map[y][x]==='#')return;m.x=x;m.y=y;m.steps++;if(map[y][x]==='G'){m.done=true;state.trials[state.chapter]={played:true,result:m.steps+' moves'};save();ui.trialFeedback=`<strong>You reached the passage in ${m.steps} moves.</strong><p>${escapeHtml(TRIALS[CHAPTERS[state.chapter].trial].debrief)}</p>`}render()}
function library(){const term=ui.libSearch.trim().toLowerCase();const groups=['All',...new Set(LIBRARY.map(d=>d.group))];const items=LIBRARY.map((x,i)=>({...x,index:i})).filter(item=>(ui.libGroup==='All'||item.group===ui.libGroup)&&(!term||[item.title,item.tag,item.content,item.group,item.challenge].some(v=>v.toLowerCase().includes(term))));return `<div class="wide"><div class="eyebrow">THE SCHOLAR'S LIBRARY</div><h1>Investigate the ancients.</h1><p class="lead">The story is an invitation. The philosophy is a subject for serious study.</p><p class="subtle">25 original interpretive entries, primary-source reading links, criticisms, and questions. The library does not pretend to reproduce all surviving Stoic writing: the linked editions provide extended texts.</p><input class="search-input" id="library-search" value="${escapeHtml(ui.libSearch)}" placeholder="Search a concept, author, or objection…" aria-label="Search library"><div class="tab-row">${groups.map(g=>`<button class="tab-btn ${ui.libGroup===g?'active':''}" data-libgroup="${escapeHtml(g)}">${escapeHtml(g)}</button>`).join('')}</div><p class="micro">${items.length} entries found</p><div class="library-grid">${items.map(it=>`<article class="library-entry"><div class="eyebrow">${escapeHtml(it.group)} · ${escapeHtml(it.tag)}</div><h3>${escapeHtml(it.title)}</h3><p>${escapeHtml(it.content).slice(0,230)}${it.content.length>230?'…':''}</p><button class="btn secondary small" data-entry="${it.index}">STUDY THIS SUBJECT →</button></article>`).join('')||'<p>No entries match. Try another search.</p>'}</div><div class="section-head"><h2>The original writings</h2></div><div class="grid">${Object.values(SOURCES).map(s=>`<div class="tile"><small>PRIMARY SOURCE</small><h3>${escapeHtml(s.name)}</h3><p>${escapeHtml(s.by)}. Reference scope: ${escapeHtml(s.ref)}.</p><a href="${s.link}" target="_blank" rel="noopener noreferrer">OPEN THE FULL TEXT ↗</a></div>`).join('')}</div><p class="notice" style="margin-top:20px">Source notes: the ancient works are public domain. Specific translations have distinct rights. The linked Project Gutenberg editions are identified as public domain in the United States; readers elsewhere should check local rules. This version contains our own summaries and illustrative fiction, not a searchable copy of every ancient text.</p></div>`}
function libraryDetail(i){const it=LIBRARY[i],related=LIBRARY.map((x,k)=>({...x,index:k})).filter(x=>x.group===it.group&&x.index!==i).slice(0,4);return `<div class="reading"><button class="btn ghost small" data-nav="library">← BACK TO LIBRARY</button><div class="eyebrow" style="margin-top:32px">${escapeHtml(it.group)} · A SCHOLAR'S LEAF</div><h1>${escapeHtml(it.title)}</h1><p class="lead">${escapeHtml(it.tag)}</p><div class="line-ornament">✦</div><div class="story-frame"><div class="prose">${state.readMode==='clear'?`<div class="lib-plain"><h4>In clear words</h4><p>${escapeHtml(SIMPLE_LIBRARY[i])}</p></div><details class="lesson-accord"><summary>READ THE FULL SCHOLARLY TEXT</summary><div>${readable(it.content)}</div></details>`:`<p>${readable(it.content)}</p>`}</div>${detailPrompt()}${plainBubble(SIMPLE_LIBRARY[i])}<div class="read-panel"><h4>Put the claim on trial</h4><p>${readable(it.challenge)}</p></div><div class="micro">SOURCE PATH · ${escapeHtml(SOURCES[it.source].name)} · ${escapeHtml(it.ref)}</div>${sourceLink(it.source,it.ref)}<div class="button-row"><button class="btn" data-action="library-journal">WRITE ABOUT THIS →</button><button class="btn secondary" data-nav="council">OPEN THE COUNCIL</button></div></div><div class="section-head"><h3>Continue investigating</h3></div><div class="grid">${related.map(r=>`<button class="choice-btn" data-entry="${r.index}">${escapeHtml(r.title)} →</button>`).join('')}</div></div>`}
const COUNCIL_TOPICS=[{title:'What belongs to us?',prompt:'A student says, “I was told to control my feelings, but my feelings do not ask permission to appear.” Is that an objection to Epictetus or a misunderstanding?',responses:['Which part of the experience arrives without permission, and which part might still be examined?','Would it be just to blame someone for an involuntary fear? What does discipline mean instead?','Can someone have little power over a situation while retaining a meaningful choice about one step?'],sources:'Epictetus, Enchiridion §1 and §5'},
{title:'Does noble rank make someone better?',prompt:'A lord claims that the poor were born to obey and nobles born to rule. What would a commitment to universal human reason imply?',responses:['What does noble mean here: an inheritance or a standard of conduct?','Would your argument change if you were the person with no power?','How would you build a rule that applies equally to the lord and the servant?'],sources:'Marcus Aurelius, Meditations II.1; Seneca, On Clemency'},
{title:'Is anger ever useful?',prompt:'Someone humiliates your friend. You feel furious and want action. What part of the anger is information, and what part is a demand for vengeance?',responses:['What exactly happened, apart from what your anger says it means?','Can a person deliver justice firmly without enjoying another person’s pain?','What might a witness who dislikes both parties notice that you have missed?'],sources:'Seneca, On Anger'},
{title:'What makes courage real?',prompt:'A crowd is daring you to fight someone you dislike. Would refusal show fear or good judgment?',responses:['Whose approval matters to the decision?','Can you name a courageous action that does not look dramatic?','What would justice require if another person might be injured?'],sources:'Marcus Aurelius, Meditations XI.18'},
{title:'Can virtue be enough?',prompt:'The Stoics claim that virtue is the only real good. How would you challenge that idea using hunger, poverty, illness, or grief?',responses:['Can material suffering be morally significant even if it is not a fault of character?','Would you accept the same argument if someone else used it to excuse failing to help?','Do we need to separate what makes a person admirable from what makes their circumstances worth improving?'],sources:'Epictetus, Discourses II.5; Seneca, On the Happy Life'},

const COUNCIL_MEMBERS=[{name:'The Epictetan Examiner',subtitle:'Questions about choice, impressions, and freedom',symbol:'Ε',style:'Ask what judgment you are treating as fact, and what part of the situation belongs to your deliberation.'},{name:'The Senecan Correspondent',subtitle:'Questions about anger, power, mercy, and time',symbol:'S',style:'Ask whether an impulse serves justice, whether luxury has purchased your words, and how your limited time is spent.'},{name:'The Imperial Meditator',subtitle:'Questions about duty, mortality, and the human community',symbol:'Μ',style:'Ask what conduct the situation demands and whether a person on the receiving end of your power would call it just.'}];
function council(){const t=COUNCIL_TOPICS[ui.councilTopic],member=COUNCIL_MEMBERS[ui.councilCharacter];return `<div class="reading"><div class="eyebrow">THE CIRCULAR CHAMBER</div><h1>The Council</h1><p class="lead">Three traditions of questioning. Your chair is the fourth.</p><p class="notice">This Council is an offline, scripted dialogue with choices and a journal—not a generative AI. Its questions are inspired by the historical philosophers but are not their words.</p><div class="tab-row">${COUNCIL_MEMBERS.map((m,i)=>`<button class="tab-btn ${ui.councilCharacter===i?'active':''}" data-member="${i}">${escapeHtml(m.name.split(' ')[1]||m.name)}</button>`).join('')}</div><div class="council-card"><div class="avatar">${member.symbol}</div><div class="eyebrow">${escapeHtml(member.name)}</div><p style="font-size:17px;color:var(--muted);font-family:DM Sans,sans-serif">${escapeHtml(member.subtitle)}</p><div style="clear:both"></div><div class="line-ornament">✧</div><p>“${escapeHtml(ui.dialogueStage===0?t.prompt:ui.dialogueStage===1?t.responses[ui.councilCharacter]:member.style)}”</p><div class="micro">READING PATH · ${escapeHtml(t.sources)}</div></div><div class="section-head"><h3>Choose a question</h3></div><select id="council-topic" class="search-input" style="max-width:100%" aria-label="Council topic">${COUNCIL_TOPICS.map((x,n)=>`<option value="${n}" ${ui.councilTopic===n?'selected':''}>${escapeHtml(x.title)}</option>`).join('')}</select><p class="micro" style="margin-top:14px">Your reply is not automatically evaluated; only you can decide whether your reasoning has improved. Save it to your meditations if you wish.</p><textarea id="council-text" class="reflection" placeholder="My argument, or a question of my own…">${escapeHtml(ui.councilDraft)}</textarea><div class="button-row"><button class="btn" data-action="council-ask">ASK FOR A FOLLOW-UP →</button><button class="btn secondary" data-action="council-save">SAVE TO MEDITATIONS</button><button class="btn ghost small" function journal(){const existing=Object.entries(state.journals).filter(([k,v])=>String(v).trim()).sort((a,b)=>Number(a[0])-Number(b[0]));const extras=state.notes||[];return `<div class="reading"><div class="eyebrow">YOUR PRIVATE JOURNAL</div><h1>My Meditations</h1><p class="lead">A place to inspect your thinking, not to perform for a judge.</p><div class="grid"><div class="tile"><small>CHAPTERS COMPLETED</small><div class="progress-stat">${progress()} <span style="font-size:16px;color:var(--muted)">/ ${CHAPTERS.length}</span></div></div><div class="tile"><small>REFLECTIONS WRITTEN</small><div class="progress-stat">${existing.length+extras.length}</div></div></div><div class="section-head"><h3>A new meditation</h3></div><textarea class="reflection" id="free-note" placeholder="Today I noticed…"></textarea><div class="button-row"><button class="btn" data-action="free-note">ADD TO MY JOURNAL</button><button class="btn ghost small" data-action="export">EXPORT MY PROGRESS</button></div><div class="section-head"><h2>Previous reflections</h2></div>${[...extras.map((x,i)=>({type:'note',id:i,subject:x.subject||'Personal meditation',text:x.text,date:x.date||''})).reverse(),...existing.map(([id,text])=>({type:'chapter',id,subject:`Chapter ${Number(id)+1} · ${CHAPTERS[id]?.title}`,text,date:''}))].map(x=>`<article class="journal-entry"><small>${escapeHtml(x.subject)} · ${escapeHtml(x.date)}</small><p>${escapeHtml(x.text)}</p><button class="plain-btn" data-delete-note="${x.type}:${x.id}">DELETE THIS REFLECTION</button></article>`).join('')||'<p class="subtle">No reflections yet. They appear here when you choose to write.</p>'}${Object.entries(state.realmNotes||{}).filter(([id,v])=>String(v).trim()).map(([id,v])=>`<article class="journal-entry"><small>AN IMPOSSIBLE PLACE · ${escapeHtml(ALL_REALMS.find(r=>r.id===id)?.title||id)}</small><p>${escapeHtml(v)}</p></article>`).join('')}<p class="notice">Your notes are stored only in this browser’s local storage. They are not encrypted and could be seen by someone with access to this browser profile. Use Export in Settings to back them up, and delete them whenever you wish.</p></div>`}

const GLOSSARY={
'impression':'the first way something seems to you, before you have checked it',
'assent':'deciding that an idea is true, or agreeing to believe it',
'virtue':'the habit of doing what is wise, fair, brave, and self-controlled',
'judgment':'what you decide something means or whether it is true',
'agency':'your power to make choices and take action',
'fate':'what happens as part of events and their causes; the Stoics debated how choices fit into this',
'clemency':'showing mercy, especially when you have the power to punish',
'cosmopolitanism':'the idea that people everywhere belong to one human community',
'logos':'an ancient Greek word for reason or an ordering principle; Stoics thought the cosmos was shaped by it',
'determinism':'the view that events happen because of earlier causes',
'indifferent':'in Stoic usage, something that cannot by itself make someone morally good or bad; not the same as being unimportant',
'inference':'a conclusion you reach from clues or reasons',
'premise':'a starting statement used to support an argument',
'providence':'the belief that events fit within a guiding order or plan',
'temperance':'using desires with good judgment rather than being carried away by them',
'mortality':'the fact that every human life has an end',
'coercion':'forcing someone to do something through threats or power',
'skepticism':'carefully questioning what we can really know',
'paradox':'an idea that seems contradictory or impossible but may reveal something surprising',
'assumption':'something you treat as true before you have proved it',
'allegory':'a story whose people and places also represent bigger ideas',
'reputation':'what other people think or say about you',
'uncertainty':'not knowing exactly what is true or what will happen',
'resentment':'anger that stays with you after a perceived unfairness',
'inevitable':'certain to happen; unable to be avoided',
'authority':'the accepted power to make decisions or give commands',
'justice':'treating people fairly and respecting what they are owed',
'integrity':'trying to do what you think is right even when it is costly',
'hypothesis':'a possible explanation you can test',
'rational':'guided by reasons and evidence, not simply by impulse',
'flourishing':'living a life that goes well in a deep, meaningful sense',
'assent to an impression':'deciding to treat a first appearance as true'
};

function realmPage(){const r=ALL_REALMS.find(x=>x.id===state.realm)||ALL_REALMS[0],step=state.realmStep,chosen=realmProgress(r).choice;let middle='';if(step===0)middle=`<div class="eyebrow">AN UNWRITTEN ROAD · REALM ${r.no}</div><h1>${escapeHtml(r.title)}</h1><p class="lead">${escapeHtml(r.subtitle)}</p>${r.opening.map(t=>`<p>${readable(t)}</p>`).join('')}<p class="micro">The Primer does not tell you what to believe. It asks you to investigate.</p>`;

 if(step===2)middle=`<div class="eyebrow">THE WORK OF THE MIND</div><h2>${escapeHtml(r.puzzleName)}</h2><p>${escapeHtml(r.puzzleIntro)}</p>${worldPuzzle(r)}`;
 if(step===3)middle=`<div class="eyebrow">THE MOMENT OF CHOICE</div><h2>What will you do?</h2><p class="lead">${escapeHtml(r.choicePrompt)}</p>${r.options.map((o,i)=>`<button class="choice-btn ${chosen===i?'selected':''}" data-r-choice="${i}"><span class="choice-tag">COURSE ${['I','II','III'][i]}</span>${escapeHtml(o[0])}</button>`).join('')}`;
 if(step===4)middle=`<div class="eyebrow">THE WORLD ANSWERS</div><h2>An imperfect ending.</h2><p>${escapeHtml(r.options[chosen??0][1])}</p><div class="read-panel"><h4>What the ancients might ask</h4><p>${readable(r.lesson)}</p><details class="lesson-accord"><summary>THE OBJECTION</summary><div>${escapeHtml(r.objection)}</div></details>${sourceLink(r.source,r.ref)}</div><p>The world does not tell you whether you are good. It simply continues, changed by what you did.</p>`;
 if(step===5)middle=`<div class="eyebrow">THE RETURN TO HOUSE VALE</div><h2>A leaf for your journal.</h2><p class="lead">${escapeHtml(r.journal)}</p><textarea class="reflection" id="realm-journal" placeholder="Write what you think, or leave the page blank…">${escapeHtml(state.realmNotes?.[r.id]||'')}</textarea><p class="micro">Saved on this device. There is no grading and no minimum length.</p><button class="btn" data-r-tool="realm-finish">SEAL THIS JOURNEY ✦</button>`;
 const txt=step===0?r.opening:step===1?r.scene:step===4?[r.lesson,r.objection]:[r.hook];return `<div class="realm-page"><button class="btn ghost small" data-nav="atlas">← ATLAS OF WORLDS</button><div class="realm-hero ${r.palette}">${svgArt(r.id)}<div class="realm-hero-meta"><div class="eyebrow">THE INNER CITADEL · BEYOND THE MARGINS</div><div class="realm-hero-number">${r.no}</div><strong>${escapeHtml(r.title)}</strong><small>${escapeHtml(r.theme)}</small></div></div><div class="reading realm-reading"><div class="phase-track realm-track">${Array.from({length:6},(_,n)=>`<div class="${n<=step?'on':''}"></div>`).join('')}</div><div class="story-frame realm-scroll"><div class="prose">${middle}</div>${step<=4?`${detailPrompt()}${plainBubble(step===0?'You have entered a strange place that turns a difficult idea into a story. Look for what is real, what people assume, and who is affected.':step===1?'Listen closely to each person. People can disagree without one being a villain.':step===2?'Try the puzzle. It is for practice, not to judge your worth.':step===3?'Every option has a reason and a cost. Choose one you could explain.':r.lesson)}`:''}</div><div class="story-actions"><button class="btn ghost small" data-r-step="${Math.max(0,step-1)}" ${step===0?'disabled':''}>← PREVIOUS LEAF</button>${step<5?`<button class="btn" data-r-step="${step+1}" ${step===3&&chosen===undefined?'disabled':''}>${step===2?'CONTINUE · OR TRY THE PUZZLE':step===3?'SEE THE CONSEQUENCES':'TURN THE PAGE'} →</button>`:`<button class="btn secondary" data-nav="atlas">OTHER WORLDS →</button>`}</div></div></div>`;
}

function encounterTool(data){if(data.realm){enterRealm(data.realm);return true}if(data.rStep!==undefined){stepRealm(Number(data.rStep));return true}if(data.rChoice!==undefined){state.realms[state.realm]={...(state.realms[state.realm]||{}),choice:Number(data.rChoice)};save();stepRealm(4);return true}if(data.rAnswer!==undefined){let [i,n]=data.rAnswer.split(':').map(Number);ui.rAnswers[i]=n;ui.puzzleFeedback='';render();return true}if(data.rGear!==undefined){let n=Number(data.rGear);if(!ui.gearSequence.includes(n)&&ui.gearSequence.length<4)ui.gearSequence.push(n);ui.puzzleFeedback='';render();return true}if(data.rWater!==undefined||data.rStone!==undefined){let isWater=data.rWater!==undefined,[i,delta]=(isWater?data.rWater:data.rStone).split(':').map(Number),arr=isWater?'water':'stones',len=isWater?4:3;if(!ui[arr])ui[arr]=Array(len).fill(0);const sum=ui[arr].reduce((a,b)=>a+b,0);if(ui[arr][i]+delta>=0&&sum+delta<=6)ui[arr][i]+=delta;ui.puzzleFeedback='';render();return true}if(data.rTool){const r=ALL_REALMS.find(x=>x.id===state.realm);if(data.rTool==='mirror-check'){let n=Object.keys(ui.rAnswers).length,correct=r.questions.filter((q,i)=>ui.rAnswers[i]===q[1]).length;ui.puzzleFeedback=n!==r.questions.length?'Try classifying each statement before checking.':`<strong>${correct} of ${r.questions.length} claims matched the evidence.</strong> Observing cheering is different from assuming the cheers prove worth. You can reconsider any answer.`;}

function downloadProgress(){const out={app:'The Inner Citadel',version:2,exported:new Date().toISOString(),data:{choices:state.choices,completed:state.completed,started:state.started,journals:state.journals,notes:state.notes,trials:state.trials,clues:state.clues||{},chapter:state.chapter,phase:state.phase,font:state.font,readMode:state.readMode,realms:state.realms,realmNotes:state.realmNotes,realm:state.realm,realmStep:state.realmStep}};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='inner-citadel-meditations.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function restoreProgress(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const val=JSON.parse(fr.result);if(val.app!=='The Inner Citadel'||!val.data||typeof val.data!=='object')throw Error('Invalid archive');let d=val.data;state={...cleanState(),...state,choices:d.choices||{},completed:d.completed||{},started:d.started||{},journals:d.journals||{},clues:d.clues||{},notes:Array.isArray(d.notes)?d.notes:[],trials:d.trials||{},chapter:Math.max(0,Math.min(CHAPTERS.length-1,Number(d.chapter)||0)),phase:Math.max(0,Math.min(6,Number(d.phase)||0)),font:Math.max(17,Math.min(30,Number(d.font)||20)),readMode:READ_MODES.some(x=>x.id===d.readMode)?d.readMode:'story',realms:d.realms&&typeof d.realms==='object'?d.realms:{},realmNotes:d.realmNotes&&typeof d.realmNotes==='object'?d.realmNotes:{},realm:d.realm||'mirror',realmStep:Math.max(0,Math.min(5,Number(d.realmStep)||0))};ui.modal=null;save();render();alert('Your archived progress has been imported.')}catch(e){alert('Could not import that file. Choose a save file exported by The Inner Citadel.')}};fr.readAsText(file)}
function act(name){switch(name){case'menu':ui.menu=!ui.menu;render();break;case'settings':ui.modal='settings';render();break;case'agecycle':{let i=READ_MODES.findIndex(x=>x.id===state.readMode);state.readMode=READ_MODES[(i+1)%3].id;save();render();break}case'clarify':ui.clarify=!ui.clarify;render();break;case'close-word':ui.glossTerm=null;render();break;case'close-modal':ui.modal=null;render();break;case'check-classify':checkClassify();break;case'check-alloc':checkAlloc();break;case'reset-maze':ui.maze=null;ui.trialFeedback='';render();break;case'related-library':ui.libSearch='';ui.libGroup='All';nav('library');break;case'journal-save':{let box=$('#chapter-journal');if(box){state.journals[state.chapter]=box.value;save()}render();break}case'finish':{let box=$('#chapter-journal');if(box)state.journals[state.chapter]=box.value;finishChapter();break}case'free-note':{if(addNote('Personal meditation',$('#free-note')?.value||''))render();else alert('Write a reflection first.');break}case'library-journal':{const entry=LIBRARY[ui.selectedTopic];state.view='journal';render();const textarea=$('#free-note');if(textarea){textarea.value=`${entry.title}\n${entry.challenge}\n\n`;textarea.focus()}break}case'council-ask':{ui.councilDraft=$('#council-text')?.value||'';ui.dialogueStage=ui.dialogueStage===0?1:ui.dialogueStage===1?2:1;render();break}case'council-reset':ui.dialogueStage=0;ui.councilDraft='';render();break;case'council-save':{ui.councilDraft=$('#council-text')?.value||'';if(addNote('Council: '+COUNCIL_TOPICS[ui.councilTopic].title,ui.councilDraft)){ui.councilDraft='';ui.dialogueStage=0;render();alert('Saved to your meditations.')}else alert('Write a thought before saving.');break}case'export':downloadProgress();break;case'reset-all':if(confirm('Erase all chapters, choices, games, and journal writing from this browser? This cannot be undone without an exported archive.')){state=cleanState();localStorage.removeItem(ROOT);ui.modal=null;nav('home')}break;}}
document.addEventListener('click',e=>{
 const path=e.target.closest('[data-path-open]');if(path){e.preventDefault();openEpisode(STORY_PATH[Number(path.dataset.pathOpen)]);return}
 const next=e.target.closest('[data-path-next]');if(next){e.preventDefault();nextPath();return}
 const clue=e.target.closest('[data-clue]');if(clue&&state.view==='story'){let k=Number(clue.dataset.clue),item=STORY_CLUES[state.chapter]?.[k];if(!item)return;
  state.clues=state.clues||{};state.clues[state.chapter]=Array.from(new Set([...(state.clues[state.chapter]||[]),k]));save();document.querySelectorAll('.clue-button').forEach(b=>{b.classList.toggle('active',Number(b.dataset.clue)===k);b.classList.toggle('seen',state.clues[state.chapter].includes(Number(b.dataset.clue)))});
  const target=document.getElementById('clue-answer');if(target)target.innerHTML='<strong>'+escapeHtml(item[0])+'</strong>'+escapeHtml(item[1]);return}
 const lens=e.target.closest('[data-lens]');if(lens&&state.view==='story'){let k=Number(lens.dataset.lens),item=STORY_CLUES[state.chapter];ui.lens=k;let message=['The incident: '+item[0][1],'An interpretation to question: '+item[1][1],'A new question to ask: '+item[2][1]][k];document.querySelectorAll('.lens-buttons button').forEach(b=>b.classList.toggle('on',Number(b.dataset.lens)===k));const r=document.getElementById('lens-reveal');if(r)r.innerHTML='<small>'+['THE OBSERVATION','THE INTERPRETATION','THE INQUIRY'][k]+'</small><p>'+escapeHtml(message)+'</p>';return}
},true);
document.addEventListener('click',e=>{let target=e.target.closest('[data-nav],[data-chapter],[data-phase],[data-choice],[data-action],[data-answer],[data-move],[data-entry],[data-gametrial],[data-libgroup],[data-member],[data-delete-note],[data-realm],[data-r-step],[data-r-choice],[data-r-answer],[data-r-gear],[data-r-water],[data-r-stone],[data-r-tool],[data-term]');if(!target)return;if(target.classList.contains('modal-backdrop')&&e.target.closest('.modal'))return;let d=target.dataset;if(d.term){ui.glossTerm=d.term;render();return}if(encounterTool(d))return;if(d.nav){nav(d.nav);return}if(d.chapter!==undefined){nav('story',Number(d.chapter));return}if(d.phase!==undefined){if(state.phase===5&&$('#chapter-journal')){state.journals[state.chapter]=$('#chapter-journal').value;save()}goPhase(Number(d.phase));return}if(d.choice!==undefined){choose(Number(d.choice));return}if(d.answer!==undefined){chooseAnswer(Number(d.answer));return}if(d.move){moveMaze(d.move);return}if(d.entry!==undefined){ui.selectedTopic=Number(d.entry);nav('entry');return}if(d.gametrial!==undefined){nav('story',Number(d.gametrial));goPhase(3);return}if(d.libgroup){ui.libGroup=d.libgroup;render();return}if(d.member!==undefined){ui.councilDraft=$('#council-text')?.value||ui.councilDraft;ui.councilCharacter=Number(d.member);ui.dialogueStage=0;render();return}if(d.deleteNote){const [type,id]=d.deleteNote.split(':');if(confirm('Delete this reflection?')){if(type==='note')state.notes.splice(+id,1);else delete state.journals[id];save();render()}return}if(d.action){act(d.action);return}});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.alloc!==undefined){ui.alloc[Number(d.alloc)]=Number(e.target.value);ui.trialFeedback='';const current=e.target.closest('div');const label=current?.querySelector('strong');if(label)label.textContent=e.target.value;const total=ui.alloc.reduce((a,b)=>a+b,0);const header=$('.story-frame .lead');if(header)header.textContent=total+' / 12 allocated '+(total===12?'✦':'');const go=$('[data-action=check-alloc]');if(go)go.disabled=total!==12;const output=$('.story-frame .result');if(output)output.remove()}if(e.target.id==='library-search'){let focused=e.target.selectionStart;ui.libSearch=e.target.value;render();let el=$('#library-search');el?.focus();try{el?.setSelectionRange(focused,focused)}catch(e){}}if(e.target.id==='fontsize'){state.font=Number(e.target.value);document.documentElement.style.setProperty('--reader',state.font+'px');const label=e.target.closest('.read-panel')?.querySelector('label');if(label)label.textContent='Reading size · '+state.font+'px';save()}if(e.target.id==='realm-journal'){state.realmNotes[state.realm]=e.target.value;save()}if(e.target.id==='chapter-journal'){state.journals[state.chapter]=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.classList.contains('classify-select')){ui.trialSelections[Number(e.target.dataset.q)]=e.target.value===''?null:Number(e.target.value)}if(e.target.id==='readlevel'){state.readMode=e.target.value;save();render()}if(e.target.id==='council-topic'){ui.councilTopic=Number(e.target.value);ui.dialogueStage=0;ui.councilDraft='';render()}if(e.target.id==='import-data'){restoreProgress(e.target.files?.[0])}});
document.addEventListener('keydown',e=>{if(state.view==='story'&&state.phase===3){const t=TRIALS[CHAPTERS[state.chapter].trial];if(t.kind==='maze'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)){const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(keys[e.key]){e.preventDefault();moveMaze(keys[e.key])}}}});
render();
