.reader-tools{border-top:1px solid #84715255;margin-top:23px;padding-top:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.reader-mark{font-family:DM Sans,sans-serif;font-weight:600;font-size:9px;letter-spacing:.13em;color:#aa997d;margin-right:auto}.mini-link{font-family:DM Sans,sans-serif;background:#bea16a17;border:1px solid #aa895b63;color:#e3c08a;font-size:11px;cursor:pointer;padding:9px 11px;border-radius:2px}.mini-link:hover{background:#c5a56630}.clarification{background:#f0e4c6;color:#3c3126;border:1px solid #aa9264;padding:18px 21px;margin:18px 0;box-shadow:0 6px 26px #0004}.clarification .eyebrow{color:#77532e;font-size:10px}.clarification p{font-family:DM Sans,sans-serif;font-size:14px;line-height:1.7;margin:8px 0}.clarification .micro{font-size:11px;color:#695c4b}

/* V3 · THE LIVING CHRONICLE */
:root{--inkblue:#111b29;--vellum:#dfd1af;--livegold:#ecc889}
body{background:radial-gradient(ellipse at 75% 12%,#2930435b,transparent 34%),#0c0e14}
.shell aside{background:linear-gradient(175deg,#252231,#141923 50%,#131419);box-shadow:inset -7px 0 26px #0004}
.topbar{border-bottom:1px solid #b69c653d}
.top-pill{letter-spacing:.04em}
.nav-btn.nav-primary{border-color:#cfad6b80;background:linear-gradient(105deg,#6651316e,#b6924e17);color:#ffdf9c;font-weight:700;font-size:13px;box-shadow:0 3px 20px #0003}
.nav-btn.nav-primary .nav-icon{font-size:20px}
.side-path{padding:14px 10px 16px;border:1px solid #8a754a73;background:#141a26;margin:17px 0 12px;border-radius:6px}
.side-path span{font-size:10px;color:#dcb879;letter-spacing:.18em;text-transform:uppercase}
.side-path strong{display:block;font-family:Cormorant Garamond,serif;font-size:22px;color:#f1dfbf;line-height:1.1;margin:6px 0}
.side-path p{font-size:11px;color:#a7afba;line-height:1.4}
.side-path button{width:100%;margin-top:6px}
.path-hero{border:1px solid #d4b67870;position:relative;min-height:430px;background:#111827;overflow:hidden;box-shadow:0 30px 85px #0007;margin-bottom:28px;isolation:isolate;display:flex;align-items:center}
.path-hero .backdrop{position:absolute;inset:0;z-index:-1}
.path-hero .backdrop svg{width:100%;height:100%}
.path-hero:after{content:'';pointer-events:none;position:absolute;inset:0;background:linear-gradient(90deg,#141820f5,#171b28dd 49%,#17202c33);z-index:-1}
.path-hero-content{padding:clamp(28px,5vw,58px);max-width:660px;position:relative;z-index:1}
.path-hero h1{font-family:Cinzel,serif;font-size:clamp(37px,5.1vw,65px);line-height:1.07;color:#f3ddb3;letter-spacing:.035em;margin:10px 0 18px}
.path-hero p{max-width:480px;color:#dfd4c2}
.chapter-kicker{letter-spacing:.16em;font-size:10px;color:#d7b47e;text-transform:uppercase}
.path-progress{margin:23px 0 4px;max-width:520px;display:flex;gap:5px}
.path-progress span{height:5px;flex:1;background:#776a5945;border:1px solid #9f855329;transform:skewX(-20deg)}
.path-progress span.done{background:#b99a65;box-shadow:0 0 12px #d4a65c4a}
.path-progress span.now{background:#efdbb0;box-shadow:0 0 16px #efd5959c}
.path-stat{font-size:11px;color:#d4c2a3;margin-top:12px}
.guided-note{padding:17px 20px;background:#262b34;border-left:3px solid #d4af71;margin-bottom:28px;line-height:1.6;font-size:13px;color:#d4d1c9}
.guided-note strong{color:#ecd7b0}
.path-trail{display:grid;gap:0;margin-top:26px}
.path-entry{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:15px;align-items:center;padding:18px 18px;border-bottom:1px solid #796e5a44;position:relative;background:linear-gradient(95deg,#20242c8a,#17192162);text-align:left;color:inherit;width:100%;border-top:0;border-left:0;border-right:0;cursor:pointer;transition:background .18s}
.path-entry:hover{background:#35303b}
.path-entry.current{border:1px solid #d0a86e9c;background:linear-gradient(95deg,#4b3d36,#26242c);box-shadow:0 8px 28px #0004;margin:6px 0}
.path-entry .trail-symbol{height:44px;width:44px;border-radius:50%;border:1px solid #9c885b;display:grid;place-items:center;color:#e7c58f;font-size:23px;background:#c3a47413}
.path-entry.finished .trail-symbol{color:#9ebca0;border-color:#69826c}
.path-entry .trail-info small{display:block;color:#c7a87a;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.path-entry .trail-info strong{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1.1;display:block;margin:5px 0}
.path-entry .trail-info em{font-size:12px;color:#b7b7bb;font-style:normal}
.path-entry .trail-go{font-size:11px;color:#dfbf89;white-space:nowrap}
.path-entry.world{background:linear-gradient(90deg,#302b4a91,#1b2231)}
.path-entry.world.current{background:linear-gradient(90deg,#463a64,#252739)}
.path-side-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.path-side-links button{flex:1;min-width:190px}
.path-banner{padding:20px 24px;border:1px solid #a6906994;background:linear-gradient(100deg,#332b31,#1c2730);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:25px}
.path-banner h3{font-size:29px;color:#f1d8a5;margin:3px 0}
.path-banner p{font-size:12px;margin:4px 0;color:#c1bfbb}
.path-banner button{white-space:nowrap}
.scene-theatre{height:330px;margin:15px 0 17px;position:relative;isolation:isolate;border:1px solid #ab936e99;overflow:hidden;background:#101a26;box-shadow:inset 0 0 45px #0005}
.scene-theatre .theatre-bg{position:absolute;inset:0;z-index:-2}
.scene-theatre .theatre-bg svg{width:100%;height:100%}
.scene-theatre:after{position:absolute;content:'';inset:0;z-index:-1;background:linear-gradient(0deg,#10151fee,transparent 48%),linear-gradient(90deg,#0e1428a8,transparent 78%)}
.scene-theatre .theatre-title{position:absolute;top:14px;left:17px;z-index:4;color:#e6c991;font-size:10px;text-transform:uppercase;letter-spacing:.19em;background:#111922a9;padding:6px 8px}
.scene-dust{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffdc9d;opacity:0;left:var(--x);top:var(--y);animation:dustRise var(--dur) linear infinite;animation-delay:var(--delay);box-shadow:0 0 7px #f6c97f}
@keyframes dustRise{0%{opacity:0;transform:translate(0,12px)}20%,60%{opacity:.65}100%{opacity:0;transform:translate(24px,-60px)}}
.scene-figure{position:absolute;bottom:-22px;right:2%;width:clamp(128px,27%,220px);height:92%;z-index:2;filter:drop-shadow(-10px 9px 14px #050610a0);animation:characterIdle 6s ease-in-out infinite}
.scene-figure svg{height:100%;width:100%}
@keyframes characterIdle{0%,100%{transform:translateY(0) rotate(-.15deg)}50%{transform:translateY(3px) rotate(.15deg)}}
.scene-eye{transform-origin:center;animation:eyeBlink 7.1s ease-in-out infinite}
@keyframes eyeBlink{0%,93%,96%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.05)}}
.scene-figure-name{position:absolute;bottom:15px;right:18px;font-family:Cinzel,serif;text-align:right;font-size:10px;letter-spacing:.13em;color:#ffe0a3;text-shadow:0 1px 8px #000;z-index:3}
.scene-figure-name small{display:block;color:#b9bbc0;letter-spacing:.03em;font:11px DM Sans,sans-serif;margin-top:3px}
.scene-inspect{margin-top:18px;border:1px solid #8c795f6b;background:#101721b8;padding:18px}
.scene-inspect h4{font-size:26px;color:#f1d6a8;margin-bottom:5px}
.scene-inspect .instruction{font-size:12px;color:#abb3c1;margin:5px 0 13px;line-height:1.5}
.clue-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.clue-button{background:#31333c;border:1px solid #6d675d;color:#eadcc4;min-height:68px;padding:11px 7px;display:flex;align-items:center;justify-content:center;gap:6px;flex-direction:column;text-align:center;font-size:11px;line-height:1.25}
.clue-button span{font-size:23px;color:#efd29e;line-height:1}
.clue-button:hover,.clue-button.active{background:#544638;border-color:#ebc987;color:#fff1d3}
.clue-button.seen:before{content:'✦';font-size:10px;position:absolute;align-self:flex-end;color:#bed1a8}
.clue-answer{font-family:'Cormorant Garamond',serif;color:#f2e0c6;font-size:21px;line-height:1.4;padding:12px 14px;margin-top:12px;min-height:67px;border-left:2px solid #d7b57b;background:#c3a57413}
.clue-answer strong{font-family:DM Sans,sans-serif;font-size:10px;letter-spacing:.15em;display:block;color:#dfc08d;margin-bottom:6px;text-transform:uppercase}
.thought-machine{border:1px solid #b99a695f;background:radial-gradient(ellipse at 50% 0,#4b42354a,#181e29 70%);padding:22px;margin:23px 0}
.thought-machine h4{font-size:28px;color:#e9c998}
.thought-machine .lens-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:17px 0}
.lens-buttons button{border:1px solid #82745c;background:#272b33;color:#e1d9ca;font-size:12px;padding:11px 6px;min-height:54px}
.lens-buttons button.on{border-color:#f0cb8e;background:#574731;color:#ffedc7}
.lens-reveal{background:#131c25;border-left:3px solid #d8b778;padding:14px 17px;font-size:15px;line-height:1.65;color:#e6dbc8;min-height:80px}
.lens-reveal p{margin:2px 0;font-size:15px;line-height:1.6}
.lens-reveal small{font-size:10px;letter-spacing:.15em;color:#dbc594}
.ink-sigil{color:#dbb77e;font-size:22px;animation:sigilSpin 25s linear infinite;display:inline-block}
@keyframes sigilSpin{to{transform:rotate(360deg)}}

 ep:{name:'Epictetus · Enchiridion',ref:'§§1, 5, 8, 17, 20, 29, 30, 42',link:'https://www.gutenberg.org/ebooks/45109',by:'Epictetus, translated by T. W. Higginson (public-domain US edition)'},

};
const VOLUMES=[{id:0,title:'I · The Book Opens',sub:'Perception, judgment, choice'},{id:1,title:'II · The House of Virtue',sub:'Courage, justice, moderation, wisdom'},{id:2,title:'III · The Uncertain World',sub:'Anger, grief, fortune, time'},{id:3,title:'IV · The Wider Cosmos',sub:'Duty, fate, mortality, liberty'},{id:4,title:'V · The Citadel Within',sub:'Trials of integrated judgment'}];
const CHAPTERS=[
{title:'The Letter Without a Seal',sub:'The difference between an event and a judgment',vol:0,source:'ep',ref:'Enchiridion §5',tags:['impressions','judgment','truth'],intro:[`On the morning of your twelfth naming-day, a black carriage arrives beneath the copper roofs of House Vale. There is no crest on its door. Its driver refuses the customary coin.`,`Inside waits a narrow book bound in dark leather. Its first page bears only a sentence: “You may inherit a fortress. You cannot inherit a sound mind.”`,`By noon, a rumor passes through the manor: Captain Sera, your father's oldest friend, has called you unfit to lead. Three servants repeat it. None heard her speak.`],speaker:'MASTER ORIN · THE HOUSE TUTOR',dialogue:`“A report is not yet a fact,” Orin says, as he seals the shutters against the wind. “And a fact is not yet your interpretation of it. Before you carry an insult into battle, discover whether there is an enemy.”`,question:'A messenger offers to take your reply to Sera. What do you do?',options:[['Demand an apology','You send a sharp message. Sera returns a puzzled reply: she said you lacked training, not ability. Your first move has made a misunderstanding harder to mend.'],['Ask what was actually said','You seek a witness. Sera said the new commander needed training. The rumor was sharpened on its way to you. The hurt was real; the reported sentence was not.'],['Say nothing for now','You decline to react until morning. The rumor fades, but the question of your readiness remains unanswered. Stillness has protected you from one mistake without solving everything.']],trial:'impression',thesis:'Stoics distinguish an initial appearance (an impression) from the judgment we choose to endorse. An unpleasant feeling can arrive before we have investigated it.',depth:'Epictetus does not demand that you have no first emotional jolt. The discipline is to notice the appearance and examine what you are adding to it.',tension:'Can suspicion sometimes protect us? At what point does careful inquiry become hesitation?',history:'Epictetus taught that people are disturbed not simply by things, but by their judgments about things. Read §5 in its full context.',journal:'When have you mistaken an interpretation for a fact? What evidence would have helped?'},
{title:'The Two Gates',sub:'What is up to us—and what is not',vol:0,source:'ep',ref:'Enchiridion §1',tags:['agency','control','influence'],intro:[`Orin takes you to the training court, where two gates face each other. One is locked from the outside. The other has no lock at all.`,`“A commander who mistakes the gates,” he says, “will spend an army breaking into the wrong room.”`,`Across the court, a young page named Iven is furious because rain has spoiled the ceremony. Sera orders the recruits to assemble anyway.`],speaker:'CAPTAIN SERA · MASTER OF THE YARD',dialogue:`“You do not command the clouds,” Sera says. “But you command neither your future feelings nor every flicker of your attention. Train what you can train; do not pretend to own what you do not.”`,question:'You were promised a demonstration before the gathered nobles. The rain makes it impossible. What is your plan?',options:[['Insist the ceremony proceed','The courtyard becomes a mess. Your determination is seen, but so is your refusal to adapt.'],['Prepare an indoor demonstration','The audience is smaller and the work less splendid. Your plan succeeds on a scale you could actually influence.'],['Abandon the demonstration','You save effort, but perhaps surrender more influence than the weather required.']],trial:'sort',thesis:'For Epictetus, judgments, purposes, and choices are especially our own; outcomes, other people, reputation, and the body are not fully ours.',depth:'“Control” is a useful modern shorthand, but it can mislead. Modern psychology and Stoicism do not agree that we freely choose every emotion or thought. Distinguish choice, influence, and external circumstance.',tension:'Is it realistic to separate choice from upbringing, sickness, fear, or coercion? What remains our responsibility?',history:'Read Enchiridion §1 and pay attention to what Epictetus actually calls “our own.”',journal:'Name one thing you can choose, one thing you can influence, and one thing you cannot control.'},
{title:'The Mapmaker’s Puzzle',sub:'Reasoning from incomplete evidence',vol:0,source:'ed',ref:'Discourses I.7 (reasoning and argument)',tags:['logic','evidence','humility'],intro:[`A mapmaker has gone missing beyond the southern ridge. His unfinished chart shows the river passing under a mountain, which seems impossible.`,`Three scouts bring reports. One saw a waterfall. Another heard water beneath the rocks. The third, hoping to please the court, claims to have seen a tunnel but cannot say where.`,`The council calls it a simple question. Orin smiles. “Simple questions are where careless minds do their best work.”`],speaker:'MIRA · APPRENTICE ENGINEER',dialogue:`“A map is only a claim about the land,” says Mira, spreading out the chart. “A clever drawing does not make the mountain hollow. But neither does our disbelief seal the river.”`,question:'The council demands you mark the river on the military map. What do you authorize?',options:[['Mark a confirmed tunnel','Your certainty impresses the council until the first travelers discover a blocked ravine.'],['Mark it as an unverified possibility','The map is less elegant but tells travelers what is known and what is not.'],['Erase the disputed river','The map looks clean. An important possibility disappears because you disliked its uncertainty.']],trial:'inference',thesis:'Logic is a central, often forgotten, part of Stoicism. We should distinguish testimony, inference, possibility, and demonstrated conclusion.',depth:'Stoic philosophers developed sophisticated theories of propositions and inference. A disciplined thinker can say “I do not know” without embarrassment.',tension:'When action is urgent, how much evidence is enough? Can perfect certainty become an excuse never to decide?',history:'Epictetus’s Discourses address logic as training in handling arguments, not merely winning disputes.',journal:'What is a belief you hold strongly but have not carefully examined?'},
{title:'The Duel at Dawn',sub:'Courage without recklessness',vol:1,source:'ma',ref:'Meditations II.1; XI.18',tags:['courage','temperance','honor'],intro:[`At dawn, Lord Cassian's son challenges your friend Iven to a practice duel. Everyone knows Cassian outranks Iven. The crowd expects a humiliation, not a contest.`,`Iven grips the training sword too tightly. The herald assures you that noble custom cannot be interrupted. Sera is nowhere in sight.`,`A horn sounds once. There will be another before the duel begins.`],speaker:'IVEN · YOUR FRIEND',dialogue:`“If I refuse, they will call me a coward,” Iven whispers. “If I fight, they will laugh when I fall. Tell me how a brave person chooses.”`,question:'You have one moment to intervene. Choose a course.',options:[['Offer to duel in his place','The crowd cheers the grand gesture. Cassian now has two people to humiliate. You have accepted the challenge rather than examined its fairness.'],['Challenge the unequal terms publicly','Some call you insolent, but witnesses can no longer pretend the contest is honorable. Cassian grudgingly agrees to a fairer match.'],['Quietly ask Iven what he wants','Iven admits he wishes to refuse. You help him speak for himself. Some spectators sneer; others look away.']],trial:'riddle',thesis:'Stoic courage is a form of practical wisdom. It concerns facing genuine danger for reasons that survive examination—not seeking applause, pain, or risk for its own sake.',depth:'The Stoic virtues work together: courage without justice or good judgment is not automatically admirable.',tension:'Must a brave person always act publicly? When might retreat, refusal, or compromise require more courage?',history:'Marcus Aurelius often returns to doing what is right rather than becoming what the crowd expects.',journal:'Describe a brave action that looks like weakness from the outside.'},
{title:'The Broken Mill',sub:'Justice does not recognize noble blood',vol:1,source:'se',ref:'On Benefits; On Clemency',tags:['justice','power','class'],intro:[`Winter grain goes missing. The miller blames Tamsin, a servant's daughter, because she was seen by the storehouse after dark. Her mother begs for a hearing.`,`Your uncle insists that noble authority requires swift punishment. Yet Mira finds a broken seal on the outer gate. A wealthy merchant's carts passed through hours earlier.`,`The household waits for your order. For the first time, your words can change someone else's life.`],speaker:'MIRA · APPRENTICE ENGINEER',dialogue:`“If rank buys a person more belief,” Mira says, “truth has become something the rich can purchase. Can a house call itself noble when it does that?”`,question:'How do you proceed with the accusation?',options:[['Order a public investigation','You anger your uncle and delay the grain accounts, but everyone is allowed to offer evidence. The merchant becomes a suspect.'],['Privately release Tamsin without investigating','Tamsin is spared an unjust penalty, but the missing grain remains unexplained and suspicion spreads.'],['Accept your uncle’s accusation','Order is restored in public. In private, the servants stop telling the household what they know.']],trial:'council',thesis:'Stoicism describes humanity as a community of rational and social beings. Justice cannot be reduced to loyalty to your family, class, city, or side.',depth:'Marcus Aurelius, Seneca, and other Stoics lived within deeply unequal societies. Their ethical ideals can conflict with the institutions they themselves participated in.',tension:'Can you admire a philosopher’s principles while condemning their failure to apply those principles consistently?',history:'Seneca wrote on clemency while serving near the center of Roman imperial power. That context is essential.',journal:'What duty does a powerful person owe someone who cannot reward or punish them?'},
{title:'The Feast of a Hundred Dishes',sub:'Pleasure, desire, moderation',vol:1,source:'se',ref:'On the Happy Life',tags:['desire','pleasure','moderation'],intro:[`During the harvest feast, tables sag beneath sweet cakes, fragrant meat, fresh figs, and vessels of rare wine reserved for adults.`,`Lord Cassian wagers that nobody at the table could endure a week without luxury. Mira argues that enjoying a feast and needing a feast are very different things.`,`Orin sets a small bowl of plain lentils beside the gold dishes. “An experiment,” he says, “not a punishment.”`],speaker:'LORD CASSIAN · COURT MAGNATE',dialogue:`“There is no virtue in a miserable dinner,” Cassian declares. Orin replies, “Nor is there a virtue in pretending a fine dinner is the same as a good life.”`,question:'The host offers you a splendid gift in return for flattering his terrible speech. What do you do?',options:[['Accept and praise him extravagantly','You leave with a costly ring and the uncomfortable knowledge that your words were bought.'],['Thank him for the offer but decline the flattery','You preserve your honesty; he looks disappointed, but the evening continues.'],['Criticize him publicly to prove independence','Your refusal may be sincere, yet it becomes another performance for an audience.']],trial:'balance',thesis:'Stoics do not generally condemn all enjoyment. They question the judgment that pleasure, luxury, or status constitutes genuine goodness.',depth:'“Preferred indifferents” are things such as health and resources that may reasonably be chosen without becoming the measure of our worth.',tension:'If food, safety, comfort, and friendship matter greatly in practice, how can Stoics call them “indifferents”?',history:'Seneca’s wealth makes his criticisms of luxury both revealing and vulnerable to challenge.',journal:'What do you enjoy without needing it? What do you treat as necessary that may not be?'},
{title:'The Red Hour',sub:'Anger, impulse, and responsibility',vol:2,source:'se',ref:'On Anger, Books I–III',tags:['anger','responsibility','emotion'],intro:[`During weapons practice, Cassian insults Iven and shoves him into the dust. A few students laugh. Iven reaches for a wooden sword, hands shaking.`,`You feel heat in your face before forming a thought. Sera steps between them but says nothing. The hour seems to stretch thin and red.`,`Later, you discover Cassian did it deliberately: he wanted Iven to strike first and be expelled.`],speaker:'CAPTAIN SERA · MASTER OF THE YARD',dialogue:`“Anger can be a warning bell,” Sera says. “A warning bell is not a commander. But a calm face is not proof of a just heart, either.”`,question:'Sera asks what should happen next. How do you respond?',options:[['Demand instant punishment','Cassian is sentenced before witnesses speak. You may have guessed correctly, but haste undermines fairness.'],['Gather witnesses and propose consequences','Cassian’s scheme is exposed. Iven sees that justice need not mean pretending the insult was harmless.'],['Tell Iven to forget it','Iven hears an instruction to swallow an injury rather than a plan to prevent it happening again.']],trial:'impression2',thesis:'Seneca argues that unchecked anger distorts judgment. The first rush of bodily alarm is not the same as the decision to seek revenge.',depth:'Ancient Stoic accounts of passions are controversial. Modern science does not establish that a person can simply choose whether anger appears.',tension:'Can anger help us notice injustice? What should we preserve from anger without letting it govern every action?',history:'Seneca’s On Anger includes examples of rulers who mistake fury for strength.',journal:'How can someone respond firmly to wrongdoing without trying to hurt the wrongdoer?'},
{title:'The Flood Below',sub:'Duty, uncertainty, and practical wisdom',vol:2,source:'ma',ref:'Meditations VI.30; VIII.7',tags:['duty','uncertainty','action'],intro:[`Storm water breaches the lower river wall. The east quarter floods; the west towers remain dry. The citizens on the heights insist the danger has passed.`,`Your family possesses three transport boats. The council demands one to guard its archives. Sera asks for one to move medicine. Fisherfolk need all three to carry trapped families.`,`No plan saves everything. Every delay is itself a decision.`],speaker:'MASTER ORIN · THE HOUSE TUTOR',dialogue:`“Virtue is not a trick that removes tragedy,” Orin says. “You must judge with what you know, act, then face the result without inventing a perfect certainty you never possessed.”`,question:'Where do you send the first boats?',options:[['Prioritize stranded families','Families reach safety; some medical crates are lost. Sera argues that the remaining boats must move supplies at once.'],['Prioritize medical supplies','The clinic stays open, but some families wait longer in dangerous homes. You must account for that human cost.'],['Divide the boats among all tasks','The response is more balanced but each task proceeds slowly. The council calls your plan indecisive; others call it fair.']],trial:'tactics',thesis:'Stoic practical wisdom requires choosing among imperfect options. Outcomes matter to planning even if they are not the final measure of character.',depth:'Accepting an outcome is not the same as refusing to plan, repair, or improve. A responsible leader revises bad decisions without demanding total control.',tension:'If two duties collide, can “be virtuous” actually tell us which to choose?',history:'Marcus often counsels attention to one’s social task, modesty about knowledge, and action suited to nature.',journal:'Recall a time you had to act without knowing all the facts. What would good judgment have looked like?'},
{title:'The Empty Chair',sub:'Grief, love, mortality',vol:2,source:'ma',ref:'Meditations IV.3; IX.3',tags:['grief','death','love'],intro:[`The flood withdraws, leaving mud on the stairways and boats in the streets. An elderly healer who helped the injured has died during the night.`,`At the memorial, some praise his courage. Others sit quietly, unable to speak. Iven asks whether the Stoics think tears are a failure.`,`For once Orin does not answer quickly. He takes a seat beside Iven and watches the candles burn.`],speaker:'MASTER ORIN · THE HOUSE TUTOR',dialogue:`“If anyone uses my teaching to tell you that love should not hurt when someone dies,” he says, “make them explain themselves. There is more to examine here than a command not to weep.”`,question:'Iven is struggling at the memorial. What do you offer?',options:[['Sit with him, without a speech','The silence does not heal the loss. But Iven is not left alone with it.'],['Offer a Stoic argument about mortality','Iven hears you out later, but at first asks for your company rather than a lesson.'],['Ask him what he needs','He asks to tell a story about the healer. You listen while the candles burn low.']],trial:'riddle2',thesis:'Stoics urge reflection on mortality and the impermanence of relationships. But the texts contain tensions about grief and emotional attachments.',depth:'No serious education should pretend grief can be solved like a puzzle. The philosophical question is how to love finite beings and face loss with honesty.',tension:'Does Stoic detachment protect love, or threaten to make love less human? There is no one-sentence answer.',history:'Marcus Aurelius wrote candidly about transience and the deaths of those around him.',journal:'What do you think it means to remember a person well? You may write about a fictional person instead.'},
{title:'The Clockmaker’s Wager',sub:'Time is finite',vol:3,source:'se',ref:'On the Shortness of Life (external text reference)',tags:['time','priorities','mortality'],intro:[`In the old clocktower, a craftsman offers a strange wager: he will give the court one additional hour each day, if any noble can tell him which hours are already being spent well.`,`The courtiers name audiences, hunts, reports, and ceremonies. Mira names sleep, work, play, and friendship. Orin asks if the clockmaker can also grant a life in which none of these moments are wasted.`,`The clockmaker cannot. He offers you a blank schedule instead.`],speaker:'THE CLOCKMAKER · KEEPER OF HOURS',dialogue:`“A lost hour cannot be bought from tomorrow,” the clockmaker says. “But a crowded hour is not always a valuable one, and an idle hour is not always wasted.”`,question:'Your schedule contains too many demands. What will you change?',options:[['Cut every pleasure and practice more','Your skills may improve, but exhaustion makes you resent even what you once loved.'],['Protect time for duty, rest, and people','Some duties receive less attention. You accept limits rather than inventing unlimited hours.'],['Refuse to plan: time must flow freely','You enjoy the freedom for a while, then discover that the loudest demands have occupied your day.']],trial:'balance2',thesis:'Seneca argues that time is precious and frequently squandered. His criticism is not a command to turn every waking minute into measurable productivity.',depth:'The shortness of life is partly a question about attention, ownership of one’s days, and the activities we choose for ourselves.',tension:'Who has the freedom to choose how to spend their time? Servants, soldiers, and laborers may have much less discretion than princes.',history:'Seneca’s On the Shortness of Life is distinct from the essays included in our linked Seneca anthology; seek a public-domain edition before reproducing a translation.',journal:'If you had one more hour each week, what would genuinely make it a good hour?'},
{title:'The Wheel of Fortune',sub:'Reputation, wealth, success and failure',vol:3,source:'ep',ref:'Enchiridion §§19, 25',tags:['fortune','status','reputation'],intro:[`The harvest festival brings an archery contest. A single arrow will earn its winner a place at the high table. The loser will be remembered by the court for an entire season.`,`Iven shoots beautifully and misses the center by the breadth of a finger. Cassian’s arrow, caught by a sudden wind, strikes the center.`,`The crowd proclaims that Cassian has the better soul. Orin raises an eyebrow.`],speaker:'MASTER ORIN · THE HOUSE TUTOR',dialogue:`“Is it reasonable to prepare carefully and hope to win? Of course. Is it reasonable to conclude that a favorable gust of wind reveals a superior character? Now you must argue.”`,question:'Cassian offers to trade his prize for your public praise. What do you do?',options:[['Praise him to receive the prize','The reward is pleasant, but you have treated your public words as currency.'],['Congratulate him without accepting a bargain','Cassian keeps the prize. You can value the event without agreeing that victory proves virtue.'],['Call the contest meaningless','You dismiss something your friends cared about, perhaps because you dislike losing.']],trial:'inference2',thesis:'The Stoics distinguished virtue from fortune. Money, health, skill, reputation, and victory may be preferred, but they cannot by themselves establish a good character.',depth:'This does not mean material conditions are irrelevant. A society should still care whether its people are hungry, ill, or oppressed.',tension:'Why compete at all if winning is not the most important thing? What makes a fair contest worthwhile?',history:'Epictetus challenges the desire to be approved by others, especially when it demands surrendering one’s judgment.',journal:'What would you still want to learn if no one could praise you for it?'},
{title:'The Stars and the Chain',sub:'Fate, nature, providence, freedom',vol:3,source:'ed',ref:'Discourses I.1; II.5',tags:['fate','nature','determinism'],intro:[`Under a cold sky, the observatory’s astronomer shows you an ancient machine: wheels turning wheels, each movement caused by the last.`,`“Perhaps the whole cosmos is such a mechanism,” she says. “The early Stoics thought it governed by rational order. What do you think becomes of freedom then?”`,`Iven points at the stars. “If everything is caused, was our conversation already waiting in the gears?”`],speaker:'ASTRONOMER LYS · THE OBSERVATORY',dialogue:`“A cause is not the same as an excuse,” says Lys. “And not every question has a discovered answer. Let us be precise about what the ancients claimed.”`,question:'Which claim would you investigate first?',options:[['If fate exists, effort is useless','Lys asks whether effort itself could be one of the causes by which a result comes about.'],['If choices have causes, responsibility needs explanation','Lys opens a second chart: this is a serious philosophical problem, not a foolish question.'],['The universe must be random for us to be free','Lys asks whether random movement would give you more authorship over a choice.']],trial:'council2',thesis:'Classical Stoicism involves logic, physics, and ethics. Its physics includes a providential, causally ordered cosmos; its ethics still assigns a central place to human deliberation.',depth:'Modern readers can study Stoic ethics while rejecting Stoic cosmology, but should be honest that this changes the system.',tension:'Could a determined world contain meaningful responsibility? What would count as an answer?',history:'Stoic fate is not the view that effort is pointless. Philosophical debates about causation were central to the ancient school.',journal:'Does knowing why you acted make the action more yours or less yours? Why?'},
{title:'The Open Gate',sub:'Freedom, roles, and obedience',vol:4,source:'ep',ref:'Enchiridion §§17, 30',tags:['duty','liberty','authority'],intro:[`A courier from the capital arrives with an imperial command. House Vale must hand over its river maps and supplies. The order is lawful. It will also leave the poorest quarter nearly defenseless.`,`Your uncle says loyalty requires obedience. Mira says justice may require refusal. Sera says that defiance carries consequences for people who did not volunteer for danger.`,`The citadel’s bronze gate stands open, and the courier waits.`],speaker:'CAPTAIN SERA · MASTER OF THE YARD',dialogue:`“People will call different things courage, loyalty, and treason,” Sera says. “Their words do not settle the matter. Nor does your desire to be remembered as a hero.”`,question:'How will you respond to the imperial order?',options:[['Refuse publicly and at once','The court admires your bravery, but the imperial guards prepare to seize what they came for. The quarter faces new danger.'],['Negotiate and document the human cost','The courier agrees to carry your petition and take only part of the stores for now. The capital may still refuse.'],['Comply to avoid conflict','The capital is pleased. Families in the lower quarter begin preparing for shortages. You must live with that foreseeable cost.']],trial:'riddle3',thesis:'A Stoic examines duties within social roles, but role and authority do not erase the claims of justice or reason.',depth:'Ancient Stoics differed in their political circumstances and actions. Marcus wielded imperial authority; Epictetus had lived under domination.',tension:'When does loyalty become complicity? Who should bear the risks of principled disobedience?',history:'Read Epictetus’s role metaphors critically; they do not settle modern questions of civil rights or political authority.',journal:'What makes an order legitimate? When should someone be allowed to disobey?'},
{title:'The Three Philosophers',sub:'The council disagrees',vol:4,source:'ma',ref:'Meditations V.16; IX.42',tags:['debate','criticism','schools'],intro:[`Orin leads you to a small circular room lined with shelves. At its center stand three empty chairs, each bearing a name: EPICTETUS, SENECA, MARCUS.`,`“People often ask a philosophy for one answer,” he says. “But these three men did not have one life. Their words belong to different circumstances, and their words need not agree.”`,`A fourth chair bears no name. It is for you.`],speaker:'MASTER ORIN · THE HOUSE TUTOR',dialogue:`“The highest compliment you can pay a thinker is to take the argument seriously enough to question it. Idolizing them is not the same as learning from them.”`,question:'Which charge against Stoicism deserves the first hearing?',options:[['It asks too much emotional restraint','Orin produces passages on grief and anger. “Then we shall ask whether the demand is wise, or even possible.”'],['It can excuse injustice through acceptance','Mira joins the hearing: “Then we must examine the difference between accepting facts and consenting to wrongdoing.”'],['Its thinkers often contradicted their teachings','Orin nods. “We shall study their lives alongside their ideas, without pretending the contradiction does not matter.”']],trial:'council3',thesis:'Serious philosophical education includes internal tensions, historical failures, and rival positions. Stoicism is neither a magic formula nor a settled truth.',depth:'Epicureans, Aristotelians, Skeptics, and modern philosophers offer alternatives worth learning. A philosophy becomes stronger through honest challenge.',tension:'Is a theory refuted if its author fails to follow it? What evidence would actually change your mind?',history:'Marcus, Seneca, and Epictetus write in different genres: private notes, essays/letters, and classroom instruction recorded by a pupil.',journal:'Make the strongest objection you can to an idea in this book. Then try to answer your own objection fairly.'},
{title:'The Siege of the Citadel',sub:'A final trial with no perfect answer',vol:4,source:'ma',ref:'Meditations X.16; XI.4',tags:['integrated judgment','leadership','uncertainty'],intro:[`On the last night of winter, the warning bells sound from the east. An armed column approaches the old causeway. The imperial courier's promise has been broken; a commander intends to seize the remaining grain.`,`The city is divided. Your uncle wants the gates barred to everyone. Mira asks to shelter travelers outside the wall. Sera reports a narrow passage where supplies can be moved, but only if soldiers leave the gate unguarded.`,`Orin places the black primer in your hands. “I have no final answer for you,” he says. “Look carefully. Choose. Be willing to explain, revise, and answer for what follows.”`],speaker:'CAPTAIN SERA · MASTER OF THE YARD',dialogue:`“Leadership is not the absence of fear,” Sera says. “And honor is not the audience's applause. Tell us what you value, whose interests you considered, and what danger you were willing to impose on others.”`,question:'The council asks for your first command. What do you decide?',options:[['Open the gates to shelter the travelers','Many enter before the soldiers close in. The city gains allies and mouths to feed; its walls are now harder to defend.'],['Secure the walls and attempt negotiations','The defenses remain intact. Travelers wait in peril while the commander listens to an uncertain offer.'],['Use the passage to move food toward the lower quarter','The most vulnerable receive supplies. The reduced guard leaves the wall exposed for several hours.']],trial:'tactics2',thesis:'There is no secret ending that certifies a perfect Stoic. Philosophy trains attention, judgment, and responsibility. It does not abolish hard choices.',depth:'The four cardinal virtues are not separate scores. Wisdom, justice, courage, and temperance inform one another; context matters.',tension:'Could two thoughtful people understand the same principles and reasonably choose differently?',history:'Marcus Aurelius urged himself to stop talking about what a good person is and act, but his writings remain an invitation to scrutiny.',journal:'What kind of person do you want to become—and which ideas in this primer would you refuse to accept without more evidence?'}
];

 impression:{kind:'classify',title:'The Court of Appearances',intro:'Separate an observation from the judgment placed upon it. A statement can be sincere and still not be proved.',labels:['Observable / reported fact','Interpretation / conclusion'],items:[['Three people told me that Sera criticized my training.',0],['Sera despises me.',1],['Sera’s criticism proves I will fail.',1],['Someone knocked three times at the door.',0],['The visitor intends to harm me.',1]],debrief:'An “observation” can still be unreliable testimony. Classification is only the first move; examine how it was learned.'},
 sort:{kind:'classify',title:'The Two Gates Drill',intro:'Sort what is directly yours to choose, what you can affect without controlling, and what you cannot choose.',labels:['My choice / effort','Influence, not command','Not mine to decide'],items:[['Whether to speak truthfully in this conversation',0],['How the audience judges my speech',2],['Whether a friend accepts my apology',1],['Whether I prepare for tomorrow’s examination',0],['Whether a storm arrives',2],['Whether a team succeeds after I contribute',1]],debrief:'The boundaries are sometimes contestable. In particular, we influence others without owning their decisions. The useful skill is examining the boundary, not worshiping a chart.'},
 inference:{kind:'riddle',title:'The Mapmaker’s Logic',intro:'The scouts say: “If the tunnel is open, a traveler can pass through.” A traveler cannot pass through. What follows under that premise?',choices:['The tunnel is not open','The river does not exist','The mountain is not real','The tunnel must be open'],correct:0,explain:'This is a valid logical form called modus tollens: if P then Q; not Q; therefore not P. But an argument can be valid even if its starting premise is false.'},
 riddle:{kind:'riddle',title:'The Measure of Courage',intro:'Which describes the most carefully defended account of courage?',choices:['Never being afraid','Choosing risk whenever others watch','Acting for good reasons despite fear, including when restraint is best','Winning the fight'],correct:2,explain:'The strongest answer connects courage with judgment. The question is about the concept, not a score for your earlier story choice.'},
 council:{kind:'riddle',title:'The Weighing of Testimony',intro:'The miller says “Tamsin was nearby, so she stole the grain.” What is the chief logical problem?',choices:['Being nearby establishes opportunity, not guilt','A miller can never be trusted','A servant cannot commit theft','An accusation is always false'],correct:0,explain:'Evidence of opportunity is relevant but insufficient. Neither rank nor sympathy replaces investigation.'},
 balance:{kind:'allocation',title:'The Steward’s Table',intro:'You have 12 tokens of time to distribute. This is not a morality test; the consequence changes with your priorities.',categories:['Training','Friends & family','Rest','Service'],target:12,debrief:'No division makes time infinite. A sensible plan can still disappoint someone. Try an arrangement, then explain why you chose it.'},
 impression2:{kind:'classify',title:'The Red Hour Examination',intro:'Distinguish events, automatic sensations, and considered responses. Which best describes each?',labels:['Event','Initial sensation','Deliberate response'],items:[['Cassian pushes Iven.',0],['Your heart races before you have decided what to do.',1],['You ask a witness to explain what happened.',2],['Your face becomes hot.',1],['You decide that Cassian must be punished without a hearing.',2]],debrief:'A deliberate response can still be mistaken or unwise. The classification makes room for responsibility without pretending involuntary sensations are moral failures.'},

 riddle2:{kind:'riddle',title:'The Candle Question',intro:'A candle burns for one hour. You light another candle from it. Which statement follows?',choices:['The first candle never mattered','The second candle is the first candle','The first candle’s flame can end while its effects continue','The first candle was immortal'],correct:2,explain:'The image explores continuity and influence without pretending that an argument removes the pain of loss.'},

 inference2:{kind:'riddle',title:'The Fortune of the Archer',intro:'Iven prepared carefully and missed by chance. Cassian prepared poorly and hit by chance. Which conclusion is strongest?',choices:['Cassian has better character','Iven has better character, with certainty','One result cannot by itself establish either person’s character','Preparing never matters'],correct:2,explain:'Skill and preparation affect the odds; one lucky outcome is not a full judgment of a person. This does not mean consequences never matter.'},
 council2:{kind:'riddle',title:'The Astronomer’s Machine',intro:'“If everything has causes, trying makes no difference.” Which objection goes deepest?',choices:['Trying is itself among the causes of outcomes','No one has ever observed causation','Stars are prettier than gears','The argument sounds unpleasant'],correct:0,explain:'Even in a deterministic account, effort can make a causal difference. Whether that gives us freedom is a further and unresolved question.'},
 riddle3:{kind:'riddle',title:'The Imperial Command',intro:'A law is properly issued, yet obeying it may harm innocent people. What question has not been settled?',choices:['What color is the imperial seal?','Whether legal authority by itself makes an action just','Whether messengers should ride horses','Whether the emperor has a title'],correct:1,explain:'Lawfulness and justice are different concepts. The puzzle does not itself determine whether defiance is wise or what costs others may bear.'},

const LIBRARY=[
{group:'Foundations',title:'What Is a Stoic?',tag:'The whole philosophy',source:'ed',ref:'Discourses I.4; II.9',content:'Stoicism began in Athens around the third century BCE. It is a school of philosophy concerned with logic, the natural world, and how human beings should live. Its claim is more demanding than “stay calm”: living well depends chiefly on excellent rational and social character. Stoics attempted to train judgments, desires, actions, and relationships. They practiced argument, attention, reflection, and exercises. The school was never simply a collection of inspirational sayings.',challenge:'If somebody stays perfectly calm while acting cruelly, are they a good Stoic? Why not?'},
{group:'Foundations',title:'Impressions and Assent',tag:'How a belief begins',source:'ep',ref:'Enchiridion §5; Discourses II.18',content:'An impression is how something initially appears: “I have been insulted,” “I am in danger,” “This prize will make me happy.” The Stoic discipline is to examine impressions before giving assent—treating them as reliable and acting upon them. Feelings and bodily reactions may arise automatically; the Stoics’ distinction does not license blaming a child for being frightened or upset. Test what is observed, what is inferred, and what remains unknown.',challenge:'A friend does not answer a message. List three explanations before choosing one.'},
{group:'Foundations',title:'The Discipline of Choice',tag:'Agency and limits',source:'ep',ref:'Enchiridion §§1, 8',content:'Epictetus distinguishes what belongs to our own faculty of choice from everything else. His famous distinction is often simplified into “control what you can.” A subtler account distinguishes direct choice, influence, and an outcome outside our command. You can choose whether to study now, but not guarantee a grade, force someone to like you, or make a storm stop. The Stoic commitment is to use your capacity for judgment well while acknowledging reality.',challenge:'Can you control whether a bad idea appears in your mind? What about whether to examine it?'},
{group:'Foundations',title:'Logic Is Not Decoration',tag:'Validity and evidence',source:'ed',ref:'Discourses I.7',content:'Ancient Stoics treated logic as essential. They developed theories of propositions, inference, and argument. A valid argument is one in which its conclusion follows from its premises; valid does not automatically mean true. Soundness adds true premises. Some arguments feel convincing because of status, emotion, or repetition. Learn to spot missing evidence, ambiguous words, false alternatives, and hasty generalizations.',challenge:'“All honorable commanders are brave. I am brave. Therefore I am honorable.” Does that follow?'},
{group:'Virtue',title:'The Four Cardinal Virtues',tag:'Wisdom, justice, courage, moderation',source:'ma',ref:'Meditations III.6; VII.54',content:'Stoics speak of wisdom (judging well), justice (treating others rightly), courage (facing what deserves to be faced), and temperance (using desires appropriately). They are not four independent bars that can be filled with points. Courage disconnected from justice can become aggression; moderation without wisdom can become needless deprivation. An action should be studied as a whole.',challenge:'Could a fearless bully be courageous in the Stoic sense?'},
{group:'Virtue',title:'Virtue and Human Flourishing',tag:'What makes a life good?',source:'se',ref:'On the Happy Life',content:'The Stoics hold that virtue, excellent character expressed in choice and conduct, is the only true good. This is stronger than saying virtue is important. A wealthy, popular, healthy person can act badly; a person in hardship can still act nobly. But calling health and safety “indifferent” does not make them unimportant to policy, compassion, or everyday decisions. This demanding Stoic thesis deserves careful criticism.',challenge:'If a kind person suffers terribly, can you say their life is flourishing without insulting the reality of their pain?'},
{group:'Virtue',title:'Preferred Indifferents',tag:'Health, money, reputation',source:'ed',ref:'Discourses II.5',content:'An “indifferent” in Stoic vocabulary is something that does not by itself make a person morally good or bad. Some indifferents—health, shelter, adequate food, friendship, education—may be naturally preferred. Others are dispreferred. The wise person selects responsibly among them but does not make success with them a condition for moral worth. This is not the same as indifference to other people’s well-being.',challenge:'If hunger does not destroy moral worth, does that excuse a ruler who lets others starve?'},
{group:'Virtue',title:'Courage and Its Counterfeits',tag:'When to act, when to refuse',source:'ma',ref:'Meditations XI.18',content:'Courage is not aggression, daring, or a lack of fear. For the Stoic, it is clear judgment in the face of genuine threats and costs. Sometimes courage requires confrontation; sometimes saying “no,” admitting error, protecting someone weaker, or refusing a pointless contest. Courage must remain joined to justice and practical wisdom. Heroic theater can be another way to seek approval.',challenge:'Which is more courageous: accepting a dare or refusing it while everyone laughs?'},
{group:'Virtue',title:'Justice Beyond the Household',tag:'The human community',source:'ma',ref:'Meditations II.1; VI.44',content:'Stoics describe humans as social and rational creatures whose lives are interdependent. They develop an idea of cosmopolitanism: moral concern should not end at the household, city, or empire. Historically, Stoic writers nevertheless inhabited Roman systems of conquest, slavery, and class hierarchy. Read their universalistic claims alongside those failures. A reader need not excuse imperial power because an emperor wrote beautiful ethical notes.',challenge:'Who in the city has the least power, and how would they evaluate the council’s idea of fairness?'},
{group:'Emotion',title:'The First Movement of Emotion',tag:'Startle, fear, anger',source:'se',ref:'On Anger II',content:'Seneca distinguishes the initial involuntary movement that strikes us from a sustained passion involving further judgment. This anticipates a useful lesson: bodily alarm is not a moral failure. Ancient Stoic psychology differs from modern research; emotion is not simply a switch someone can choose to turn off. Reflection may influence how we respond, and repeated habits may shape our responses over time.',challenge:'Describe a time when your body reacted before you had formed a judgment.'},
{group:'Emotion',title:'Anger and Justice',tag:'Refusing revenge',source:'se',ref:'On Anger I–III',content:'Seneca fears anger as a force that can make punishment disproportionate and turn a sense of injury into a wish to harm. A Stoic can oppose injustice forcefully without being ruled by vengeance. Yet modern thinkers argue that anger sometimes reveals real wrongdoing and motivates social reform. The serious question is what information anger provides, what it distorts, and how to act justly.',challenge:'How can you demand consequences for wrongdoing without trying to humiliate the wrongdoer?'},
{group:'Emotion',title:'Grief and Attachment',tag:'Loving mortal people',source:'ma',ref:'Meditations IV.3; IX.3',content:'Marcus frequently reflects on death and impermanence. Ancient Stoics sometimes make stringent claims about attachment, grief, and tranquility. Read these sympathetically and critically: the love of a parent, friend, or companion need not be judged by how few tears a person sheds. Philosophical exercises may help us remember finitude and value the present, but they do not erase the ordinary human experience of loss.',challenge:'Can accepting that a person will die make you more loving rather than less?'},
{group:'Emotion',title:'Pleasure, Desire, and Habit',tag:'Enjoy without enslavement',source:'se',ref:'On the Happy Life',content:'Stoics distinguish using pleasurable things well from treating pleasure as the highest good. Good food, art, play, and comfort can be enjoyed. The question is whether desire has acquired such authority that a person lies, abandons duty, or injures others to satisfy it. Discipline should not become a vanity contest about who can endure the most hardship.',challenge:'How do you tell the difference between enjoying a game and feeling compelled to play it?'},
{group:'Society',title:'Roles and Duties',tag:'Family, citizen, stranger',source:'ep',ref:'Enchiridion §§17, 30',content:'We belong to relationships and institutions: child, sibling, friend, pupil, neighbor, citizen, commander. The Stoics consider obligations arising from these roles. But a role cannot always justify the demands made in its name. Commands can be unjust; loyalties can conflict. The metaphor of being given a role in a play is useful for considering circumstance but cannot replace moral examination of the script itself.',challenge:'When does loyalty to a friend become disloyalty to truth?'},
{group:'Society',title:'Power and Clemency',tag:'The obligations of rank',source:'se',ref:'On Clemency',content:'Seneca wrote about mercy, punishment, and rulers’ responsibilities. His own position near Nero gives the writing a troubling historical setting. A powerful person may be praised for restraint, but justice requires more than the powerful occasionally choosing to be generous. The student should ask how fair laws, institutions, and the voices of the powerless change the meaning of clemency.',challenge:'Is mercy enough when someone should never have been punished in the first place?'},
{group:'Society',title:'Friendship and Independence',tag:'Care without ownership',source:'ma',ref:'Meditations VI.30; XI.18',content:'Stoic independence does not demand living alone. Human beings are social. A friend is not a possession to command or a mirror whose duty is to admire us. Friendship can involve truth-telling, care, forgiveness, boundaries, and the willingness to disagree. The Stoic attempt to avoid dependence on approval should not be confused with refusing help or becoming emotionally distant.',challenge:'What is something a good friend might say that you would rather not hear?'},
{group:'Cosmos',title:'Nature and the Cosmos',tag:'The Stoic physical world',source:'ed',ref:'Discourses I.6',content:'Classical Stoics believed the cosmos was an ordered, living whole permeated by reason or logos. Their physics was materialist in an ancient sense, unlike many later religious systems. They regarded living in agreement with nature as both an ethical and cosmic aspiration. These ancient claims are not findings of modern science. They belong in a serious curriculum because Stoic ethics grew within them.',challenge:'Can you keep Stoic ethical ideas if you reject their picture of the universe?'},
{group:'Cosmos',title:'Fate and Agency',tag:'Compatibilist difficulties',source:'ed',ref:'Discourses I.1; II.5',content:'Stoics argued that events belong to a causally connected order, yet they still assigned significance to deliberation and assent. One possible response is that our decisions are themselves causes, not exceptions to causation. That does not settle every free-will objection. Read opposing accounts of determinism, chance, responsibility, and what it means for an action to be ours.',challenge:'If you make a choice because of your character, and your character has causes, what makes the choice yours?'},
{group:'Cosmos',title:'Mortality and the Good Life',tag:'Finitude and meaning',source:'ma',ref:'Meditations II.11; IV.17',content:'Marcus repeatedly instructs himself to remember death and the brevity of life. The point is partly attention: postponed kindness, wasted years, and anxious pursuit of recognition may look different when measured against a finite life. Ancient writings sometimes discuss self-chosen death in difficult historical circumstances. A young reader can study those arguments critically without treating them as guidance for handling personal distress.',challenge:'Does knowing that a good experience will end make it less valuable or more valuable?'},
{group:'Cosmos',title:'Time Is Not a Trophy',tag:'Seneca on wasted life',source:'se',ref:'Related work: On the Shortness of Life',content:'Seneca argues that people lose much of life by allowing it to be consumed by vanity, needless preoccupation, and distraction. This should not be reduced to the demand to be productive every minute. Leisure, sleep, play, friendship, and contemplation can be worthwhile. The ability to control one’s time is distributed unequally across social classes, jobs, and circumstances.',challenge:'Who does not have the freedom to reorganize their time, and what duties follow for those who do?'},
{group:'Critique',title:'Stoicism and Other Schools',tag:'A real contest of ideas',source:'ed',ref:'Discourses I.23',content:'Epicureans took pleasure understood carefully and freedom from disturbance as important to flourishing. Aristotelians treated external goods as more significant for happiness. Skeptical philosophers pressed hard on claims to certainty. These summaries are starting points, not replacements for original texts. It is legitimate to conclude that a rival school better answers a particular question.',challenge:'What is the best argument you can imagine against the Stoic claim that virtue alone is enough?'},
{group:'Critique',title:'Seneca’s Contradictions',tag:'Wealth and imperial power',source:'se',ref:'On the Happy Life; On Clemency',content:'Seneca was a wealthy Roman statesman and advisor to Nero. He urged self-discipline and discussed mercy while operating in the power structures he criticized. A fair study investigates these tensions without the lazy conclusion that every statement is false because its author was flawed. The conduct of philosophers matters historically and morally; logical evaluation of their arguments is a separate task.',challenge:'What evidence would show a person’s philosophical advice is insincere? What would show it is true anyway?'},
{group:'Critique',title:'Marcus the Emperor',tag:'Private ideals, public rule',source:'ma',ref:'Meditations I.14; VI.30',content:'Marcus Aurelius wrote extraordinarily thoughtful private notes while ruling a militarized empire. His life included campaigns, immense authority, and participation in systems that modern students should scrutinize. An emperor’s self-criticism is illuminating, but it should not be treated as proof that his policies were just. Ask how a person on the receiving end of Roman power might judge the same reign.',challenge:'Can a ruler cultivate personal virtue while serving an unjust institution?'},
{group:'Critique',title:'Epictetus and Freedom',tag:'A philosopher once enslaved',source:'ep',ref:'Enchiridion §1; Discourses I.1',content:'Epictetus had been enslaved and later taught philosophy. His emphasis on inner freedom is powerful precisely because it was developed in a world of coercion. But it can be misused if people with power tell the oppressed simply to change their attitudes instead of addressing material harm. His idea of what cannot be seized from us deserves study alongside the obligations to end coercion.',challenge:'Why is “you can control your response” not a sufficient response to someone suffering injustice?'},
{group:'Critique',title:'A Note on Difficult Subjects',tag:'Honest, responsible study',source:'ma',ref:'Meditations X.8; related ancient debates',content:'Ancient philosophy includes war, slavery, domination, suffering, death, self-chosen death, and stark moral advice. This primer names such subjects honestly and treats them as historical and philosophical questions, not instructions to students. In particular, any discussion of voluntary death belongs in the context of the ancient debate, with no romanticization or suggestion that self-harm solves life’s problems. The student can always skip a question or discuss it with a trusted adult.',challenge:'Can an idea be important to understand even when you reject it completely?'}
