s been underwater, inland, tropical, frozen, or attached to a completely different continent.","brief":"Ancient Earth lets you spin a reconstructed globe hundreds of millions of years into the past and search for a modern city. The coastlines change because the plates move; the familiar dot stays as a reference so the scale of geological change becomes personal.","main":{"label":"TIME-TRAVEL YOUR LOCATION","source":"ANCIENT EARTH • INTERACTIVE GLOBE","url":"https://dinosaurpictures.org/ancient-earth/","icon":"☄","kind":"TIME GLOBE","time":"10–20 MIN","mission":"Search for a city you know. Jump to at least three ages—including one before dinosaurs—and note whether that location is ocean, coast, inland, or on another landmass.","family":"ancient-earth","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"plate tectonics continental drift animation short","source":"PBS EONS / GEOLOGY"},"more":{"label":"MOVE THE CONTINENTS CONTINUOUSLY","source":"REALSIZE.WORLD • CONTINENTAL DRIFT","url":"https://realsize.world/en/time/continental-drift?age=250&entity=pangaea","icon":"↔"},"id":"5-1"},{"title":"Watch Continents Assemble","hook":"Pangaea was only one frame in a much longer planetary animation.","brief":"Continental drift did not begin with Pangaea and it did not end when Pangaea broke apart. RealSize.World lets you move through reconstructions reaching far deeper into Earth history, while also explaining where the model is confident and where it becomes speculative.","main":{"label":"DRAG DEEP TIME","source":"REALSIZE.WORLD • CONTINENTAL DRIFT","url":"https://realsize.world/en/time/continental-drift?age=250&entity=pangaea","icon":"↔","kind":"TIME MAP","time":"10–20 MIN","mission":"Start at Pangaea, move toward today, then jump backward beyond Pangaea. Find one ancient landmass name you have never heard before and track what happens to it.","family":"realsize","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"supercontinents Pangaea Rodinia Nuna animation","source":"PBS EONS / GEOLOGY"},"more":{"label":"SPIN ANOTHER ANCIENT GLOBE","source":"ANCIENT EARTH","url":"https://dinosaurpictures.org/ancient-earth/","icon":"🌎"},"id":"5-2"},{"title":"Random Teleport","hook":"You get dropped somewhere on Earth with no warning. Figure out where the world has put you.","brief":"MapCrunch uses Street View to teleport you to a random real place. There is no lesson screen and no correct path; the learning happens because you start reading road signs, architecture, vegetation, road markings, driving side, terrain, and language as clues.","main":{"label":"TELEPORT ME","source":"MAPCRUNCH • RANDOM STREET VIEW","url":"https://www.mapcrunch.com/","icon":"⌖","kind":"EXPLORATION GAME","time":"10–∞ MIN","mission":"Use Stealth mode if available. Before revealing the location, make your best country guess and list three visual clues that pushed you there.","family":"mapcrunch","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how to identify countries street view geography clues","source":"GEOGRAPHY NOW / GEOGUESSR"},"more":{"label":"FLY THERE AFTERWARD","source":"GOOGLE EARTH","url":"https://earth.google.com/web/","icon":"🌎"},"id":"5-3"},{"title":"Earth in One Year","hook":"Compress 4.54 billion years into twelve months and watch humans arrive in the final minutes.","brief":"EarthViewer lets you move through geological time while continents, climate, carbon dioxide, oxygen, biodiversity, and major events change together. The useful shock is scale: almost everything humans think of as history happens at the very end.","main":{"label":"SCRUB THROUGH DEEP TIME","source":"HHMI BIOINTERACTIVE • EARTHVIEWER","url":"https://www.biointeractive.org/classroom-resources/earthviewer","icon":"⌛","kind":"DEEP-TIME EXPLORER","time":"12–25 MIN","mission":"Jump to the dinosaurs, the first land plants, and the present. Compare the map and atmosphere each time, then find how late humans arrive.","family":"hhmi","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Earth history 4.5 billion years visual timeline","source":"PBS EONS / DEEP TIME"},"more":{"label":"PUT DEEP TIME ON A CALENDAR","source":"REALSIZE.WORLD • INTERACTIVE ATLAS","url":"https://realsize.world/en","icon":"📅"},"id":"5-4"},{"title":"Earthquakes Right Now","hook":"The planet is cracking somewhere almost constantly; most of it simply never reaches you.","brief":"The USGS Latest Earthquakes map turns seismic monitoring into a live global layer. You can filter by magnitude and time, zoom into clusters, open individual events, and see how plate boundaries emerge from thousands of real measurements.","main":{"label":"OPEN THE LIVE QUAKE MAP","source":"USGS • LATEST EARTHQUAKES","url":"https://earthquake.usgs.gov/earthquakes/map/","icon":"⌁","kind":"LIVE SCIENCE MAP","time":"10–20 MIN","mission":"Show the last 24 hours, find the strongest earthquake, then zoom out and trace a line or arc of smaller events. Guess which plate boundary you are seeing before checking a tectonic map.","family":"usgs-earthquakes","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"earthquake plate boundaries seismic waves short visual","source":"USGS / GEOLOGY"},"more":{"label":"TRACE PLATE MOTION THROUGH DEEP TIME","source":"HHMI • EARTHVIEWER","url":"https://www.biointeractive.org/classroom-resources/earthviewer","icon":"🌎"},"id":"5-5"},{"title":"Watch Lightning Happen","hook":"Storms become a living electrical map with strikes arriving seconds after they happen.","brief":"LightningMaps visualizes strike detections from the Blitzortung community network on a real-time world map. A storm cell that looks like a colored blob on a weather forecast becomes a stream of discrete electrical events moving across geography.","main":{"label":"CHASE THE STORM","source":"LIGHTNINGMAPS.ORG • REAL-TIME STRIKES","url":"https://www.lightningmaps.org/?lang=us","icon":"⚡","kind":"LIVE WEATHER MAP","time":"8–20 MIN","mission":"Find an active storm anywhere on Earth. Watch for two minutes, estimate its direction of travel, then zoom out to see whether it belongs to a larger storm system.","family":"lightningmaps","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how lightning forms thunderstorm electricity short","source":"NOAA / WEATHER"},"more":{"label":"SEE THE WINDS AROUND IT","source":"EARTH NULLSCHOOL • LIVE WEATHER","url":"https://earth.nullschool.net/","icon":"🌎"},"id":"5-6"},{"title":"Spin the Radio Globe","hook":"Geography becomes sound: accents, music, advertising, news, and local culture leak out of cities everywhere.","brief":"Radio Garden places live radio stations on a rotatable globe. You can sweep through cities thousands of miles apart in seconds, hearing what local broadcasters are actually transmitting instead of reading a cultural description written for you.","main":{"label":"TUNE THE PLANET","source":"RADIO GARDEN • LIVE WORLD RADIO","url":"https://radio.garden/","icon":"◉","kind":"LIVE AUDIO GLOBE","time":"15–∞ MIN","mission":"Pick three cities on three continents without researching them first. Listen for two minutes each and write down one clue—language, music, weather, ads, traffic—that tells you something about the place.","family":"radio-garden","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"world radio culture geography language short","source":"GEOGRAPHY / CULTURE"},"more":{"label":"DRIVE THROUGH A CITY","source":"DRIVE & LISTEN","url":"https://driveandlisten.app/","icon":"🚗"},"id":"5-7"},{"title":"Drive Somewhere You Have Never Been","hook":"Local radio, traffic, buildings, weather, street design—the ordinary texture of another city becomes the experience.","brief":"Drive & Listen combines street-level driving footage with local radio from cities around the world. It is intentionally low-pressure: sit in the passenger seat and notice urban geography, road design, density, architecture, signage, and sound without a quiz interrupting you.","main":{"label":"TAKE A RANDOM CITY DRIVE","source":"DRIVE & LISTEN • 100+ CITIES","url":"https://driveandlisten.app/","icon":"🚗","kind":"VIRTUAL TRAVEL","time":"15–∞ MIN","mission":"Choose a city you know almost nothing about. Keep the local radio on, ride for five minutes, and collect five observations about how this city differs from your own.","family":"drive-listen","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"urban geography how cities differ street design short","source":"URBANISM / GEOGRAPHY"},"more":{"label":"FIND THE CITY FROM ABOVE","source":"GOOGLE EARTH","url":"https://earth.google.com/web/","icon":"⌖"},"id":"5-8"},{"title":"Track the Fishing Fleet","hook":"The ocean looks empty from shore. Satellites reveal an enormous moving network of human activity.","brief":"Global Fishing Watch uses vessel-tracking data, satellite technology, and machine learning to visualize fishing and other vessel activity. You can move across oceans, change dates, inspect patterns, and see how economics and geography leave tracks on water.","main":{"label":"OPEN THE OCEAN TRAFFIC MAP","source":"GLOBAL FISHING WATCH • OPEN MAP","url":"https://globalfishingwatch.org/our-map/","icon":"⚓","kind":"LIVE DATA MAP","time":"15–30 MIN","mission":"Open the map, choose one ocean region, and look for a dense fishing pattern. Change the date range or vessel layer and figure out whether activity follows coastlines, ports, borders, or open-water features.","family":"global-fishing-watch","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Global Fishing Watch satellite fishing tracking short","source":"OCEAN / DATA"},"more":{"label":"SEE OCEAN CURRENTS","source":"EARTH NULLSCHOOL • OCEAN LAYER","url":"https://earth.nullschool.net/","icon":"≈"},"id":"5-9"},{"title":"Borrow Somebody Else's Window","hook":"Teleport to a quiet window somewhere on Earth and learn the place from what happens outside.","brief":"WindowSwap is a collection of real window views submitted from around the world. It is deliberately slower than Street View: one fixed viewpoint forces you to read weather, architecture, vegetation, traffic, light, sound, density, and everyday life instead of immediately zooming away.","main":{"label":"OPEN A RANDOM WINDOW","source":"WINDOWSWAP • REAL WORLD VIEWS","url":"https://www.window-swap.com/","icon":"▣","kind":"WORLD EXPLORER","time":"10–25 MIN","mission":"Visit at least three windows. Before checking the location, make a guess about climate, city versus rural setting, and region using only visible or audible clues.","family":"windowswap","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"how geographers read landscape climate architecture clues short","source":"GEOGRAPHY / PLACE"},"more":{"label":"FLY TO ONE OF THE PLACES","source":"GOOGLE EARTH","url":"https://earth.google.com/web/","icon":"⌖"},"id":"5-10"}]},{"name":"Life","label":"LIFE","glyph":"🧬","color":"#8bd84d","tagline":"Living things are stranger when you can compare the real evidence.","topics":[{"title":"Six Million Years of Us","hook":"Walk backward through species, climate shifts, tools, fire, brains, and the long road to Homo sapiens.","brief":"The Smithsonian’s interactive timeline places human species, environmental change, and major behavioral milestones on the same scale. Human evolution is not a ladder with us at the top; it is a branching history in which many human species existed and most disappeared.","main":{"label":"DRAG THROUGH HUMAN EVOLUTION","source":"SMITHSONIAN • INTERACTIVE TIMELINE","url":"https://humanorigins.si.edu/evidence/human-evolution-interactive-timeline","icon":"🧬","kind":"TIMELINE","time":"12–25 MIN","mission":"Travel from six million years ago to today. Find a time when more than one human species existed at once and compare what else was changing in the environment.","family":"smithsonian","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"human evolution species timeline short animation","source":"SMITHSONIAN HUMAN ORIGINS"},"more":{"label":"PICK UP THE FOSSILS IN 3D","source":"SMITHSONIAN 3D • HOMININ FOSSILS","url":"https://3d.si.edu/collections/hominin-fossils","icon":"◈"},"id":"6-0"},{"title":"Hold an Ancestor's Skull","hook":"Real fossil evidence becomes something you can rotate instead of a tiny picture in a textbook.","brief":"The Smithsonian’s 3D human-origins collections let you inspect scanned fossils from multiple early human species. Shape differences in skulls, jaws, and teeth become much easier to notice when you can rotate the specimen yourself.","main":{"label":"ROTATE THE FOSSILS","source":"SMITHSONIAN 3D • HOMININ COLLECTION","url":"https://3d.si.edu/collections/hominin-fossils","icon":"◈","kind":"3D COLLECTION","time":"10–20 MIN","mission":"Open at least three skulls from different species. Rotate each to profile view and compare brow ridge, face projection, and braincase shape.","family":"smithsonian-3d","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"early human skull comparison evolution short","source":"SMITHSONIAN HUMAN ORIGINS"},"more":{"label":"FILTER HUNDREDS OF FOSSILS","source":"SMITHSONIAN • HUMAN FOSSIL COLLECTION","url":"https://humanorigins.si.edu/evidence/human-fossils/fossils","icon":"▦"},"id":"6-1"},{"title":"Descend Into the Deep Sea","hook":"Scroll downward until sunlight vanishes and the animals stop looking reasonable.","brief":"The Deep Sea turns ocean depth into one long visual descent. Animals, wrecks, exploration records, pressure zones, and geological features appear at the depths where they actually belong. It works because the distance itself becomes the lesson.","main":{"label":"KEEP GOING DOWN","source":"NEAL.FUN • THE DEEP SEA","url":"https://neal.fun/deep-sea/","icon":"↓","kind":"SCROLL EXPLORER","time":"10–20 MIN","mission":"Do not race. Stop at 200 m, 1,000 m, and 4,000 m. At each depth, pick the organism you would least expect to survive there and notice how the light changes.","family":"neal-fun","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"deep sea animals adaptations short documentary","source":"BBC EARTH / DEEP LOOK"},"more":{"label":"FIND REAL DEEP-SEA OBSERVATIONS","source":"INATURALIST • OBSERVATIONS","url":"https://www.inaturalist.org/observations","icon":"◎"},"id":"6-2"},{"title":"How Big Is Life?","hook":"A bacterium, an egg, a blue whale, and a redwood should not fit comfortably on one mental scale.","brief":"Size of Life is a visual scale journey through living things. The value is comparison: organisms that feel unrelated suddenly become neighbors when arranged by physical size, and microscopic life stops being an abstract word meaning 'small.'","main":{"label":"ZOOM THROUGH LIFE","source":"NEAL.FUN • SIZE OF LIFE","url":"https://neal.fun/size-of-life/","icon":"↔","kind":"SCALE EXPLORER","time":"8–15 MIN","mission":"Find one organism much smaller than you expected and one much larger. Then estimate how many of the smaller one could fit across your hand.","family":"neal-fun","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"size scale cells bacteria animals visual comparison","source":"KURZGESAGT / BIOLOGY"},"more":{"label":"GO FIND LIVING THINGS","source":"INATURALIST • WORLD OBSERVATIONS","url":"https://www.inaturalist.org/observations","icon":"◎"},"id":"6-3"},{"title":"Life Is Happening Right Now","hook":"Millions of people are photographing organisms in the real world; the map becomes a live field notebook.","brief":"iNaturalist is not a pretend nature database. Its observations are real records contributed by people, identified by communities, and used by scientists. The fun is opening the world map and realizing that biodiversity is being documented constantly, including ordinary-looking places.","main":{"label":"OPEN THE LIVING MAP","source":"INATURALIST • LIVE OBSERVATIONS","url":"https://www.inaturalist.org/observations","icon":"◎","kind":"LIVE NATURE MAP","time":"10–∞ MIN","mission":"Zoom to a place you know and find three observations made recently. Then search outward until you find a species you did not know lived in that region.","family":"inaturalist","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how iNaturalist citizen science works short","source":"INATURALIST / CITIZEN SCIENCE"},"more":{"label":"ENTER A VIRTUAL EVOLUTION LAB","source":"HHMI • LIZARD EVOLUTION","url":"https://www.biointeractive.org/classroom-resources/lizard-evolution-virtual-lab","icon":"🦎"},"id":"6-4"},{"title":"The Entire Tree of Life","hook":"Two million-plus species become one zoomable family tree.","brief":"OneZoom places the tree of life on a single fractal-like page that you can zoom from huge branches down to individual species. Humans are not the trunk or destination; we occupy one tiny twig among an enormous number of living lineages.","main":{"label":"ZOOM THE TREE OF LIFE","source":"ONEZOOM • TREE OF LIFE","url":"https://www.onezoom.org/","icon":"🌳","kind":"EVOLUTION EXPLORER","time":"15–∞ MIN","mission":"Find humans, a mushroom, an octopus, and an oak. For each pair, zoom outward until their branches meet and compare how far back their common ancestor lies.","family":"onezoom","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"tree of life common ancestry evolution visual","source":"EVOLUTION / BIOLOGY"},"more":{"label":"FIND THOSE SPECIES IN THE REAL WORLD","source":"INATURALIST • OBSERVATIONS","url":"https://www.inaturalist.org/observations","icon":"◎"},"id":"6-5"},{"title":"Bear Fishing, Live","hook":"No narrator, no edit, no guaranteed action—just wild brown bears using a river because salmon are there.","brief":"Explore.org’s Brooks Falls cameras stream Katmai National Park live. A real wildlife cam has a useful kind of boredom: when something finally happens, you are watching behavior rather than a highlight reel chosen in advance.","main":{"label":"WATCH THE FALLS LIVE","source":"EXPLORE.ORG • BROOKS FALLS BEAR CAM","url":"https://explore.org/livecams/explore-all-cams/brooks-falls-brown-bears-low","icon":"🐻","kind":"LIVE WILDLIFE","time":"10–∞ MIN","mission":"Watch long enough to identify one repeated bear behavior. If no bears appear, use the conditions and river itself as evidence for why this particular location attracts them seasonally.","family":"explore-bears","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Katmai brown bears salmon Brooks Falls behavior short","source":"NATIONAL PARK SERVICE / WILDLIFE"},"more":{"label":"OPEN MORE WILD CAMS","source":"EXPLORE.ORG","url":"https://explore.org/","icon":"◉"},"id":"6-6"},{"title":"Listen for Orcas","hook":"A hydrophone and live camera turn the ocean into a place where animals may arrive before you see them.","brief":"OrcaLab’s live camera network on Hanson Island is built around long-term, non-invasive observation of northern resident killer whales. Watching and listening in real time emphasizes something documentaries hide: field biology often means patience, incomplete information, and recognizing patterns.","main":{"label":"OPEN ORCALAB LIVE","source":"EXPLORE.ORG • ORCALAB BASE","url":"https://explore.org/livecams/orcas/orcalab-base","icon":"🐋","kind":"LIVE WILDLIFE","time":"10–∞ MIN","mission":"Listen as much as you watch. If whales appear, notice group movement and sound; if they do not, identify the environmental clues a researcher might monitor while waiting.","family":"explore-orcas","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"orca communication pods echolocation short documentary","source":"BBC EARTH / MARINE BIOLOGY"},"more":{"label":"SEARCH REAL ORCA OBSERVATIONS","source":"INATURALIST","url":"https://www.inaturalist.org/observations?taxon_name=Orcinus%20orca","icon":"◎"},"id":"6-7"},{"title":"Do Real Wildlife Science","hook":"A camera-trap photo appears. Your job is to tell researchers what animal walked past.","brief":"Zooniverse’s Cameras for Conservation project gives volunteers real camera-trap images to classify. This is citizen science rather than a simulation: thousands of small identifications can help researchers monitor wildlife populations and habitat use.","main":{"label":"CLASSIFY THE CAMERA TRAPS","source":"ZOONIVERSE • CAMERAS FOR CONSERVATION","url":"https://www.zooniverse.org/projects/american-prairie/cameras-for-conservation/classify/workflow/30929","icon":"📷","kind":"CITIZEN SCIENCE","time":"10–25 MIN","mission":"Classify at least ten images. For any uncertain animal, use visible evidence—body shape, coat, antlers, size, behavior—before choosing an answer.","family":"zooniverse-wildlife","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"camera trap citizen science wildlife monitoring short","source":"ZOONIVERSE / ECOLOGY"},"more":{"label":"SEE ALL ACTIVE RESEARCH PROJECTS","source":"ZOONIVERSE • PROJECTS","url":"https://www.zooniverse.org/projects","icon":"◎"},"id":"6-8"},{"title":"Peel Apart a Human Body","hook":"Hide skin, isolate muscle, rotate a skeleton, and see how many systems occupy the same space.","brief":"ZygoteBody is a browser-based 3D anatomy viewer that lets you rotate and layer human anatomy. The central realization is spatial: organs, vessels, bones, muscles, and nerves are not separate textbook diagrams—they are packed into one body and routed around one another.","main":{"label":"OPEN THE 3D BODY","source":"ZYGOTEBODY • ANATOMY VIEWER","url":"https://www.zygotebody.com/welcome","icon":"🫀","kind":"3D ANATOMY","time":"12–25 MIN","mission":"Rotate the body, isolate two organ systems, and find one place where anatomy is more crowded or strangely arranged than you expected. Trace one structure across more than one body region.","family":"zygote-body","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"human anatomy organs muscles bones 3D short","source":"ANATOMY / BIOLOGY"},"more":{"label":"COMPARE WITH REAL HUMAN EVOLUTION FOSSILS","source":"SMITHSONIAN 3D • HOMININS","url":"https://3d.si.edu/collections/hominin-fossils","icon":"◈"},"id":"6-9"},{"title":"Solve a Wildlife Crime With DNA","hook":"An elephant tusk can contain enough genetic evidence to point investigators back toward the population it came from.","brief":"CSI Wildlife turns real elephant-poaching investigations into a genetics case. You compare DNA profiles, genetic markers, and population evidence to work out where seized ivory originated. It is more demanding than a quick game, but that is because the underlying science is close to what conservation researchers actually use.","main":{"label":"OPEN THE WILDLIFE CASE","source":"HHMI BIOINTERACTIVE • CSI WILDLIFE","url":"https://www.biointeractive.org/classroom-resources/csi-wildlife","icon":"🐘","kind":"FORENSIC INTERACTIVE","time":"25–50 MIN","mission":"Work through the first case far enough to compare DNA evidence. Keep a short suspect-style list of what each genetic result rules in or rules out before the interactive explains it.","family":"hhmi-csi-wildlife","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"elephant ivory DNA poaching genetics investigation short","source":"HHMI BIOINTERACTIVE / CONSERVATION"},"more":{"label":"MAP THE POACHING HOTSPOTS","source":"HHMI • GENETIC EVIDENCE","url":"https://www.biointeractive.org/classroom-resources/using-genetic-evidence-identify-ivory-poaching-hotspots","icon":"⌖"},"id":"6-10"}]},{"name":"Machines","label":"MACHINES","glyph":"⚙","color":"#ff8a4c","tagline":"If it has gears, circuits, controls, lift, momentum, or an unreasonable number of switches, touch it.","topics":[{"title":"The 2,000-Year-Old Computer","hook":"Bronze gears predicted astronomical cycles long before anyone had electricity.","brief":"The Antikythera Mechanism was an ancient Greek geared calculator used to model celestial cycles. A 3D reconstruction is ideal here because its intelligence lives in moving parts: turn the mechanism, swap faces, expose the gears, and watch astronomy become machinery.","main":{"label":"TURN THE GEARS","source":"KOTSANAS MUSEUM • ANTIKYTHERA 3D","url":"https://interactive.kotsanas.com/antikythera_mechanism/en/","icon":"⚙","kind":"3D MACHINE","time":"12–25 MIN","mission":"Rotate the whole mechanism first, then expose the gears. Change the controls and try to identify which motions correspond to the Sun and Moon.","family":"kotsanas","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Antikythera mechanism gears how it works animation","source":"VERITASIUM / ANCIENT TECHNOLOGY"},"more":{"label":"SEE ANOTHER RECONSTRUCTION","source":"ANTIKYTHERA IN THREE DIMENSIONS","url":"https://antikytheramechanism.app/3d/en/","icon":"◈"},"id":"7-0"},{"title":"Use the Apollo Guidance Computer","hook":"Moon missions ran on a computer whose interface looks like a calculator from another civilization.","brief":"The Apollo Guidance Computer and its DSKY keyboard/display were small, specialized, and deeply integrated into navigation. webAGC emulates the real software and interface in a browser. It is not simplified into a cute lesson, so part of the experience is feeling how alien early spacecraft computing can be.","main":{"label":"BOOT THE DSKY","source":"WEBAGC • APOLLO COMPUTER EMULATOR","url":"https://michaelfranzl.github.io/webAGC/demo/","icon":"◉","kind":"EMULATOR","time":"10–25 MIN","mission":"Find the DSKY controls and enter at least one command from the on-page guidance. Notice how verbs, nouns, and numeric codes replace the menus you expect from modern software.","family":"webagc","device":"BEST ON DESKTOP","grade":"GOLD"},"watch":{"query":"Apollo guidance computer DSKY short explanation","source":"COMPUTERPHILE / APOLLO"},"more":{"label":"FLY A SPACECRAFT IN 3D","source":"NASA EYES • MARS 2020","url":"https://eyes.nasa.gov/apps/mars2020/","icon":"🚀"},"id":"7-1"},{"title":"Fly a Realistic Airplane Anywhere","hook":"The map is the whole planet, the weather can be real, and the airplane actually has to fly.","brief":"GeoFS is a browser flight simulator with a physics model, global terrain, navigation aids, aircraft instruments, and worldwide satellite imagery. Even a clumsy first flight teaches why speed, lift, heading, terrain, and runway alignment all matter at once.","main":{"label":"TAKE OFF","source":"GEOFS • GLOBAL FLIGHT SIMULATOR","url":"https://www.geo-fs.com/","icon":"✈","kind":"FLIGHT SIM","time":"15–∞ MIN","mission":"Start with an easy aircraft. Take off, make one controlled turn, and land somewhere—even badly. Then try the same flight with a different weather or time setting.","family":"geofs","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"how airplanes fly lift stall control surfaces short","source":"REAL ENGINEERING / AVIATION"},"more":{"label":"EXPLORE THE TERRAIN FROM ORBIT","source":"GOOGLE EARTH","url":"https://earth.google.com/web/","icon":"⌖"},"id":"7-2"},{"title":"Build a Circuit","hook":"Wires are just lines until current starts moving and your bad design blows the bulb.","brief":"PhET’s circuit kit lets you drag batteries, wires, switches, bulbs, and measuring tools into working circuits. Because the simulation responds immediately, series circuits, parallel paths, resistance, voltage, and short circuits become behavior instead of vocabulary.","main":{"label":"WIRE IT UP","source":"PHET • CIRCUIT CONSTRUCTION KIT","url":"https://phet.colorado.edu/en/simulations/circuit-construction-kit-dc","icon":"⚡","kind":"SIMULATION","time":"10–20 MIN","mission":"Make one bulb light. Then build two bulbs in series and two in parallel. Compare brightness and use a meter if you can figure it out.","family":"phet","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"electric circuits voltage current resistance visual explanation","source":"PHET / ENGINEERING"},"more":{"label":"MAKE STATIC ELECTRICITY WEIRD","source":"PHET • JOHN TRAVOLTAGe","url":"https://phet.colorado.edu/en/simulations/john-travoltage","icon":"⚡"},"id":"7-3"},{"title":"Crash Lab","hook":"Momentum becomes obvious when you are allowed to smash things repeatedly.","brief":"Collision Lab lets you change mass, speed, direction, and elasticity, then watch momentum vectors before and after impact. It is the rare place where intentionally arranging absurd crashes is exactly the correct scientific method.","main":{"label":"SMASH THE CARTS","source":"PHET • COLLISION LAB","url":"https://phet.colorado.edu/en/simulations/collision-lab","icon":"💥","kind":"PHYSICS LAB","time":"10–20 MIN","mission":"Create a head-on collision with equal masses, then double one mass. Finally make the collision perfectly elastic and compare what changes.","family":"phet","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"momentum collision physics visual explanation","source":"PHET / PHYSICS"},"more":{"label":"LAUNCH SOMETHING INSTEAD","source":"PHET • PROJECTILE MOTION","url":"https://phet.colorado.edu/en/simulations/projectile-motion","icon":"↗"},"id":"7-4"},{"title":"Build a Computer From NAND","hook":"Start with relays and one logic gate. End by constructing pieces of a computer.","brief":"NandGame is a level-by-level engineering puzzle where each component you build becomes a building block for the next one. It strips a computer down until logic is physical again: current, relays, truth tables, gates, adders, memory, and eventually larger machinery.","main":{"label":"BUILD THE FIRST GATE","source":"NANDGAME • COMPUTER FROM SCRATCH","url":"https://nandgame.com/","icon":"◫","kind":"ENGINEERING PUZZLE","time":"20–∞ MIN","mission":"Complete the first few levels without looking up solutions. When you reach a component made from earlier components, pause and explain what information is flowing through it.","family":"nandgame","device":"DESKTOP PREFERRED","grade":"GOLD"},"watch":{"query":"logic gates NAND computer from scratch visual explanation","source":"BEN EATER / COMPUTER ENGINEERING"},"more":{"label":"SEE A TURING MACHINE NEXT","source":"TURINGMACHINE.IO","url":"https://turingmachine.io/","icon":"⌘"},"id":"7-5"},{"title":"Make Electricity Visible","hook":"Current becomes moving dots and voltage becomes color inside a real circuit simulator.","brief":"Falstad’s CircuitJS is less polished than a toy because it is closer to an actual engineering tool. You can switch components, edit values, load examples, and watch voltages and currents change continuously through a circuit.","main":{"label":"OPEN THE CIRCUIT WORKBENCH","source":"FALSTAD • CIRCUITJS","url":"https://circuitjs1.falstad.com/circuit/index.html","icon":"⚡","kind":"CIRCUIT SIMULATOR","time":"15–∞ MIN","mission":"Start with the default circuit, toggle a switch, then load a simple RC or logic example. Change one component value by a factor of ten and watch what changes in the animation.","family":"falstad","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"electronic circuits current voltage capacitor animation","source":"ELECTRONICS / ENGINEERING"},"more":{"label":"BUILD A FRIENDLIER CIRCUIT","source":"PHET • CIRCUIT KIT","url":"https://phet.colorado.edu/en/simulations/circuit-construction-kit-dc","icon":"⚡"},"id":"7-6"},{"title":"Design a Gear Train","hook":"Add teeth, mesh gears, change sizes, press play, and watch ratios become motion.","brief":"Gear Generator is an involute-gear design and simulation tool. Because you can animate the gears and alter tooth counts, mechanical advantage stops being a fraction on paper and becomes obvious as one wheel crawls while another spins.","main":{"label":"MESH THE GEARS","source":"GEAR GENERATOR 3","url":"https://geargenerator.com/","icon":"⚙","kind":"MECHANISM TOOL","time":"12–25 MIN","mission":"Create a two-gear train with very different sizes, predict which gear spins faster, then add a third gear and see which properties change and which do not.","family":"gear-generator","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"gear ratios torque speed visual explanation","source":"ENGINEERING / GEARS"},"more":{"label":"BUILD LINKAGES NEXT","source":"ABC TOOLS • LINKAGE SIMULATOR","url":"https://abc.tools/sim/linkage-simulator/","icon":"⌁"},"id":"7-7"},{"title":"Invent a Walking Mechanism","hook":"Pivots and rigid bars become pistons, pantographs, straight-line linkages, and even a Strandbeest leg.","brief":"ABC Tools’ linkage simulator is a real planar-mechanism workbench. You can load classic mechanisms, change link lengths, motorize a crank, trace a joint’s path, or build your own linkage and watch the geometry decide whether it moves or jams.","main":{"label":"BUILD THE LINKAGE","source":"ABC TOOLS • MECHANISM SIMULATOR","url":"https://abc.tools/sim/linkage-simulator/","icon":"⌁","kind":"MECHANISM SIMULATOR","time":"15–30 MIN","mission":"Load the crank-slider and a Strandbeest or four-bar preset. Change one link length, watch the path change, then try to build a mechanism that produces a useful repeated motion.","family":"abc-linkage","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"four bar linkage Theo Jansen mechanism animation","source":"MECHANICAL ENGINEERING"},"more":{"label":"TURN THE SAME IDEA INTO GEARS","source":"GEAR GENERATOR 3","url":"https://geargenerator.com/","icon":"⚙"},"id":"7-8"},{"title":"Design an Airfoil","hook":"Change wing shape and airflow and watch the pressure and lift respond.","brief":"NASA’s FoilSim is an interactive aerodynamics tool for exploring airflow around airfoils. It connects wing shape, angle, speed, and atmospheric conditions to lift, making airplane wings feel like engineered compromises rather than magical curved boards.","main":{"label":"RUN THE WIND TUNNEL","source":"NASA • FOILSIM","url":"https://www.nasa.gov/stem-content/foilsim/","icon":"✈","kind":"AERODYNAMICS SIM","time":"15–25 MIN","mission":"Open an online FoilSim version, establish a baseline wing, then change angle of attack and one shape parameter. Find the change that increases lift most without simply increasing speed.","family":"nasa-foilsim","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"airfoil lift angle of attack short visual explanation","source":"NASA / AERONAUTICS"},"more":{"label":"FLY THE RESULT","source":"GEOFS • FLIGHT SIMULATOR","url":"https://www.geo-fs.com/","icon":"✈"},"id":"7-9"},{"title":"Build a Machine From Sticks and Pins","hook":"Four bars and a few joints can turn continuous rotation into rocking, walking, tracing, pumping, or something beautifully useless.","brief":"MechSim is a real browser-based mechanism builder rather than a canned animation. You place pivots and joints, connect rigid links, drive a crank, and let a constraint solver move the structure. Small changes in link length can completely reshape the path traced by the machine.","main":{"label":"BUILD THE LINKAGE","source":"MECHSIM • KINEMATIC MECHANISM SIMULATOR","url":"https://www.mechsim.app/","icon":"⚙","kind":"MECHANISM BUILDER","time":"15–35 MIN","mission":"Build the tutorial four-bar linkage and run it. Then change exactly one link length and turn on a trace path so you can see how one geometric change rewrites the machine's motion.","family":"mechsim","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"four bar linkage mechanism animation how it works short","source":"MECHANICAL ENGINEERING / LINKAGES"},"more":{"label":"TRY A GEAR TRAIN","source":"AZRS • INTERACTIVE GEAR SIMULATOR","url":"https://www.azrscorp.com/quickfix/simulations/gear-train/","icon":"⚙"},"id":"7-10"}]},{"name":"Art","label":"ART","glyph":"✦","color":"#ff4fa3","tagline":"Art is allowed to be a toy, a puzzle, a machine, or something you accidentally make.","topics":[{"title":"Pottery Without the Cleanup","hook":"Shape a virtual vessel, decorate it, then discover which ancient form you accidentally reinvented.","brief":"3D Pottery turns historical ceramic forms into a sculpting game. You push and pull a rotating vessel, compare your shape with real examples, and learn how distinct profiles can reveal where and when an object came from.","main":{"label":"THROW A DIGITAL POT","source":"GOOGLE ARTS & CULTURE • 3D POTTERY","url":"https://artsandculture.google.com/experiment/3d-pottery/nwHg1D0riJ1ltA","icon":"🏺","kind":"MAKE / 3D","time":"10–20 MIN","mission":"Choose a historical vessel and imitate its silhouette as closely as you can. Then deliberately make one impossible or ridiculous variant.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"ancient pottery forms how made wheel throwing short","source":"THE MET / ART HISTORY"},"more":{"label":"PLAY WITH MORE MUSEUM EXPERIMENTS","source":"GOOGLE ARTS & CULTURE • PLAY","url":"https://artsandculture.google.com/play","icon":"✦"},"id":"8-0"},{"title":"Deliver the Masterpiece","hook":"Art history becomes a physics problem involving fragile objects and your questionable handling skills.","brief":"The Art Handler is built around the normally invisible job of moving artworks safely. It turns balance, weight, obstacles, and museum objects into an arcade-style challenge. You learn something about artworks almost by accident because first you are trying not to destroy them.","main":{"label":"MOVE THE ART","source":"GOOGLE ARTS & CULTURE • THE ART HANDLER","url":"https://artsandculture.google.com/experiment/the-art-handler/zAGDpcg-fq-0dw?hl=en","icon":"🖼","kind":"ARCADE GAME","time":"8–15 MIN","mission":"Complete several deliveries. Pay attention to which shapes or objects are hardest to move and what that says about handling real museum collections.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how museums move giant artworks art handlers short","source":"MUSEUM / ART CONSERVATION"},"more":{"label":"TRY ANOTHER ART GAME","source":"GOOGLE ARTS & CULTURE • PLAY","url":"https://artsandculture.google.com/play","icon":"✦"},"id":"8-1"},{"title":"Paint Like a Squid","hook":"Fluid simulation, color, motion, and a cephalopod become your art supplies.","brief":"Splash Canvas replaces normal brushes with swimming sea creatures and moving color. It is mostly a creative toy, which is exactly why it belongs here: motion and fluid-like trails make composition something you discover by playing rather than following instructions.","main":{"label":"SPLASH THE CANVAS","source":"GOOGLE ARTS & CULTURE • SPLASH CANVAS","url":"https://artsandculture.google.com/experiment/splash-canvas/vQFCtQB7FDnYkA","icon":"🦑","kind":"MAKE / PLAY","time":"8–20 MIN","mission":"Make one calm image using controlled movement, then one chaotic image using maximum motion. Decide which one feels more intentional and why.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"fluid art color movement visual art short","source":"ART EXPLAINER"},"more":{"label":"COLOR A MASTERPIECE","source":"GOOGLE ARTS & CULTURE • ART COLORING BOOK","url":"https://artsandculture.google.com/experiment/art-coloring-book/1QGsh6vSfAQBgQ","icon":"✎"},"id":"8-2"},{"title":"Matisse Goes Wild","hook":"Color does not have to describe reality. Sometimes it is there to hit you.","brief":"Henri Matisse and the Fauves used intense, unnatural color to change the emotional force of an image. This interactive experience is built around that idea, letting you explore and manipulate the relationship between color and the artwork rather than memorizing an art movement name.","main":{"label":"OPEN THE WILD PALETTE","source":"GOOGLE ARTS & CULTURE • MATISSE","url":"https://artsandculture.google.com/experiment/matisse-the-wild-palette/yQEXZe_U5z_xPw?hl=en","icon":"🎨","kind":"INTERACTIVE ART","time":"10–20 MIN","mission":"Find a color choice that would look 'wrong' in a photograph but works in the painting. Then make or choose a palette that changes the mood completely.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Matisse Fauvism color short art history","source":"GREAT ART EXPLAINED"},"more":{"label":"MAKE COLOR MISBEHAVE","source":"MICHAEL BACH • COLOR ILLUSIONS","url":"https://michaelbach.de/ot/","icon":"◉"},"id":"8-3"},{"title":"See in CMYK","hook":"Four inks can fake an enormous world of color.","brief":"Most color printing is built from cyan, magenta, yellow, and black inks arranged as tiny patterns. See in CMYK turns that printing system into a visual playground so you can separate channels, make poster-like images, and see how physical color mixing differs from glowing screens.","main":{"label":"SEPARATE THE INKS","source":"GOOGLE ARTS & CULTURE • SEE IN CMYK","url":"https://artsandculture.google.com/experiment/8AEAytzXr9rLvQ?cp=1","icon":"◫","kind":"COLOR LAB","time":"8–15 MIN","mission":"Create an image, then isolate individual color channels. Try to predict which channel will carry the darkest detail before toggling it.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"CMYK vs RGB color printing short visual","source":"DESIGN / COLOR THEORY"},"more":{"label":"PLAY WITH COLOR PERCEPTION","source":"MICHAEL BACH • COLOR PHENOMENA","url":"https://michaelbach.de/ot/","icon":"◉"},"id":"8-4"},{"title":"Weave Light","hook":"Symmetry, color, repetition, and motion produce images that look far more deliberate than your hand movements deserve.","brief":"Silk is a generative drawing tool that mirrors and spirals your strokes while sound follows the movement. It is a quick way to discover how constraints and symmetry can create complexity: one gesture becomes an entire composition.","main":{"label":"WEAVE THE IMAGE","source":"SILK • INTERACTIVE GENERATIVE ART","url":"https://weavesilk.com/","icon":"✦","kind":"GENERATIVE ART","time":"10–∞ MIN","mission":"Make one drawing with maximum symmetry and one with symmetry mostly disabled. Use the same colors in both and decide which feels more complex—and whether complexity came from you or the rule.","family":"weavesilk","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"symmetry generative art patterns short visual","source":"ART + MATH"},"more":{"label":"BUILD A GEOMETRIC VERSION","source":"MATHIGON • POLYPAD","url":"https://mathigon.org/polypad","icon":"◇"},"id":"8-5"},{"title":"Sculpt Digital Clay","hook":"Push, smooth, pinch, inflate, cut, and rotate a lump of virtual material until it becomes something recognizable.","brief":"SculptGL is a browser-based 3D sculpting application. It gives you the same basic problem traditional sculptors face—form must work from every angle—but adds digital powers like symmetry, remeshing, and undo.","main":{"label":"SCULPT IN 3D","source":"SCULPTGL • WEB SCULPTING APP","url":"https://stephaneginier.com/sculptgl","icon":"◉","kind":"3D ART TOOL","time":"15–∞ MIN","mission":"Start from the sphere and make a head, creature, or object without using reference for ten minutes. Rotate constantly; fix one side that only looked good from the front.","family":"sculptgl","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"digital sculpting form silhouette planes short","source":"SCULPTURE / DIGITAL ART"},"more":{"label":"SCULPT A HISTORICAL VESSEL","source":"GOOGLE ARTS • 3D POTTERY","url":"https://artsandculture.google.com/experiment/3d-pottery/nwHg1D0riJ1ltA","icon":"🏺"},"id":"8-6"},{"title":"Make the AI Guess Your Doodle","hook":"Draw badly on purpose and see what a machine-learning helper thinks you meant.","brief":"AutoDraw pairs your rough sketch with drawings made by artists, using machine learning to guess the object. It is part drawing tool and part classification game: each suggestion reveals which features your scribble communicated clearly enough for the system to recognize.","main":{"label":"DOODLE UNTIL IT GUESSES","source":"GOOGLE • AUTODRAW","url":"https://autodraw.com/","icon":"✎","kind":"AI DRAWING TOOL","time":"10–20 MIN","mission":"Try drawing five objects with as few strokes as possible. For one object, deliberately remove a key feature and see which wrong suggestions appear.","family":"autodraw","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"AutoDraw machine learning drawing recognition short","source":"GOOGLE CREATIVE LAB / ART + AI"},"more":{"label":"RACE A DRAWING AI","source":"GOOGLE • QUICK, DRAW!","url":"https://quickdraw.withgoogle.com/","icon":"◉"},"id":"8-7"},{"title":"Animate a Tiny Pixel Creature","hook":"Every frame is a drawing; every movement is the difference between drawings.","brief":"Piskel is a browser editor for pixel art and animated sprites. Because the canvas is deliberately low-resolution, every pixel matters, and animation becomes understandable as a sequence of carefully changed poses rather than mysterious movie magic.","main":{"label":"DRAW THE SPRITE","source":"PISKEL • PIXEL ART + ANIMATION","url":"https://www.piskelapp.com/p/create/sprite/","icon":"▦","kind":"PIXEL ANIMATION","time":"20–∞ MIN","mission":"Create a tiny character with at least four animation frames. Make a walk, blink, bounce, or attack loop and keep editing until the loop stops visibly “jumping.”","family":"piskel","device":"DESKTOP / LANDSCAPE","grade":"GOLD"},"watch":{"query":"pixel art animation walk cycle sprites short","source":"GAME ART / ANIMATION"},"more":{"label":"MAKE A BRANCHING GAME AROUND IT","source":"TWINE • STORY MAKER","url":"https://play.twinery.org/","icon":"⌘"},"id":"8-8"},{"title":"Turn a Masterpiece Into a Jigsaw","hook":"Zooming into hundreds of puzzle pieces is a surprisingly effective excuse to stare at art.","brief":"Puzzle Party converts more than 500 artworks into collaborative or solo jigsaws with multiple difficulty levels. The puzzle mechanic forces sustained attention to color, brushwork, edges, texture, and tiny details you might otherwise glance past.","main":{"label":"BREAK THE ART APART","source":"GOOGLE ARTS & CULTURE • PUZZLE PARTY","url":"https://artsandculture.google.com/experiment/puzzle-party/EwGBPZlIzv0KRw?hl=en","icon":"🧩","kind":"ART PUZZLE","time":"10–30 MIN","mission":"Choose an artwork you do not already know and a difficulty above the easiest setting. Before viewing the title, predict what the full image contains from the fragments.","family":"google-arts-puzzle","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"how to look closely at paintings visual analysis short","source":"MUSEUM / ART HISTORY"},"more":{"label":"PLAY ART DETECTIVE","source":"GOOGLE ARTS & CULTURE • ART DETECTIVE","url":"https://artsandculture.google.com/project/the-art-detective","icon":"🔎"},"id":"8-9"},{"title":"Draw Manga With an AI Co-Pilot","hook":"Give the machine a few lines and splashes of color, then see what 140,000 manga images taught it to expect.","brief":"Giga Manga is a drawing experiment trained on a large manga image collection. Your rough marks guide machine-generated line and color suggestions, but you can keep drawing over them. It works best as an argument with the model: discover what kinds of marks make it confidently guess the wrong thing.","main":{"label":"DRAW THE CHARACTER","source":"GOOGLE ARTS & CULTURE • GIGA MANGA","url":"https://artsandculture.google.com/experiment/giga-manga/UAHzM-yZUdUpNA","icon":"✎","kind":"AI DRAWING TOY","time":"10–25 MIN","mission":"Make one character by cooperating with the suggestions, then a second by deliberately confusing them. Compare which of your lines the model seems to treat as the most important.","family":"google-arts-giga-manga","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Giga Manga machine learning drawing demo manga art","source":"GOOGLE ARTS & CULTURE"},"more":{"label":"EXPLORE MANGA HISTORY","source":"GOOGLE ARTS & CULTURE • MANGA OUT OF THE BOX","url":"https://artsandculture.google.com/project/manga","icon":"◈"},"id":"8-10"}]},{"name":"Music","label":"MUSIC","glyph":"♪","color":"#ffd23f","tagline":"Make noise first. Understand why it works afterward.","topics":[{"title":"Build a Song","hook":"A blank grid becomes drums, bass, melody, tempo, and whatever strange thing you decide counts as music.","brief":"Song Maker strips music composition down to a grid you can draw on. Pitch runs vertically, time runs horizontally, percussion sits underneath, and playback is instant. Patterns become visible at the same moment they become audible.","main":{"label":"MAKE THE SONG","source":"CHROME MUSIC LAB • SONG MAKER","url":"https://musiclab.chromeexperiments.com/Song-Maker","icon":"♫","kind":"MAKE / SEQUENCER","time":"15–∞ MIN","mission":"Write an eight-beat pattern, add percussion, then duplicate or vary part of it so the listener can hear something return.","family":"chrome-music","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how music sequencers rhythm melody work short","source":"MUSIC THEORY / VISUAL"},"more":{"label":"OPEN THE WHOLE MUSIC LAB","source":"CHROME MUSIC LAB","url":"https://musiclab.chromeexperiments.com/","icon":"♪"},"id":"9-0"},{"title":"Conduct Blob Opera","hook":"Drag four ridiculous blobs around and accidentally discover harmony.","brief":"Blob Opera uses a machine-learning model trained on opera singers to generate four coordinated voices. Moving a blob changes pitch and vowel sound while the other voices respond. It is silly enough to invite experimentation and musical enough to reward it.","main":{"label":"CONDUCT THE BLOBS","source":"GOOGLE ARTS & CULTURE • BLOB OPERA","url":"https://artsandculture.google.com/experiment/blob-opera/AAHWrq360NcGbw","icon":"♪","kind":"MUSIC TOY","time":"10–20 MIN","mission":"Make the lowest blob hold a stable note while the top voice moves. Then create a short phrase you can repeat from memory.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"harmony choir intervals short visual explanation","source":"DAVID BENNETT PIANO / MUSIC"},"more":{"label":"TURN CLASSICAL MUSIC INTO A RHYTHM GAME","source":"GOOGLE ARTS & CULTURE • BLOB BEATS","url":"https://artsandculture.google.com/experiment/blob-beats/ZgF_e3-CO-iRPw","icon":"●"},"id":"9-1"},{"title":"Play a Synthesizer","hook":"Oscillators, filters, sequencers, and famous synth shapes—without buying a wall of electronics.","brief":"AR Synth recreates several classic synthesizer ideas in a browser-based 3D environment. Synthesizers build complex sounds from simple waves and transformations, so every strange knob is really an invitation to change the physics of the sound.","main":{"label":"TURN THE KNOBS","source":"GOOGLE ARTS & CULTURE • AR SYNTH","url":"https://artsandculture.google.com/experiment/ar-synth/tQElSBFi9DQXGw?hl=en","icon":"〽","kind":"SYNTH TOY","time":"12–25 MIN","mission":"Start with a simple sound. Change one control at a time until you can hear what it does, then create the ugliest sound possible on purpose.","family":"google-arts","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"synthesizer oscillators filters envelope short visual","source":"ANDREW HUANG / SYNTH BASICS"},"more":{"label":"SEE THE WAVE ITSELF","source":"CHROME MUSIC LAB • OSCILLATORS","url":"https://musiclab.chromeexperiments.com/Oscillators/","icon":"≈"},"id":"9-2"},{"title":"Play the World's Instruments","hook":"Jump between instruments, textures, rhythms, and combinations that normally live continents apart.","brief":"Instrument Playground lets you explore sounds from a large collection of instruments and layer them in a simple sequencer. The useful part is not memorizing names; it is hearing how timbre changes when different ways of making sound collide.","main":{"label":"BUILD AN IMPOSSIBLE BAND","source":"GOOGLE ARTS & CULTURE • INSTRUMENT PLAYGROUND","url":"https://artsandculture.google.com/experiment/instrument-playground/8QFo2oQr2uT3pg?hl=en","icon":"♬","kind":"MUSIC MAKER","time":"12–25 MIN","mission":"Choose three instruments from very different families or regions and layer them. Try to make the combination sound intentional rather than random.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"musical instrument families timbre world instruments short","source":"MUSIC / ORCHESTRA EXPLAINER"},"more":{"label":"LOOK AT REAL INSTRUMENTS","source":"THE MET • MUSICAL INSTRUMENTS","url":"https://www.metmuseum.org/art/collection","icon":"◈"},"id":"9-3"},{"title":"Draw a Sound","hook":"Circle, triangle, line: Kandinsky gets turned into music.","brief":"Chrome Music Lab’s Kandinsky experiment converts shapes and drawing gestures into sounds. It makes the connection between visual form, repetition, motion, and musical pattern immediate: you draw first and only afterward discover what your picture sounds like.","main":{"label":"DRAW MUSIC","source":"CHROME MUSIC LAB • KANDINSKY","url":"https://musiclab.chromeexperiments.com/Kandinsky/","icon":"✎","kind":"DRAW + SOUND","time":"8–15 MIN","mission":"Draw the same shape at three different sizes or heights and compare the sound. Then build a tiny picture that also works as a repeatable musical phrase.","family":"chrome-music","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Kandinsky music painting synesthesia short","source":"ART + MUSIC EXPLAINER"},"more":{"label":"SEE SOUND AS A PICTURE","source":"CHROME MUSIC LAB • SPECTROGRAM","url":"https://musiclab.chromeexperiments.com/Spectrogram/","icon":"▥"},"id":"9-4"},{"title":"Learn a Synth by Actually Touching One","hook":"Drag, listen, change oscillators, filters, envelopes, and modulation without needing any hardware.","brief":"Ableton Learning Synths teaches synthesis entirely inside the browser. Each concept is immediately playable, so words like oscillator, filter, amplitude, and envelope are attached to a sound you just changed yourself.","main":{"label":"OPEN THE SYNTH","source":"ABLETON • LEARNING SYNTHS","url":"https://learningsynths.ableton.com/en/get-started","icon":"〽","kind":"INTERACTIVE INSTRUMENT","time":"15–30 MIN","mission":"Work through the opening sections until you reach multiple controls. Make one soft sound and one aggressive sound using deliberate choices instead of random knob turning.","family":"ableton-synth","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"synth oscillator filter envelope visual explanation","source":"ABLETON / SYNTHESIS"},"more":{"label":"OPEN A DIFFERENT SYNTH TOY","source":"GOOGLE ARTS • AR SYNTH","url":"https://artsandculture.google.com/experiment/ar-synth/tQElSBFi9DQXGw?hl=en","icon":"〽"},"id":"9-5"},{"title":"Build a Beat From the Ground Up","hook":"Kick, snare, hi-hat, tempo, bassline, melody, chord—each piece enters only when you make it.","brief":"Ableton Learning Music teaches the fundamentals of beat-making and composition in an interactive browser playground. Instead of explaining rhythm first and making music later, it lets the sound happen immediately and attaches vocabulary afterward.","main":{"label":"MAKE THE BEAT","source":"ABLETON • LEARNING MUSIC","url":"https://learn.ableton.com/","icon":"♫","kind":"MUSIC LAB","time":"20–40 MIN","mission":"Complete the first rhythm section, then open the playground and build an original eight-beat loop. Remove one sound and decide whether the groove improves or collapses.","family":"ableton-music","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"beat rhythm kick snare groove short music theory","source":"ABLETON / MUSIC PRODUCTION"},"more":{"label":"SKETCH A WHOLE SONG","source":"CHROME MUSIC LAB • SONG MAKER","url":"https://musiclab.chromeexperiments.com/Song-Maker","icon":"♪"},"id":"9-6"},{"title":"Turn Your Keyboard Into a Music Video","hook":"Every letter fires a sound and a moving shape; rhythm becomes something you see and hit.","brief":"Patatap is a portable sound-and-animation kit controlled by keys or touch. It is deliberately immediate: repeated taps create rhythm, different banks change the sound world, and visual motion makes timing visible.","main":{"label":"PLAY PATATAP","source":"PATATAP • SOUND + ANIMATION KIT","url":"https://patatap.com/","icon":"●","kind":"AUDIOVISUAL INSTRUMENT","time":"10–∞ MIN","mission":"Find four sounds that work together, build a repeatable rhythm, then switch banks and recreate the same rhythm with a completely different sonic personality.","family":"patatap","device":"TOUCH + KEYBOARD • FLASHING IMAGES","grade":"GOLD"},"watch":{"query":"rhythm audiovisual performance electronic music short","source":"MUSIC / DIGITAL ART"},"more":{"label":"TURN THE RHYTHM INTO A SONG","source":"BEEPBOX • CHIPTUNE MAKER","url":"https://beepbox.org/","icon":"♫"},"id":"9-7"},{"title":"Write a Chiptune","hook":"Square waves and tiny pattern grids are enough to make a surprisingly complete song.","brief":"BeepBox is a free browser sequencer for chiptune-style music. Notes live in repeating patterns, instruments are built from simple waveforms, and the entire song can be encoded into the URL, making composition feel unusually tangible.","main":{"label":"MAKE THE CHIPTUNE","source":"BEEPBOX • BROWSER SONG MAKER","url":"https://beepbox.org/","icon":"♫","kind":"MUSIC SEQUENCER","time":"15–∞ MIN","mission":"Write one melody pattern and one drum pattern, then arrange at least four sections so the song changes over time. Copy the URL when you reach a version worth keeping.","family":"beepbox","device":"DESKTOP / LANDSCAPE","grade":"GOLD"},"watch":{"query":"chiptune square wave game music composition short","source":"GAME MUSIC / SYNTHESIS"},"more":{"label":"LEARN WHY THE WAVES SOUND DIFFERENT","source":"ABLETON • LEARNING SYNTHS","url":"https://learningsynths.ableton.com/en/get-started","icon":"〽"},"id":"9-8"},{"title":"Make Drums From Everyday Noise","hook":"A machine-learning map clusters thousands of ordinary sounds; you turn the weirdest ones into a beat.","brief":"The Infinite Drum Machine organizes everyday recordings by sonic similarity rather than by human labels. You can wander the sound map, pick unlikely noises, and sequence them into a beat—part music toy, part demonstration of how an algorithm can organize audio.","main":{"label":"BUILD THE STRANGE DRUM KIT","source":"GOOGLE AI EXPERIMENTS • INFINITE DRUM MACHINE","url":"https://experiments.withgoogle.com/ai/drum-machine/view/","icon":"🥁","kind":"AI MUSIC TOY","time":"10–25 MIN","mission":"Choose four sounds from distant parts of the map and make a beat. Then replace one sound with a nearby neighbor and listen for what the machine considered “similar.”","family":"infinite-drum","device":"CHROME BEST • PHONE PORTRAIT","grade":"GOLD"},"watch":{"query":"Infinite Drum Machine t-SNE sounds machine learning short","source":"GOOGLE AI EXPERIMENTS"},"more":{"label":"MAKE A NORMAL BEAT NEXT","source":"ABLETON • LEARNING MUSIC","url":"https://learn.ableton.com/","icon":"♫"},"id":"9-9"},{"title":"Make Sound Draw Geometry","hook":"Hold one note steady and turn your voice or instrument into moving nodal patterns.","brief":"Cimatica visualizes live microphone sound as simulations inspired by Chladni figures—patterns formed by vibrating surfaces at resonant frequencies. It is not pretending your screen is a physical plate; it is a sound-driven mathematical model that makes frequency stability and resonance visible.","main":{"label":"MAKE THE PATTERNS MOVE","source":"CIMATICA • LIVE CYMATICS VISUALIZER","url":"https://www.cimatica.org/en","icon":"≈","kind":"SOUND VISUALIZER","time":"10–25 MIN","mission":"Allow microphone access, choose one target pattern, and try to hold a sung or played note steadily enough to stabilize it. Then compare a pure sustained note with speech or a chord.","family":"cimatica","device":"PHONE • TABLET • DESKTOP","grade":"GOLD"},"watch":{"query":"Chladni patterns cymatics resonance sound visualization short","source":"PHYSICS + MUSIC"},"more":{"label":"SEE SOUND ANOTHER WAY","source":"CHROME MUSIC LAB • SPECTROGRAM","url":"https://musiclab.chromeexperiments.com/Spectrogram/","icon":"▥"},"id":"9-10"}]},{"name":"Technology","label":"TECH","glyph":"◉","color":"#00c2ff","tagline":"Real tools beat fake school versions of tools.","topics":[{"title":"Teach a Machine","hook":"Give an AI examples, train it, then immediately discover how easy it is to fool.","brief":"Teachable Machine lets you build a small image, sound, or pose classifier without writing code. The important lesson appears when the model fails: machine learning does not 'understand' your categories; it learns patterns from the examples you supplied.","main":{"label":"TRAIN YOUR OWN AI","source":"GOOGLE • TEACHABLE MACHINE","url":"https://teachablemachine.withgoogle.com/","icon":"◉","kind":"AI TOOL","time":"15–30 MIN","mission":"Create two or three classes, train the model, then deliberately trick it with a new angle, background, pose, or sound it did not see during training.","family":"teachable-machine","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Teachable Machine machine learning classification short","source":"GOOGLE CREATIVE LAB / AI"},"more":{"label":"SEE THE NETWORK UNDERNEATH","source":"TENSORFLOW PLAYGROUND","url":"https://playground.tensorflow.org/","icon":"◎"},"id":"10-0"},{"title":"Build a Neural Network","hook":"Add neurons, add noise, press play, and watch a decision boundary learn.","brief":"TensorFlow Playground makes the hidden machinery of a tiny neural network visible. Data points flow through layers of software neurons, connections change strength, and the colored output region reshapes itself during training. It is one of the rare AI explainers where the explanation is the thing you manipulate.","main":{"label":"BUILD THE BRAIN","source":"TENSORFLOW PLAYGROUND","url":"https://playground.tensorflow.org/","icon":"◎","kind":"AI SIMULATION","time":"15–25 MIN","mission":"Train the default model, then remove most hidden neurons and watch what it can no longer learn. Add noise and see how the boundary changes.","family":"tensorflow","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"neural network visual explanation 3Blue1Brown","source":"3BLUE1BROWN / AI"},"more":{"label":"TRAIN ONE ON YOUR OWN EXAMPLES","source":"GOOGLE • TEACHABLE MACHINE","url":"https://teachablemachine.withgoogle.com/","icon":"◉"},"id":"10-1"},{"title":"Beat the Drawing AI","hook":"You get twenty seconds. The neural network gets twenty seconds to guess what your scribble is.","brief":"Quick, Draw! is a drawing game built around a machine-learning classifier. It is fun immediately, but the interesting part comes after each round when the site shows what the model confused your drawing with and how your doodle compares with a huge dataset.","main":{"label":"DRAW BEFORE IT GUESSES","source":"GOOGLE • QUICK, DRAW!","url":"https://quickdraw.withgoogle.com/","icon":"✎","kind":"AI GAME","time":"8–15 MIN","mission":"Play a full round. Pick one drawing the AI misunderstood and compare it with the examples it thought were similar. Decide what feature confused it.","family":"quickdraw","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Quick Draw neural network doodle dataset how it works","source":"GOOGLE CREATIVE LAB / AI"},"more":{"label":"MAKE YOUR OWN CLASSIFIER","source":"GOOGLE • TEACHABLE MACHINE","url":"https://teachablemachine.withgoogle.com/","icon":"◉"},"id":"10-2"},{"title":"Cyber Swiss Army Knife","hook":"Encode it, decode it, hash it, decompress it, inspect it, transform it—hundreds of operations in one browser tool.","brief":"CyberChef is a real data-analysis toolbox released by GCHQ, not a classroom imitation. You build a 'recipe' from operations and watch data transform step by step. That makes encodings, ciphers, hashes, and file formats tangible enough to experiment with.","main":{"label":"OPEN CYBERCHEF","source":"GCHQ • CYBERCHEF","url":"https://gchq.github.io/CyberChef/","icon":"⌘","kind":"REAL TOOL","time":"15–30 MIN","mission":"Type a secret message. Convert it to Base64, then hexadecimal, then reverse the recipe until you recover the original. Add one operation you do not understand and investigate what changed.","family":"cyberchef","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"CyberChef encoding Base64 hex beginner demo","source":"COMPUTERPHILE / CYBER"},"more":{"label":"TRY A CLEANER CIPHER TOOL","source":"CRYPTII","url":"https://cryptii.com/","icon":"⌁"},"id":"10-3"},{"title":"Boot the Old Web","hook":"Open the modern internet through an ancient browser and discover how quickly technology turns into archaeology.","brief":"oldweb.today emulates historical web browsers and connects them to archived websites. Interfaces that once felt normal become strange artifacts: tiny screens, missing standards, broken layouts, and completely different assumptions about what the web should be.","main":{"label":"START AN OLD BROWSER","source":"OLDWEB.TODAY • BROWSER EMULATOR","url":"https://oldweb.today/","icon":"▣","kind":"EMULATOR","time":"12–25 MIN","mission":"Pick an old browser, open an archived site from the 1990s, and find three interface ideas that feel alien compared with a modern browser.","family":"oldweb","device":"BEST ON DESKTOP","grade":"GOLD"},"watch":{"query":"history of the World Wide Web 1990s browsers short","source":"COMPUTERPHILE / INTERNET HISTORY"},"more":{"label":"TOUR INTERNET ARTIFACTS","source":"NEAL.FUN • INTERNET ARTIFACTS","url":"https://neal.fun/internet-artifacts/","icon":"◎"},"id":"10-4"},{"title":"Survive the Password Game","hook":"Every new rule makes the password more secure, less sane, or both.","brief":"The Password Game exaggerates password requirements into an escalating puzzle. Under the jokes are real technology themes: character rules, validation, changing requirements, external information, and the difference between security policies that help and policies that merely annoy users.","main":{"label":"START THE PASSWORD","source":"NEAL.FUN • THE PASSWORD GAME","url":"https://neal.fun/password-game/","icon":"🔐","kind":"PUZZLE GAME","time":"15–∞ MIN","mission":"Get as far as you can without a walkthrough. When a rule breaks an earlier rule, treat it like debugging: identify exactly which constraint conflicts and solve that conflict first.","family":"neal-fun-password","device":"DESKTOP / LANDSCAPE","grade":"GOLD"},"watch":{"query":"password security entropy usability rules short","source":"COMPUTERPHILE / SECURITY"},"more":{"label":"TRY REAL DATA TRANSFORMS","source":"CYBERCHEF • GCHQ","url":"https://gchq.github.io/CyberChef/","icon":"⌘"},"id":"10-5"},{"title":"Program a Turing Machine","hook":"A strip of symbols, a moving head, and a tiny rule table are enough to express surprisingly complicated computation.","brief":"Turingmachine.io visualizes one of computer science’s foundational abstract machines. You can run, pause, and step through rules while watching the read/write head move across the tape, making “an algorithm is a sequence of state changes” extremely literal.","main":{"label":"STEP THE MACHINE","source":"TURINGMACHINE.IO • VISUAL SIMULATOR","url":"https://turingmachine.io/","icon":"⌘","kind":"COMPUTATION SIM","time":"15–30 MIN","mission":"Load an example, step it manually until you understand one full loop, then change a symbol or transition and predict whether the machine halts, loops, or produces a different tape.","family":"turingmachine","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Turing machine computation visual explanation short","source":"COMPUTERPHILE / COMPUTER SCIENCE"},"more":{"label":"BUILD REAL LOGIC GATES","source":"NANDGAME","url":"https://nandgame.com/","icon":"◫"},"id":"10-6"},{"title":"Teach a Robot to Escape a Maze","hook":"Blocks become instructions, loops replace repetition, and “if” turns the maze into a program.","brief":"Blockly Games Maze introduces programming through a character moving in a grid. The early levels are simple, but the important transition arrives when repeated movement becomes a loop and path decisions become conditionals.","main":{"label":"CODE THE MAZE","source":"BLOCKLY GAMES • MAZE","url":"https://blockly.games/maze?lang=en","icon":"🤖","kind":"CODING GAME","time":"10–25 MIN","mission":"Reach level 10 if you can. Whenever you replace several movement blocks with one loop, count how many instructions you eliminated and why the program still behaves the same.","family":"blockly","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"coding loops conditionals visual beginner short","source":"COMPUTER SCIENCE / BLOCK CODING"},"more":{"label":"MAKE A BRANCHING PROGRAMMED STORY","source":"TWINE","url":"https://play.twinery.org/","icon":"⌘"},"id":"10-7"},{"title":"Save the Frogs With CSS","hook":"A real web-layout system becomes a 24-level pond puzzle.","brief":"Flexbox Froggy teaches CSS Flexbox by making you write small pieces of actual CSS to move frogs onto lilypads. Because every rule visibly rearranges objects, layout properties such as justify-content and align-items stop feeling like arbitrary vocabulary.","main":{"label":"CODE THE POND","source":"FLEXBOX FROGGY • CSS GAME","url":"https://flexboxfroggy.com/","icon":"🐸","kind":"CODING GAME","time":"15–30 MIN","mission":"Complete at least ten levels. Before pressing next, explain what the property you just used changed: direction, spacing, alignment, wrapping, or order.","family":"flexbox-froggy","device":"KEYBOARD BEST","grade":"GOLD"},"watch":{"query":"CSS flexbox layout visual explanation beginner","source":"WEB DEVELOPMENT / CSS"},"more":{"label":"BUILD A REAL WEB STORY","source":"TWINE • HTML STORY MAKER","url":"https://play.twinery.org/","icon":"⌘"},"id":"10-8"},{"title":"Visit a Website in 1999","hook":"The web forgets quickly; the Wayback Machine turns old websites into archaeological layers.","brief":"The Internet Archive’s Wayback Machine stores captures of websites across time. Watching a familiar company, game, news site, or institution mutate across years makes interface history concrete—and also shows that online information is much less permanent than it feels.","main":{"label":"OPEN THE WAYBACK MACHINE","source":"INTERNET ARCHIVE • WAYBACK","url":"https://web.archive.org/","icon":"⌛","kind":"WEB TIME MACHINE","time":"15–∞ MIN","mission":"Enter a site you recognize and open snapshots from at least three different years. Find one feature that disappeared, one that survived, and one design choice that now looks ancient.","family":"wayback","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"history of websites Wayback Machine early web short","source":"INTERNET ARCHIVE / WEB HISTORY"},"more":{"label":"BOOT AN OLD BROWSER TOO","source":"OLDWEB.TODAY","url":"https://oldweb.today/","icon":"▣"},"id":"10-9"},{"title":"Solve a Murder With a Database","hook":"The detective lost the report. Fortunately, an entire city's records are sitting in SQL tables.","brief":"The SQL Murder Mystery is a real query puzzle disguised as a detective case. Instead of clicking through clues, you ask a relational database questions using SQL: retrieve the crime report, join tables, inspect witnesses, and narrow the evidence until you can name the murderer.","main":{"label":"QUERY THE CRIME SCENE","source":"KNIGHT LAB • SQL MURDER MYSTERY","url":"https://mystery.knightlab.com/","icon":"⌨","kind":"DATABASE MYSTERY","time":"20–45 MIN","mission":"Use the beginner walkthrough if SQL is new. Retrieve the original crime-scene report yourself, then write or modify at least two queries that narrow the suspect list before checking the solution.","family":"sql-murder","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"SQL basics SELECT WHERE JOIN visual beginner short","source":"DATABASE / CODING"},"more":{"label":"LEARN SQL BY EXPLORING DATA","source":"SELECT STAR SQL","url":"https://selectstarsql.com/","icon":"▦"},"id":"10-10"}]},{"name":"People","label":"PEOPLE","glyph":"◎","color":"#f07cff","tagline":"Brains, perception, memory, social behavior, and the ways humans fool themselves.","topics":[{"title":"Benchmark Your Brain","hook":"Reaction time, memory, sequence tracking, typing, aiming—turn yourself into a tiny dataset.","brief":"Human Benchmark is a set of simple cognitive and motor tests. Scores are not a measure of your worth or intelligence; the fun is seeing how noisy performance is. Practice, fatigue, strategy, and attention can all move the number.","main":{"label":"TEST YOURSELF","source":"HUMAN BENCHMARK • BRAIN TESTS","url":"https://humanbenchmark.com/","icon":"◎","kind":"TEST ARCADE","time":"10–20 MIN","mission":"Try three different tests. Repeat one of them five times and see whether your score improves steadily or jumps around.","family":"human-benchmark","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"reaction time working memory attention short neuroscience","source":"SCISHOW PSYCH"},"more":{"label":"FOOL YOUR PERCEPTION NEXT","source":"MICHAEL BACH • ILLUSION LAB","url":"https://michaelbach.de/ot/","icon":"◉"},"id":"11-0"},{"title":"Your Eyes Are Editing Reality","hook":"More than 150 illusions reveal the shortcuts visual perception uses to build the world you think you see.","brief":"Michael Bach’s illusion collection emphasizes interactive perceptual phenomena rather than personality-test nonsense. Many effects let you move, toggle, or alter the stimulus yourself. The point is not 'your brain is bad'; it is that perception is an active reconstruction built for ordinary conditions.","main":{"label":"FOOL YOUR EYES","source":"MICHAEL BACH • INTERACTIVE ILLUSIONS","url":"https://michaelbach.de/ot/","icon":"◉","kind":"PERCEPTION LAB","time":"15–∞ MIN","mission":"Try at least five illusions from different sections. For each one, change a control if available and find the condition that makes the illusion strongest or weakest.","family":"michael-bach","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"optical illusions perception brain visual system short","source":"VSAUCE / PERCEPTION"},"more":{"label":"TEST MEMORY + REACTION","source":"HUMAN BENCHMARK","url":"https://humanbenchmark.com/","icon":"◎"},"id":"11-1"},{"title":"Catch the Framing Effect","hook":"The same outcome can feel different depending on whether somebody calls it a gain or a loss.","brief":"Framing effects show that decisions depend partly on how choices are described, even when the underlying facts are equivalent. This experiment asks you to make real choices first, which is much more revealing than simply being told that humans are biased.","main":{"label":"TAKE THE FRAMING TEST","source":"PHILOSOPHY EXPERIMENTS • FRAMING","url":"https://www.philosophyexperiments.com/framing","icon":"◇","kind":"BEHAVIOR TEST","time":"8–15 MIN","mission":"Answer quickly without calculating what the site is testing. When the matched questions appear, compare your choices and decide whether the wording changed your judgment.","family":"philosophy-experiments","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"framing effect cognitive bias Kahneman short","source":"SCISHOW PSYCH"},"more":{"label":"CHECK OTHER BELIEF TRAPS","source":"PHILOSOPHY EXPERIMENTS • GAMES","url":"https://www.philosophyexperiments.com/games","icon":"◇"},"id":"11-2"},{"title":"Museum Memory","hook":"Art museum meets memory game: look, remember, reconstruct.","brief":"Museum Memory turns real artworks and objects into a visual memory challenge. That makes attention itself visible: you discover which details your brain kept, which it discarded, and which it quietly invented after the fact.","main":{"label":"TEST YOUR MUSEUM MEMORY","source":"GOOGLE ARTS & CULTURE • MUSEUM MEMORY","url":"https://artsandculture.google.com/experiment/museum-memory/UwFgDuAF8A7n0A","icon":"🧠","kind":"MEMORY GAME","time":"8–15 MIN","mission":"Play several rounds. Notice whether you remember color, position, object identity, or overall shape best—and whether your strategy changes.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how visual memory works change blindness short","source":"VSAUCE / PSYCHOLOGY"},"more":{"label":"TRY A DIFFERENT MEMORY TEST","source":"HUMAN BENCHMARK","url":"https://humanbenchmark.com/","icon":"◎"},"id":"11-3"},{"title":"We Become What We Behold","hook":"Point a camera at a tiny society and discover how media can amplify exactly the worst thing.","brief":"This short game models a feedback loop between attention, media, fear, imitation, and social behavior. It is intentionally exaggerated, but that is useful: you can watch a system escalate because the camera rewards whatever gets the strongest reaction.","main":{"label":"CONTROL THE CAMERA","source":"NICKY CASE • WE BECOME WHAT WE BEHOLD","url":"https://ncase.itch.io/wbwwb","icon":"◉","kind":"SOCIAL SYSTEM GAME","time":"5–10 MIN","mission":"Play all the way through once. On the second run, pay attention to the moment the feedback loop becomes hard to stop and what your camera choices did to accelerate it.","family":"ncase","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"media attention feedback loops social psychology short","source":"TED-ED / MEDIA LITERACY"},"more":{"label":"MODEL A SYSTEM YOURSELF","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"11-4"},{"title":"Your Brain Hates the Word RED","hook":"The word says BLUE. The ink is red. Somehow this becomes a measurable fight inside your attention.","brief":"The Stroop effect appears when reading a word interferes with naming its ink color. PsyToolkit’s short touchscreen experiment measures your own reaction time under matching and conflicting conditions, turning a classic psychology result into data about your performance.","main":{"label":"RUN THE STROOP TEST","source":"PSYTOOLKIT • MOBILE STROOP TASK","url":"https://www.psytoolkit.org/experiment-library/stroop_phone.html","icon":"🧠","kind":"COGNITIVE EXPERIMENT","time":"5–10 MIN","mission":"Run the full demo without slowing down on purpose. Compare congruent and incongruent reaction times, then predict what would happen if the words were in a language you could not read.","family":"psytoolkit","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Stroop effect attention automatic reading short","source":"PSYCHOLOGY / COGNITION"},"more":{"label":"TRY ANOTHER INTERFERENCE TEST","source":"PSYTOOLKIT • SIMON TASK","url":"https://us.psytoolkit.org/experiment-library/touch_simon.html","icon":"↔"},"id":"11-5"},{"title":"Remember a Word That Was Never Shown","hook":"A list quietly builds a theme in your head, and your memory may invent the missing word for you.","brief":"The DRM false-memory task presents related word lists and then tests recognition, including a strongly related lure word that never appeared. The result demonstrates that memory is reconstructive: remembering the meaning of a pattern can sometimes create confidence in an event that did not happen.","main":{"label":"PLANT A FALSE MEMORY","source":"KING UNIVERSITY • DRM TASK","url":"https://www.king.edu/tools/false-memory-drm-task","icon":"◎","kind":"MEMORY EXPERIMENT","time":"8–15 MIN","mission":"Do the task without taking notes. At the results screen, check whether you recognized any lure words and compare your confidence in true versus false memories.","family":"king-memory","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"DRM false memory experiment memory reconstruction short","source":"PSYCHOLOGY / MEMORY"},"more":{"label":"BENCHMARK YOUR MEMORY","source":"HUMAN BENCHMARK","url":"https://humanbenchmark.com/","icon":"◎"},"id":"11-6"},{"title":"Find the Target in the Crowd","hook":"One odd item can pop out instantly—or vanish into clutter depending on what makes it different.","brief":"Visual-search experiments measure how attention scans a field of distracting objects. PsyToolkit lets you perform the task and see how response time changes when the target is defined by one obvious feature versus a more complicated combination.","main":{"label":"RUN A VISUAL SEARCH","source":"PSYTOOLKIT • VISUAL SEARCH EXPERIMENT","url":"https://www.psytoolkit.org/experiment-library/search.html","icon":"🔎","kind":"ATTENTION EXPERIMENT","time":"8–15 MIN","mission":"Complete the experiment, then compare easy pop-out trials with harder searches. Identify which vis
