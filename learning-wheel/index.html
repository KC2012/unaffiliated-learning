<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Wheel of Education v2.6</title>
<style>
:root{
  color-scheme:dark;
  --ink:#fff9e9;--muted:#a8b3bd;--gold:#ffd166;--accent:#ff9f1c;
  --line:rgba(255,255,255,.11)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#030507;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 78% 4%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 31%),
    radial-gradient(circle at 42% -12%,#283546 0,#0a1119 34%,#030507 75%);
  transition:background .5s ease;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;
  background:linear-gradient(rgba(255,255,255,.023) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(#000,transparent 90%)
}
button,a{font:inherit}button{color:inherit}
.top{
  height:62px;display:flex;align-items:center;padding:0 18px;position:fixed;inset:0 0 auto 0;z-index:40;pointer-events:none
}
.logo{font-weight:1000;letter-spacing:.18em;font-size:11px;color:rgba(255,255,255,.88);text-shadow:0 2px 20px #000}
.logo b{color:var(--gold)}
.sound{
  margin-left:auto;pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:rgba(5,9,13,.72);backdrop-filter:blur(12px);font-size:17px;cursor:pointer
}
main{min-height:100vh;display:grid;grid-template-columns:minmax(500px,1.02fr) minmax(470px,.98fr)}
.stage{
  position:relative;min-height:100vh;display:grid;place-items:center;padding:78px 30px 42px;overflow:hidden;
  border-right:1px solid rgba(255,255,255,.07)
}
.stage:before{
  content:"";position:absolute;width:min(80vw,840px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,209,102,.13),rgba(255,209,102,.028) 45%,transparent 70%);
  filter:blur(28px);animation:breath 3.3s ease-in-out infinite
}
.stage:after{
  content:"";position:absolute;width:min(74vh,700px);aspect-ratio:1;border:1px solid rgba(255,255,255,.035);
  border-radius:50%;box-shadow:0 0 0 24px rgba(255,255,255,.012),0 0 0 54px rgba(255,255,255,.009)
}
@keyframes breath{50%{transform:scale(1.06);opacity:.66}}
.wheel-wrap{position:relative;width:min(76vh,735px);max-width:92vw;aspect-ratio:1;display:grid;place-items:center;z-index:2}
#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 30px 42px rgba(0,0,0,.65));cursor:pointer}
.label-rotor{position:absolute;inset:0;z-index:4;pointer-events:none;transform-origin:50% 50%;will-change:transform;contain:layout paint style}
.wheel-label{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;color:#090d13;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:950;letter-spacing:-.025em;line-height:1;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;text-shadow:0 1px 0 rgba(255,255,255,.30),0 0 1px rgba(255,255,255,.15),0 1px 2px rgba(0,0,0,.16);transform-origin:50% 50%;user-select:none}
.wheel-wrap:after{content:"";position:absolute;inset:8.4%;border-radius:50%;pointer-events:none;z-index:3;border:1px solid rgba(4,8,13,.18);box-shadow:inset 0 0 28px rgba(255,255,255,.025),0 0 0 1px rgba(255,255,255,.035)}
.pointer{
  position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:24px solid transparent;border-right:24px solid transparent;border-top:64px solid #fff4bd;
  filter:drop-shadow(0 6px 3px #000);z-index:6;transform-origin:50% 0
}
.pointer:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:white;top:-59px;left:-6px;box-shadow:0 0 20px #ffd166}
.pointer.kick{animation:kick .095s ease-out}
@keyframes kick{50%{transform:translateX(-50%) rotate(8deg)}}
#spin{
  position:absolute;width:130px;height:130px;border-radius:50%;z-index:7;border:4px solid #fff7d5;
  background:radial-gradient(circle at 34% 27%,#fffbd8,#ffb20b 47%,#874000);color:#171109;
  font-weight:1000;letter-spacing:.15em;font-size:18px;cursor:pointer;
  box-shadow:0 9px 0 #5c2c00,0 18px 42px #000,0 0 58px rgba(255,185,0,.34);transition:.12s
}
#spin:hover{transform:scale(1.04)}#spin:active{transform:scale(.97);box-shadow:0 4px 0 #5c2c00,0 10px 25px #000}#spin:disabled{cursor:wait}
.hint{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:9px;font-weight:1000;letter-spacing:.26em;color:rgba(255,255,255,.40)}

.reveal{
  position:relative;min-height:100vh;display:grid;place-items:center;padding:78px clamp(24px,4vw,58px) 42px;overflow:hidden;
  background:linear-gradient(180deg,rgba(12,16,23,.82),rgba(5,8,12,.96))
}
.reveal:before{content:"";position:absolute;width:760px;height:760px;right:-390px;top:-330px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 68%);opacity:.12;filter:blur(24px)}
.reveal:after{content:"";position:absolute;width:500px;height:500px;left:-290px;bottom:-290px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 68%);opacity:.07;filter:blur(20px)}
.empty{position:relative;z-index:2;text-align:center;color:#71808c}
.empty .mark{font-size:86px;line-height:1;opacity:.35;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(5deg)}}
.empty div:last-child{font-size:11px;font-weight:1000;letter-spacing:.18em;margin-top:18px}
.result{display:none;position:relative;z-index:3;width:min(720px,100%)}
.reveal.ready .empty{display:none}.reveal.ready .result{display:block}
.result-top{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:1000;letter-spacing:.19em;color:#e2e8ed;margin-bottom:15px}
.subject-orb{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 24px var(--accent)}
.hero{position:relative}
.glyph{position:absolute;right:-6px;top:-55px;font-size:128px;line-height:1;color:var(--accent);opacity:.08;font-weight:1000;transform:rotate(-9deg);pointer-events:none}
h1{font-family:Georgia,ui-serif,serif;font-size:clamp(46px,5.1vw,76px);line-height:.94;letter-spacing:-.045em;margin:0;max-width:650px;text-wrap:balance}
.hook{font-size:clamp(16px,1.5vw,20px);line-height:1.5;color:#d0d8df;margin:16px 0 0;max-width:630px}


.brief-card{margin-top:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.017));padding:16px 18px;display:grid;grid-template-columns:46px 1fr;gap:13px;box-shadow:0 14px 34px rgba(0,0,0,.20)}
.brief-mark{font:1000 25px/1 Georgia,serif;color:var(--accent);opacity:.72;padding-top:2px}
.brief-kicker{font-size:9px;font-weight:1000;letter-spacing:.18em;color:var(--accent);margin-bottom:6px}
#overviewText{font-size:13px;line-height:1.58;color:#c8d1d9;margin:0}
.main-event{display:block;position:relative;margin-top:14px;border-radius:21px;border:1px solid color-mix(in srgb,var(--accent) 42%,white 15%);background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 14%,#151a21 86%),rgba(10,13,18,.96));overflow:hidden;text-decoration:none;color:white;padding:18px 19px 19px;box-shadow:0 20px 46px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.07);transition:.18s;isolation:isolate}
.main-event:hover,.main-event:active{transform:translateY(-3px) scale(1.008);border-color:color-mix(in srgb,var(--accent) 78%,white 22%);box-shadow:0 25px 54px rgba(0,0,0,.46),0 0 36px color-mix(in srgb,var(--accent) 20%,transparent)}
.main-glow{position:absolute;width:360px;height:300px;border-radius:50%;right:-130px;bottom:-200px;background:radial-gradient(circle,var(--accent),transparent 67%);opacity:.30;filter:blur(4px);z-index:-1}
.main-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.main-badge{font-size:9px;font-weight:1000;letter-spacing:.17em;color:#090c10;background:var(--accent);border-radius:999px;padding:6px 9px;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 32%,transparent)}
.chip{font-size:8px;font-weight:1000;letter-spacing:.10em;color:#d6e0e7;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 8px;background:rgba(255,255,255,.035)}
.chip.subtle{color:#8998a4}
.main-body{display:grid;grid-template-columns:62px 1fr 48px;gap:14px;align-items:center}
.main-icon{font-size:51px;line-height:1;text-align:center;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 35%,transparent))}
.main-label{font-size:clamp(20px,2vw,28px);font-weight:1000;letter-spacing:.035em;line-height:1.06}
.main-source{font-size:9px;font-weight:900;letter-spacing:.11em;color:var(--accent);margin-top:6px}
.mission{font-size:11px;line-height:1.52;color:#aebac3;margin-top:10px;max-width:525px}.mission b{color:#f3f7f9;font-size:9px;letter-spacing:.09em}
.open-arrow{text-align:center;font-size:9px;line-height:1.6;letter-spacing:.14em;font-weight:1000;color:#eef4f7;opacity:.72;transition:.15s}
.main-event:hover .open-arrow{opacity:1;transform:translate(2px,-2px)}
.support{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
.support-card{min-height:82px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.060),rgba(255,255,255,.015));color:white;text-decoration:none;display:grid;grid-template-columns:42px 1fr;gap:11px;align-items:center;padding:13px 15px;transition:.16s}
.support-card:hover,.support-card:active{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 48%,white 15%);background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.022))}
.support-icon{font-size:28px;text-align:center}.support-card b{display:block;font-size:11px;letter-spacing:.13em;line-height:1.25}.support-card small{display:block;margin-top:5px;color:#8f9da8;font-size:8px;font-weight:800;letter-spacing:.07em;line-height:1.35}
.curated-stamp{margin-left:auto;color:#667783;font-size:7px;letter-spacing:.11em}
.again{display:flex;justify-content:center;margin-top:11px}.again button{border:0;background:none;color:#7e8e9b;font-size:10px;font-weight:1000;letter-spacing:.17em;padding:12px 18px;cursor:pointer}.again button:hover{color:#fff}

.flash{position:fixed;inset:0;pointer-events:none;z-index:80;background:radial-gradient(circle,rgba(255,255,255,.82),rgba(255,255,255,.18) 26%,transparent 64%);opacity:0}
.flash.go{animation:flash .48s ease-out}@keyframes flash{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:100}
.spark{position:absolute;border-radius:50%;transform:translate(var(--x0),var(--y0));animation:spark var(--dur) cubic-bezier(.1,.7,.15,1) forwards;box-shadow:0 0 10px currentColor}
.spark.star{border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes spark{to{transform:translate(calc(var(--x0) + var(--dx)),calc(var(--y0) + var(--dy))) rotate(var(--rot));opacity:0}}
.reveal.ready .result{animation:reveal .52s cubic-bezier(.1,.75,.15,1)}@keyframes reveal{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}

@media(max-width:1050px){
  main{grid-template-columns:1fr}
  .stage{min-height:auto;height:60vh;padding:64px 20px 10px;border-right:0;border-bottom:1px solid rgba(255,255,255,.07)}
  .wheel-wrap{width:min(53vh,610px)}
  .hint{display:none}
  .reveal{min-height:40vh;padding:30px 24px 38px}
  .empty{display:none}
  .reveal:not(.ready){min-height:100px}
  .reveal:not(.ready):after{content:"SPIN THE WHEEL";position:relative;inset:auto;width:auto;height:auto;background:none;opacity:1;filter:none;font-size:10px;font-weight:1000;letter-spacing:.22em;color:#687784}
}
@media(max-width:650px){
  .top{height:52px}.stage{height:57vh;padding-top:50px}.wheel-wrap{width:min(50vh,95vw)}
  #spin{width:92px;height:92px;font-size:13px}.pointer{border-left-width:17px;border-right-width:17px;border-top-width:45px}
  .reveal{min-height:43vh;padding:24px 15px 30px}
  h1{font-size:clamp(38px,12vw,58px)}.hook{font-size:14px}.glyph{font-size:84px}
  .brief-card{grid-template-columns:36px 1fr;padding:13px}.brief-mark{font-size:20px}#overviewText{font-size:12px}
  .main-event{padding:15px 14px}.main-body{grid-template-columns:46px 1fr 32px;gap:9px}.main-icon{font-size:38px}.main-label{font-size:19px}.mission{font-size:10px}.open-arrow{font-size:8px}
  .support{gap:8px}.support-card{grid-template-columns:32px 1fr;padding:11px;min-height:74px}.support-icon{font-size:23px}.curated-stamp{display:none}.logo{font-size:9px}
}
@media(max-width:430px){.support{grid-template-columns:1fr}.main-top .chip.subtle{display:none}}
@media(prefers-reduced-motion:reduce){.stage:before,.empty .mark{animation:none}}
</style>
</head>
<body>
<div class="top"><div class="logo">WHEEL <b>OF</b> EDUCATION</div><button id="sound" class="sound" aria-label="Toggle sound">🔊</button></div>
<div id="flash" class="flash"></div><div id="fx"></div>
<main>
<section class="stage">
  <div class="wheel-wrap">
    <canvas id="wheel" aria-label="Spinning wheel of curiosity categories"></canvas>
    <div id="labelRotor" class="label-rotor" aria-hidden="true"></div>
    <div class="pointer"></div>
    <button id="spin">SPIN</button>
  </div>
  <div class="hint">SPIN • THEN GO DO SOMETHING REAL</div>
</section>
<section id="reveal" class="reveal">
  <div class="empty"><div class="mark">✦</div><div>176 HAND-PICKED RABBIT HOLES</div></div>
  <div class="result">
    <div class="result-top">
      <span class="subject-orb"></span><span id="subject"></span>
      <span class="curated-stamp">RESOURCE-FIRST • 176 CURATED TOPICS</span>
    </div>
    <div class="hero"><div id="glyph" class="glyph"></div><h1 id="title"></h1><p id="hook" class="hook"></p></div>

    <article class="brief-card">
      <div class="brief-mark">01</div>
      <div><div class="brief-kicker">20-SECOND BRIEFING</div><p id="overviewText"></p></div>
    </article>

    <a id="mainEvent" class="main-event" target="_blank" rel="noopener">
      <div class="main-glow"></div>
      <div class="main-top">
        <span class="main-badge">★ MAIN EVENT</span>
        <span id="mainKind" class="chip"></span>
        <span id="mainTime" class="chip"></span>
        <span id="mainDevice" class="chip subtle"></span>
      </div>
      <div class="main-body">
        <span id="mainIcon" class="main-icon">✦</span>
        <div class="main-copy">
          <div id="mainLabel" class="main-label"></div>
          <div id="mainSource" class="main-source"></div>
          <div class="mission"><b>YOUR MISSION:</b> <span id="mainMission"></span></div>
        </div>
        <div class="open-arrow">OPEN<br>↗</div>
      </div>
    </a>

    <div class="support">
      <a id="watch" class="support-card" target="_blank" rel="noopener">
        <span class="support-icon">▶</span>
        <div><b>WATCH FIRST</b><small id="watchSub"></small></div>
      </a>
      <a id="more" class="support-card" target="_blank" rel="noopener">
        <span id="moreIcon" class="support-icon">↗</span>
        <div><b id="moreLabel">ONE MORE DOOR</b><small id="moreSub"></small></div>
      </a>
    </div>
    <div class="again"><button id="again">↻ SPIN AGAIN</button></div>
  </div>
</section>
</main>
<script>
const DATA={"version":"2.6","curated":"2026-10-18","subjects":[{"name":"History","label":"HISTORY","glyph":"⚔","color":"#f6a623","tagline":"The past, but only when there is something worth opening, moving, playing, or inspecting.","topics":[{"title":"1066 in Seventy Meters","hook":"An invasion, a disputed crown, ships, cavalry, propaganda—and one enormous medieval comic strip.","brief":"The Bayeux Tapestry tells the Norman conquest of England across roughly seventy meters of embroidered linen. It is not a neutral camera: it is a designed story about power, legitimacy, war, fear, and victory. The official panorama lets you inspect the actual object closely enough to see individual threads.","main":{"label":"UNROLL THE INVASION","source":"BAYEUX MUSEUM • OFFICIAL PANORAMA","url":"https://www.bayeuxmuseum.com/en/the-bayeux-tapestry/discover-the-bayeux-tapestry/explore-online/","icon":"⚔","kind":"PRIMARY SOURCE","time":"8–15 MIN","mission":"Start at the beginning and travel until you find Halley’s Comet. Then zoom in far enough to see the stitching and pick one scene that looks like propaganda.","family":"bayeux","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Norman conquest Bayeux Tapestry 1066 short animation","source":"OVERLY SARCASTIC PRODUCTIONS / HISTORY"},"more":{"label":"MOVE THE WORLD TO 1066","source":"THE WORLD THROUGH TIME","url":"https://theworldthroughtime.com/app?year=1066","icon":"⌖"},"id":"0-0"},{"title":"Enter Lascaux","hook":"Twenty-one thousand years ago, people entered a dark cave and covered it with animals.","brief":"Lascaux is one of the great surviving galleries of Ice Age art. The paintings were not casual doodles: many are enormous, carefully placed, layered, and deep underground. Because the original cave is closed for preservation, digital reconstruction gives us a strange advantage—we can wander without breathing on anything.","main":{"label":"GO INSIDE THE CAVE","source":"FRENCH MINISTRY OF CULTURE • VIRTUAL LASCAUX","url":"https://archeologie.culture.gouv.fr/lascaux/en/visit-cave","icon":"◌","kind":"VIRTUAL PLACE","time":"10–20 MIN","mission":"Enter the cave, move through at least three chambers, and choose the animal you think would have been hardest to paint by torchlight. Figure out why.","family":"lascaux","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Lascaux cave paintings short documentary prehistoric art","source":"TED-ED / ARCHAEOLOGY"},"more":{"label":"HANDLE THE 3D CAVE","source":"LASCAUX • OFFICIAL 3D MODEL","url":"https://archeologie.culture.gouv.fr/lascaux/en/media/view/13589","icon":"◈"},"id":"0-1"},{"title":"The Serpent Game","hook":"Ancient Mesoamerica, museum objects, mythology—and an actual maze game.","brief":"Google Arts & Culture and Mexico’s National Museum of Anthropology turned real Mesoamerican objects and symbols into a four-level adventure game. You are not taking a quiz about artifacts; you are collecting them inside a mythic maze and gradually learning what the symbols meant to the people who made them.","main":{"label":"DESCEND WITH THE SERPENT","source":"GOOGLE ARTS & CULTURE • FULL-LENGTH GAME","url":"https://artsandculture.google.com/experiment/the-descent-of-the-serpent/vAEAZBv58OliBA","icon":"🐍","kind":"GAME","time":"15–30 MIN","mission":"Play until you recover at least five museum objects. Before leaving, pick the strangest symbol you found and learn what it represented.","family":"google-arts","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Mesoamerican mythology Piedra del Sol short animation","source":"TED-ED / MESOAMERICA"},"more":{"label":"ZOOM OUT TO MEXICO","source":"GOOGLE EARTH","url":"https://earth.google.com/web/","icon":"⌖"},"id":"0-2"},{"title":"Walk Into 1776","hook":"The Declaration of Independence becomes streets, rooms, documents, arguments, and choices instead of a date to memorize.","brief":"This immersive experience uses Street View-style exploration of Independence National Historical Park, close-up primary documents, narration, recreations, and quizzes. The interesting part is seeing the Revolution as something that happened in actual rooms between actual people—not as a paragraph labeled 1776.","main":{"label":"WALK THE FOUNDING","source":"GOOGLE ARTS & CULTURE • PATH TO INDEPENDENCE","url":"https://artsandculture.google.com/experiment/LAHANK9nmqPc8Q?cp=1","icon":"⌖","kind":"IMMERSIVE HISTORY","time":"12–25 MIN","mission":"Visit at least two locations, inspect one original document, and find one decision where the outcome would not have been obvious to somebody living in 1776.","family":"google-arts","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"American Revolution Declaration 1776 short visual history","source":"TED-ED / HISTORY"},"more":{"label":"SET THE WORLD TO 1776","source":"THE WORLD THROUGH TIME","url":"https://theworldthroughtime.com/app?year=1776","icon":"🌎"},"id":"0-3"},{"title":"The Mongol Map Moves","hook":"The largest contiguous land empire did not appear all at once. Drag time and watch it happen.","brief":"The Mongol conquests are much easier to understand when territory actually moves. This map lets you change the year, inspect states, and watch political geography reorganize as Mongol armies and successor states spread across Eurasia. Geography becomes part of the explanation: steppe, distance, neighbors, and routes matter.","main":{"label":"MOVE THE EMPIRE","source":"THE WORLD THROUGH TIME • INTERACTIVE MAP","url":"https://theworldthroughtime.com/app?polity=mongol-empire&year=1250","icon":"⌖","kind":"TIME MAP","time":"10–20 MIN","mission":"Start around 1200, move forward through the conquests, and stop three times. At each stop, identify the next major region the empire is about to collide with.","family":"world-through-time","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Mongol Empire tactics logistics animation","source":"KINGS AND GENERALS"},"more":{"label":"COMPARE EMPIRE SCALE","source":"REALSIZE.WORLD • INTERACTIVE ATLAS","url":"https://realsize.world/en","icon":"🌐"},"id":"0-4"},{"title":"Go Inside Giza","hook":"The pyramids stop being silhouettes and turn back into buildings you can walk around.","brief":"Harvard’s Digital Giza project rebuilds the Giza plateau from archaeological records, photographs, plans, and research. The 3D tours let you move through pyramid complexes, temples, tombs, and the Sphinx while keeping the actual ancient landscape in view.","main":{"label":"WALK GIZA IN 3D","source":"HARVARD • DIGITAL GIZA","url":"https://giza.fas.harvard.edu/giza3d/","icon":"△","kind":"3D ARCHAEOLOGY","time":"15–30 MIN","mission":"Start with the walking tour, then enter one pyramid or tomb. Find one architectural feature you would never have noticed from an exterior photograph and work out what job it served.","family":"digital-giza","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Giza pyramids construction archaeology short visual","source":"SMITHSONIAN / ARCHAEOLOGY"},"more":{"label":"OPEN THE ARCHAEOLOGY DATABASE","source":"HARVARD • DIGITAL GIZA","url":"https://giza.fas.harvard.edu/","icon":"▦"},"id":"0-5"},{"title":"Travel Like a Roman","hook":"A straight line from Rome to Londinium is useless if the ship is expensive, the road is slow, and winter changes everything.","brief":"ORBIS reconstructs the transportation network of the Roman world and lets you compare routes by time, distance, and cost. Roads, rivers, sea lanes, transport method, and season all matter, so the Roman Empire becomes a logistics system rather than a colored blob on a map.","main":{"label":"PLAN A ROMAN JOURNEY","source":"STANFORD • ORBIS","url":"https://orbis.stanford.edu/","icon":"⌖","kind":"ROUTE SIMULATOR","time":"15–30 MIN","mission":"Plan a trip from Rome to Londinium or Alexandria twice: once for speed and once for cost. Change the season or transport mode and see how the winning route changes.","family":"orbis","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Roman roads sea travel logistics Roman Empire animation","source":"HISTORY / ROMAN ENGINEERING"},"more":{"label":"COMPARE WITH AN OLD MAP","source":"OLDMAPSONLINE","url":"https://www.oldmapsonline.org/en","icon":"▤"},"id":"0-6"},{"title":"Apollo 11: Be There","hook":"Mission control chatter, onboard audio, film, photos, transcripts—synchronized to the actual mission clock.","brief":"Apollo 11 in Real Time rebuilds the first Moon landing entirely from original mission material. You can jump to launch, lunar landing, EVA, or some ordinary quiet minute and hear the astronauts and controllers exactly where they were in the timeline.","main":{"label":"ENTER MISSION CONTROL","source":"APOLLO 11 IN REAL TIME","url":"https://apolloinrealtime.org/11/","icon":"🚀","kind":"PRIMARY-SOURCE REPLAY","time":"20–∞ MIN","mission":"Jump to the lunar landing, listen for five minutes without skipping, then open one mission-control audio channel. Find one moment where the calm voices hide how risky the situation actually was.","family":"apollo-realtime","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Apollo 11 lunar landing guidance computer short documentary","source":"NASA / APOLLO"},"more":{"label":"USE THE APOLLO COMPUTER","source":"WEBAGC • DSKY EMULATOR","url":"https://michaelfranzl.github.io/webAGC/demo/","icon":"◉"},"id":"0-7"},{"title":"Step Into the Secret Annex","hook":"A famous diary becomes a real arrangement of rooms, doors, stairs, silence, and almost no privacy.","brief":"The Anne Frank House lets you explore the Secret Annex online and connect individual rooms to the people who hid there. Seeing the space changes the story: eight people lived for more than two years inside a place whose dimensions and sounds mattered every day.","main":{"label":"ENTER THE ANNEX","source":"ANNE FRANK HOUSE • OFFICIAL INTERACTIVE","url":"https://www.annefrank.org/en/anne-frank/secret-annex/","icon":"▣","kind":"VIRTUAL HISTORIC PLACE","time":"15–30 MIN","mission":"Move through every accessible room. Pick one ordinary daily activity—sleeping, eating, washing, studying—and figure out why the physical layout would make it difficult.","family":"anne-frank-house","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Anne Frank Secret Annex life hiding short documentary","source":"ANNE FRANK HOUSE / HISTORY"},"more":{"label":"SEE THE MUSEUM IN 3D","source":"ANNE FRANK HOUSE • VIRTUAL TOUR","url":"https://www.annefrank.org/en/about-us/news-and-press/news/2024/11/14/the-anne-frank-house-launches-a-3d-virtual-tour/","icon":"◈"},"id":"0-8"},{"title":"Put Old Maps on Top of the World","hook":"Slide time backward, find an old map, and compare what cartographers thought was important with what exists now.","brief":"OldMapsOnline is an interactive historical-map index with a timeline and place-based exploration. The fun is not simply finding an old map: it is lining different maps up mentally with the modern world and noticing borders, names, coastlines, railroads, streets, and blank spaces change.","main":{"label":"OPEN THE MAP TIME MACHINE","source":"OLDMAPSONLINE • INTERACTIVE ATLAS","url":"https://www.oldmapsonline.org/en","icon":"▤","kind":"MAP EXPLORER","time":"15–∞ MIN","mission":"Search for a city you know, move the timeline backward, and open maps from at least two different centuries. Find one feature that appears, disappears, or changes name.","family":"oldmaps","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"how old maps reveal history cartography short","source":"MAP HISTORY / CARTOGRAPHY"},"more":{"label":"COMPARE WITH THE LIVE EARTH","source":"GOOGLE EARTH","url":"https://earth.google.com/web/","icon":"🌎"},"id":"0-9"},{"title":"Play a 4,500-Year-Old Board Game","hook":"People were worrying about lucky rolls, safe spaces, captures, and comebacks before the pyramids were old.","brief":"The Royal Game of Ur was played in ancient Mesopotamia about 4,500 years ago. Its exact rules had to be reconstructed from surviving boards and ancient writing, which means playing it is also a tiny exercise in experimental history: an old object stops being something behind glass and becomes a competitive system again.","main":{"label":"PLAY THE ROYAL GAME OF UR","source":"YORIMICHI GAMES • FINKEL RULES","url":"https://www.yorimichi-games.com/en/ur/","icon":"◆","kind":"ANCIENT BOARD GAME","time":"10–25 MIN","mission":"Start against the CPU using the standard Finkel rules. Work out why the rosette spaces matter, then win—or lose—one full game before changing any rule.","family":"royal-ur","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Royal Game of Ur Irving Finkel how to play short","source":"BRITISH MUSEUM / ANCIENT GAMES"},"more":{"label":"SEE THE REAL OBJECTS","source":"BRITISH MUSEUM • ROYAL GAME OF UR","url":"https://www.britishmuseum.org/collection/search?title=The+Royal+Game+of+Ur","icon":"◈"},"id":"0-10"}]},{"name":"Science","label":"SCIENCE","glyph":"⚛","color":"#33d6c5","tagline":"Touch the model. Change the variable. See what breaks.","topics":[{"title":"Quantum Weirdness","hook":"Make waves behave like particles and particles behave like waves until ordinary intuition gives up.","brief":"At very small scales, nature does not behave like tiny billiard balls. Quantum interference is one of the clearest places to see that failure of everyday intuition. The simulation lets you fire waves or particles, change barriers, and watch interference patterns form instead of merely reading that they do.","main":{"label":"RUN THE DOUBLE-SLIT","source":"PHET • QUANTUM WAVE INTERFERENCE","url":"https://phet.colorado.edu/en/simulations/quantum-wave-interference","icon":"⚛","kind":"SIMULATION","time":"10–20 MIN","mission":"Run the setup with one opening, then two. Change the wavelength or particle source and try to predict what the screen will look like before you press play.","family":"phet","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"double slit experiment quantum short visual explanation","source":"VERITASIUM / PHYSICS"},"more":{"label":"PLAY WITH ORDINARY WAVES","source":"PHET • WAVE INTERFERENCE","url":"https://phet.colorado.edu/en/simulations/wave-interference","icon":"≈"},"id":"1-0"},{"title":"Build an Atomic Nucleus","hook":"Drag protons and neutrons together and discover that 'more' does not always mean 'more stable.'","brief":"An atomic nucleus is a tug-of-war between forces. Protons repel one another electrically, but the strong nuclear force can bind nearby protons and neutrons together. By building nuclei yourself, stability stops being a list of facts and becomes something you can poke.","main":{"label":"BUILD THE NUCLEUS","source":"PHET • BUILD A NUCLEUS","url":"https://phet.colorado.edu/en/simulations/build-a-nucleus","icon":"☢","kind":"SIMULATION","time":"8–15 MIN","mission":"Build several nuclei, including one that is unstable. Change the neutron count without changing the element and watch what happens to stability.","family":"phet","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"atomic nucleus protons neutrons stability short animation","source":"TED-ED / NUCLEAR PHYSICS"},"more":{"label":"BUILD THE WHOLE ATOM","source":"PHET • BUILD AN ATOM","url":"https://phet.colorado.edu/en/simulations/build-an-atom","icon":"⚛"},"id":"1-1"},{"title":"Build the Most Dangerous Skate Park","hook":"A roller coaster for one skater becomes a laboratory for energy, speed, height, and friction.","brief":"Energy conservation is much less abstract when you can draw a ridiculous track and launch somebody down it. Potential energy turns into motion; friction turns some of that motion into heat; and bad track design turns your skater into an excellent demonstration of gravity.","main":{"label":"BUILD THE TRACK","source":"PHET • ENERGY SKATE PARK","url":"https://phet.colorado.edu/en/simulations/energy-skate-park","icon":"🛹","kind":"PHYSICS TOY","time":"10–20 MIN","mission":"Build the tallest survivable track you can. Then add friction and change the track until the skater can still finish it without getting stuck.","family":"phet","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"energy skate park potential kinetic energy short visual","source":"PHET / PHYSICS"},"more":{"label":"SMASH SOME OBJECTS","source":"PHET • COLLISION LAB","url":"https://phet.colorado.edu/en/simulations/collision-lab","icon":"💥"},"id":"1-2"},{"title":"Evolve a Lizard","hook":"Measure real-looking lizards, collect data, and reconstruct evolution from evidence instead of slogans.","brief":"Caribbean anole lizards repeatedly evolved similar body types on different islands. HHMI’s virtual lab turns that research story into data collection and analysis: legs, habitats, DNA, relatedness, and speciation. This one is more demanding than a game, but you are actually doing the reasoning scientists use.","main":{"label":"ENTER THE LIZARD LAB","source":"HHMI BIOINTERACTIVE • VIRTUAL LAB","url":"https://www.biointeractive.org/classroom-resources/lizard-evolution-virtual-lab","icon":"🦎","kind":"VIRTUAL LAB","time":"20–40 MIN","mission":"Start Module 1 and collect measurements. Before the lab tells you the answer, predict which body traits should matter most for lizards living on different surfaces.","family":"hhmi","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"anole lizard evolution islands short documentary","source":"HHMI BIOINTERACTIVE"},"more":{"label":"EVOLVE A POPULATION FAST","source":"PHET • NATURAL SELECTION","url":"https://phet.colorado.edu/en/simulations/natural-selection","icon":"🧬"},"id":"1-3"},{"title":"Matter Sandbox","hook":"Sand, lava, acid, electricity, strange matter, machines, heat, pressure, life—then see what reacts.","brief":"Sandboxels is a huge falling-particle playground where hundreds of materials have behaviors and reactions. It is closer to a toy box than a lesson, which is why it works: once you start heating, freezing, burning, mixing, electrifying, and smashing things, questions about materials appear naturally.","main":{"label":"MAKE A MESS","source":"SANDBOXELS • MATERIAL SIMULATOR","url":"https://neal.fun/sandboxels/","icon":"✦","kind":"SANDBOX","time":"15–∞ MIN","mission":"Make lava meet water. Build one electrical machine. Then invent a three-material experiment and predict the result before you run it.","family":"neal-fun","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"states of matter heat phase change short visual","source":"TED-ED / CHEMISTRY"},"more":{"label":"SEE THE PHASES CLEANLY","source":"PHET • STATES OF MATTER","url":"https://phet.colorado.edu/en/simulations/states-of-matter-basics","icon":"◫"},"id":"1-4"},{"title":"Zoom From a Coffee Bean to DNA","hook":"Keep zooming until ordinary objects become cells, molecules, atoms, and finally scales that language handles badly.","brief":"The University of Utah’s Cell Size and Scale interactive puts familiar objects, cells, organelles, molecules, and atoms on one continuous zoom. Scale is the subject: a red blood cell and a DNA molecule are both “tiny,” but they are tiny in radically different ways.","main":{"label":"ZOOM INTO THE CELL","source":"UNIVERSITY OF UTAH • CELL SIZE & SCALE","url":"https://learn.genetics.utah.edu/content/cells/scale/","icon":"🔬","kind":"SCALE EXPLORER","time":"8–15 MIN","mission":"Start at the largest object and zoom all the way down. Stop at a cell, a virus-sized object, and DNA, and estimate how many times smaller each step feels before reading the scale.","family":"utah-genetics","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"cell size scale DNA bacteria virus visual comparison","source":"BIOLOGY / MICROSCOPY"},"more":{"label":"ZOOM THROUGH ALL OF LIFE","source":"NEAL.FUN • SIZE OF LIFE","url":"https://neal.fun/size-of-life/","icon":"↔"},"id":"1-5"},{"title":"Turn a Virus Inside Out","hook":"Rotate viruses, slice them open, compare genomes, and discover that “virus” describes many different machines.","brief":"HHMI’s Virus Explorer contains interactive 3D models of multiple viruses, including influenza, HIV, Ebola, coronavirus, rabies, and Zika. You can rotate them, view cross-sections, compare structures, and follow replication cycles instead of treating every virus as the same spiky ball.","main":{"label":"DISSECT THE VIRUSES","source":"HHMI BIOINTERACTIVE • VIRUS EXPLORER","url":"https://www.biointeractive.org/classroom-resources/virus-explorer","icon":"🦠","kind":"3D BIOLOGY","time":"15–25 MIN","mission":"Compare three viruses. Find one structural feature they share and one major difference, then choose the virus whose shape least matches your mental picture of a virus.","family":"hhmi-virus","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"virus structure replication 3D short animation","source":"HHMI BIOINTERACTIVE"},"more":{"label":"BUILD A CELL-SCALE MENTAL MAP","source":"UNIVERSITY OF UTAH • CELL SCALE","url":"https://learn.genetics.utah.edu/content/cells/scale/","icon":"🔬"},"id":"1-6"},{"title":"Build a Molecule","hook":"Atoms stop being colored balls in a picture when you have to decide what bonds to connect and whether the shape makes sense.","brief":"MolView’s molecule builder lets you place atoms and bonds, then inspect the resulting structure in 3D. It is a real molecular visualization tool, so simple molecules are approachable while the rabbit hole can continue into increasingly complicated structures.","main":{"label":"BUILD IT IN 3D","source":"MOLVIEW • MOLECULE BUILDER","url":"https://builder.molview.org/","icon":"⬡","kind":"MOLECULE TOOL","time":"12–25 MIN","mission":"Build water, carbon dioxide, and one molecule you invent. Rotate each in 3D and notice which drawings look flat on paper but are not actually flat in space.","family":"molview","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"molecular geometry bonds VSEPR visual explanation","source":"CHEMISTRY / MOLECULES"},"more":{"label":"PLAY WITH MOLECULE SHAPES","source":"PHET • MOLECULE SHAPES","url":"https://phet.colorado.edu/en/simulations/molecule-shapes","icon":"⬡"},"id":"1-7"},{"title":"Bend a Laser","hook":"Change the material, angle, wavelength, and watch light change direction in real time.","brief":"Refraction is usually introduced with a diagram and a rule. PhET’s Bending Light turns the diagram into a controllable experiment: lasers cross boundaries, wavefronts change, angles can be measured, and different materials alter what the beam does.","main":{"label":"BEND THE BEAM","source":"PHET • BENDING LIGHT","url":"https://phet.colorado.edu/en/simulations/bending-light","icon":"↗","kind":"OPTICS SIMULATION","time":"10–20 MIN","mission":"Send light from air into glass, then water. Find an angle that produces total internal reflection and change the wavelength to see what does—or does not—move.","family":"phet-optics","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"refraction total internal reflection short visual","source":"PHYSICS / OPTICS"},"more":{"label":"FOOL YOUR EYES NEXT","source":"MICHAEL BACH • OPTICAL ILLUSIONS","url":"https://michaelbach.de/ot/","icon":"◉"},"id":"1-8"},{"title":"Break an Orbit","hook":"Gravity is predictable enough to land on the Moon and chaotic enough to punish a careless shove.","brief":"PhET’s Gravity and Orbits lets you alter masses, velocities, distances, and the visibility of forces while planets and satellites move. It turns “gravity pulls things together” into the harder question: what sideways motion keeps something falling forever without hitting?","main":{"label":"DESTROY A STABLE ORBIT","source":"PHET • GRAVITY AND ORBITS","url":"https://phet.colorado.edu/en/simulations/gravity-and-orbits","icon":"◌","kind":"ORBIT SIMULATION","time":"10–20 MIN","mission":"Run a stable orbit, then change only one thing—mass, velocity, or distance—until the orbit crashes or escapes. Try to repair it with the smallest adjustment possible.","family":"phet-space","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"why orbit is falling sideways gravity visual explanation","source":"SPACE / PHYSICS"},"more":{"label":"SEE REAL ORBITS","source":"NASA EYES • SOLAR SYSTEM","url":"https://eyes.nasa.gov/apps/orrery/?source=solar-system","icon":"🚀"},"id":"1-9"},{"title":"Make a Gene Turn On","hook":"DNA does not simply sit there being a blueprint. Molecules have to find it, bind to it, copy it, and turn the message into protein.","brief":"Gene expression is the chain of molecular events that turns information in DNA into working proteins. PhET's simulation lets you move the machinery yourself and alter concentrations and interactions, so regulation becomes something that can succeed, stall, speed up, or fail instead of a diagram full of arrows.","main":{"label":"RUN THE GENE MACHINERY","source":"PHET • GENE EXPRESSION ESSENTIALS","url":"https://phet.colorado.edu/en/simulations/gene-expression-essentials","icon":"🧬","kind":"MOLECULAR SIMULATION","time":"12–25 MIN","mission":"Make the cell produce a protein, then change one molecular condition at a time. Before each change, predict whether protein production should rise, fall, or stop.","family":"phet-gene-expression","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"gene expression transcription translation short visual animation","source":"PHET / MOLECULAR BIOLOGY"},"more":{"label":"TRY THE SIMPLER VERSION","source":"PHET • GENE EXPRESSION BASICS","url":"https://phet.colorado.edu/en/simulations/gene-expression-basics","icon":"🧬"},"id":"1-10"}]},{"name":"Math","label":"MATH","glyph":"∑","color":"#f04464","tagline":"Patterns become much more convincing when you can drag them around.","topics":[{"title":"Monty Hall Attacks Your Intuition","hook":"Three doors. One goat. One prize. Switching feels pointless—and is not.","brief":"The Monty Hall problem is famous because a simple probability question makes smart people argue with the mathematics. A simulator is better than an explanation here: play repeatedly, keep score, and let the percentages bully your intuition into submission.","main":{"label":"PLAY THE DOORS","source":"MONTYHALL.IO • LIVE SIMULATOR","url":"https://montyhall.io/","icon":"🚪","kind":"GAME / EXPERIMENT","time":"8–15 MIN","mission":"Play ten rounds always staying. Then ten rounds always switching. Compare the win rates before reading any explanation.","family":"montyhall","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Monty Hall problem visual explanation","source":"NUMBERPHILE / PROBABILITY"},"more":{"label":"PLAY WITH MORE PROBABILITY","source":"SEEING THEORY • BASIC PROBABILITY","url":"https://seeing-theory.brown.edu/basic-probability/index.html","icon":"🎲"},"id":"2-0"},{"title":"Probability You Can Drag","hook":"Coins, dice, outcomes, and randomness become objects instead of formulas.","brief":"Seeing Theory was built around the idea that probability and statistics should be seen and manipulated. Instead of starting with notation, you change experiments and watch distributions emerge. It is especially good for discovering how random individual events create predictable larger patterns.","main":{"label":"MESS WITH RANDOMNESS","source":"SEEING THEORY • INTERACTIVE PROBABILITY","url":"https://seeing-theory.brown.edu/basic-probability/index.html","icon":"🎲","kind":"INTERACTIVE MATH","time":"10–20 MIN","mission":"Bias the coin. Change the experiment. Try to make a surprising short run of outcomes, then increase the number of trials and watch what happens.","family":"seeing-theory","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"probability law of large numbers visual explanation","source":"3BLUE1BROWN / MATH"},"more":{"label":"MAKE DISTRIBUTIONS MOVE","source":"SEEING THEORY • DISTRIBUTIONS","url":"https://seeing-theory.brown.edu/probability-distributions/index.html","icon":"▥"},"id":"2-1"},{"title":"Fractals: Zoom Forever","hook":"A simple rule repeats until a fern, coastline, snowflake, or impossible monster appears.","brief":"Fractals use repeated structure across different scales. Mathigon’s interactive course lets you generate and manipulate patterns rather than staring at a finished Mandelbrot picture. The useful idea is self-similarity: the small piece keeps echoing the shape of the whole.","main":{"label":"ENTER THE FRACTAL","source":"MATHIGON • INTERACTIVE FRACTALS","url":"https://mathigon.org/course/fractals/introduction","icon":"✣","kind":"INTERACTIVE MATH","time":"12–25 MIN","mission":"Build or explore at least three fractals. Find one where zooming in reveals a smaller version of the larger pattern and explain the rule in plain language.","family":"mathigon","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"fractals Mandelbrot visual explanation short","source":"NUMBERPHILE / MATH"},"more":{"label":"OPEN THE MATH PLAYGROUND","source":"MATHIGON • POLYPAD","url":"https://mathigon.org/polypad","icon":"◇"},"id":"2-2"},{"title":"Break an Election","hook":"Move voters by hand and watch different voting systems elect different winners.","brief":"There is no single mathematically obvious way to turn millions of preferences into one winner. This explorable lets you drag voters and candidates around and compare voting rules directly. Tiny changes can flip outcomes, which turns an abstract political argument into geometry.","main":{"label":"MOVE THE VOTERS","source":"NCASE • BALLOT SIMULATOR","url":"https://ncase.me/ballot/","icon":"✓","kind":"SIMULATION","time":"15–30 MIN","mission":"Create a situation where two voting systems pick different winners. Then move one candidate slightly and see how many systems change their minds.","family":"ncase","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"voting systems ranked choice approval plurality animation","source":"3BLUE1BROWN / VOTING MATH"},"more":{"label":"OPEN THE ELECTION SANDBOX","source":"NCASE • BALLOT SANDBOX","url":"https://ncase.me/ballot/sandbox/","icon":"◇"},"id":"2-3"},{"title":"Every Flat Map Lies","hook":"Greenland is not Africa-sized. Every world map chooses which truth to damage.","brief":"A sphere cannot be flattened without distortion. The interesting question is not whether a map lies, but what it sacrifices: area, shape, distance, direction, or continuity. RealSize.World lets you switch projections and move real country outlines around while the distortions happen live.","main":{"label":"BEND THE WORLD","source":"REALSIZE.WORLD • PROJECTION LAB","url":"https://realsize.world/en/projections/map","icon":"🌐","kind":"MAP LAB","time":"10–20 MIN","mission":"Drag Greenland toward the equator. Then switch away from Mercator and turn on a distortion layer. Find one projection you would use for navigation and one you would use for comparing country size.","family":"realsize","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"map projections Mercator distortion visual explanation","source":"MAP MEN / GEOGRAPHY"},"more":{"label":"COMPARE TWO MAPS","source":"REALSIZE.WORLD • PROJECTION COMPARATOR","url":"https://realsize.world/en/projections/compare?a=mercator&b=equal-earth","icon":"↔"},"id":"2-4"},{"title":"Draw a Formula and Watch It Exist","hook":"Type an equation, drag a slider, and make algebra move.","brief":"Desmos turns equations into immediate pictures. A coefficient is no longer just a number on a worksheet when you can attach it to a slider and watch a line, parabola, wave, or curve bend while your finger moves.","main":{"label":"MAKE EQUATIONS MOVE","source":"DESMOS • GRAPHING CALCULATOR","url":"https://www.desmos.com/calculator","icon":"∿","kind":"MATH TOOL","time":"12–∞ MIN","mission":"Graph y=x², then replace one number with a slider and move it. Build a second curve that intersects the first and try to move the intersection exactly where you want it.","family":"desmos","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Desmos graphing calculator transformations visual math","source":"DESMOS / MATH"},"more":{"label":"BUILD GEOMETRY INSTEAD","source":"GEOGEBRA • GEOMETRY","url":"https://www.geogebra.org/geometry","icon":"△"},"id":"2-5"},{"title":"Construct Geometry That Refuses to Break","hook":"Drag a point after you build the figure. If your construction was real, the relationship survives.","brief":"GeoGebra Geometry behaves like a compass, ruler, coordinate plane, and geometry lab fused together. The powerful part is dragging: a properly constructed perpendicular bisector or triangle relation keeps working even when the original points move.","main":{"label":"BUILD A LIVING DIAGRAM","source":"GEOGEBRA • GEOMETRY","url":"https://www.geogebra.org/geometry","icon":"△","kind":"GEOMETRY TOOL","time":"15–30 MIN","mission":"Construct a triangle, its perpendicular bisectors, and their intersection. Drag every corner wildly and see whether your special point continues to behave correctly.","family":"geogebra","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"dynamic geometry circumcenter triangle visual explanation","source":"GEOMETRY / MATH"},"more":{"label":"GRAPH THE NUMBERS","source":"DESMOS • GRAPHING CALCULATOR","url":"https://www.desmos.com/calculator","icon":"∿"},"id":"2-6"},{"title":"Factor Falling Blocks","hook":"Tetris gets invaded by prime factors.","brief":"Mathigon’s Factris turns factorization into a falling-block game. Rectangles arrive with dimensions you can refactor, and the goal is to split and combine them intelligently instead of merely reciting multiplication facts.","main":{"label":"PLAY FACTRIS","source":"MATHIGON • FACTRIS","url":"https://mathigon.org/factris","icon":"▦","kind":"MATH GAME","time":"10–25 MIN","mission":"Play until the board gets dangerous. Before every split, say the factor pair you want, and look for one move where a different factorization would have saved more space.","family":"mathigon-factris","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"prime factors multiplication visual explanation","source":"NUMBERPHILE / MATH"},"more":{"label":"OPEN THE MATH TOY BOX","source":"MATHIGON • POLYPAD","url":"https://mathigon.org/polypad","icon":"◇"},"id":"2-7"},{"title":"Build a Tessellation","hook":"Make shapes tile a plane, then try to break the pattern without leaving gaps.","brief":"Polypad is Mathigon’s browser toolbox of tiles, number bars, polygons, dice, fractions, tangrams, and other manipulatives. For geometry it becomes a digital workbench where symmetry and tessellation are things you build rather than definitions you copy.","main":{"label":"TILE THE PLANE","source":"MATHIGON • POLYPAD","url":"https://mathigon.org/polypad","icon":"◇","kind":"MATH PLAYGROUND","time":"15–∞ MIN","mission":"Use one polygon to cover the plane with no gaps if you can. Then combine two different shapes and make a repeating pattern with at least one line or rotational symmetry.","family":"mathigon-polypad","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"tessellations symmetry polygons visual math","source":"MATHIGON / GEOMETRY"},"more":{"label":"ZOOM INTO FRACTALS","source":"MATHIGON • FRACTALS","url":"https://mathigon.org/course/fractals/introduction","icon":"✣"},"id":"2-8"},{"title":"Update Your Belief With Evidence","hook":"A probability starts somewhere. New evidence pushes it around.","brief":"Seeing Theory’s Bayesian Inference chapter visualizes how prior beliefs and new evidence combine. The point is not memorizing Bayes’ theorem; it is watching a probability change when evidence is strong, weak, common, or rare.","main":{"label":"MOVE THE PROBABILITIES","source":"SEEING THEORY • BAYESIAN INFERENCE","url":"https://seeing-theory.brown.edu/bayesian-inference/index.html","icon":"🎲","kind":"INTERACTIVE PROBABILITY","time":"15–25 MIN","mission":"Work through at least two interactives. Before revealing an updated probability, decide whether the evidence should move your belief a little or a lot—and why.","family":"seeing-theory-bayes","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Bayes theorem intuitive visual explanation","source":"3BLUE1BROWN / PROBABILITY"},"more":{"label":"GO BACK TO BASIC RANDOMNESS","source":"SEEING THEORY • BASIC PROBABILITY","url":"https://seeing-theory.brown.edu/basic-probability/index.html","icon":"🎲"},"id":"2-9"},{"title":"Cross Every Bridge Exactly Once","hook":"A city walk invented an entire branch of mathematics when somebody finally stopped caring about the shape of the streets.","brief":"The old Königsberg bridge puzzle asks whether one route can cross every bridge exactly once. Euler's solution helped create graph theory: replace complicated geography with dots and connections, then reason about the network itself. Mathigon lets you attack several bridge maps by drawing routes directly on them.","main":{"label":"SOLVE THE BRIDGE PUZZLES","source":"MATHIGON • KÖNIGSBERG BRIDGES","url":"https://mathigon.org/step/talks/bridges","icon":"⌁","kind":"DRAWING PUZZLE","time":"10–20 MIN","mission":"Try every map before using Skip. When one seems impossible, stop tracing roads and count how many bridges touch each land area. Look for the pattern separating solvable maps from impossible ones.","family":"mathigon-bridges","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Bridges of Konigsberg Euler graph theory visual explanation","source":"MATHIGON / GRAPH THEORY"},"more":{"label":"ENTER GRAPH THEORY","source":"MATHIGON • GRAPHS & NETWORKS","url":"https://mathigon.org/course/graph-theory/introduction","icon":"●"},"id":"2-10"}]},{"name":"Stories","label":"STORIES","glyph":"A","color":"#915cff","tagline":"Stories earn a spin when the original text, manuscript, map, or structure becomes something you can explore.","topics":[{"title":"Beowulf: Handle the Manuscript","hook":"Monsters, feasting halls, loyalty, vengeance—and the actual thousand-year-old manuscript.","brief":"Beowulf survives in a single medieval manuscript. Electronic Beowulf lets you place the Old English text beside manuscript images and inspect what copying, damage, erasure, and modern imaging reveal. The point is not to read the whole poem today; it is to discover that a famous story is also a fragile physical object.","main":{"label":"HANDLE BEOWULF","source":"ELECTRONIC BEOWULF • FIFTH EDITION","url":"https://ebeowulf.uky.edu/eBeowulf/CD/main.html","icon":"▤","kind":"DIGITAL MANUSCRIPT","time":"12–25 MIN","mission":"Open the manuscript beside the edition. Find one folio where you can clearly see the handwritten Old English, zoom in, and compare it with the readable text.","family":"ebeowulf","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Beowulf story monsters Grendel short animation","source":"OVERLY SARCASTIC PRODUCTIONS"},"more":{"label":"READ THE TRANSLATION","source":"PROJECT GUTENBERG • DIRECT EDITION","url":"https://www.gutenberg.org/files/16328/16328-h/16328-h.htm","icon":"↗"},"id":"3-0"},{"title":"Frankenstein Before It Was Frankenstein","hook":"Mary Shelley’s monster began as handwriting, crossings-out, additions, and second thoughts.","brief":"The surviving Frankenstein notebooks let you see a famous novel while it was still being made. Draft pages are messy evidence of decisions: sentences change, words disappear, and ideas get rewritten. That makes writing look less like inspiration arriving fully formed and more like construction.","main":{"label":"OPEN THE DRAFT","source":"SHELLEY-GODWIN ARCHIVE • NOTEBOOK A","url":"https://shelleygodwinarchive.org/contents/frankenstein_notebook_a/","icon":"✎","kind":"MANUSCRIPT EXPLORER","time":"10–20 MIN","mission":"Open several manuscript leaves and hunt for revisions. Find one place where Shelley crossed something out or added something later, then ask why she may have changed it.","family":"shelley-godwin","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Frankenstein Mary Shelley short animation analysis","source":"TED-ED / LITERATURE"},"more":{"label":"OPEN NOTEBOOK B","source":"SHELLEY-GODWIN ARCHIVE","url":"https://shelleygodwinarchive.org/contents/frankenstein_notebook_b/","icon":"▤"},"id":"3-1"},{"title":"Map Dante's Hell","hook":"Nine circles are easier to understand when you can actually move through the architecture.","brief":"Dante built Inferno as an enormous moral machine: different sins occupy different regions, punishments mirror choices, and historical figures are placed inside a carefully structured universe. This interactive map makes that architecture visible so the poem stops being a pile of strange names.","main":{"label":"DESCEND THE INFERNO","source":"ALPACA PROJECTS • INTERACTIVE TOPOGRAPHY","url":"https://www.alpacaprojects.com/inferno/en/","icon":"↓","kind":"STORY MAP","time":"12–25 MIN","mission":"Travel down at least five levels. Pick the punishment that seems most deliberately symbolic and explain what behavior Dante was trying to condemn.","family":"inferno-map","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Dante Inferno circles of hell short animation","source":"TED-ED / LITERATURE"},"more":{"label":"READ A FEW CANTOS","source":"PROJECT GUTENBERG • INFERNO","url":"https://www.gutenberg.org/ebooks/1001","icon":"▤"},"id":"3-2"},{"title":"Dracula as a Trail of Evidence","hook":"The novel is made of diaries, letters, telegrams, newspaper clippings—and a monster hiding between them.","brief":"Dracula is an epistolary novel, which means the story is assembled from documents supposedly created by the characters. OnDracula turns that structure into something explorable with a timeline, map, narrators, and entries. You can follow the hunt like a case file instead of reading one uninterrupted block.","main":{"label":"FOLLOW THE CASE FILE","source":"ONDRACULA • DIGITAL EPISTOLARY READER","url":"https://ondracula.com/","icon":"🦇","kind":"STORY EXPLORER","time":"12–25 MIN","mission":"Use the map or timeline first. Follow one character through several entries and notice what that person knows—and what the reader knows that they do not.","family":"ondracula","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Dracula Bram Stoker story short analysis animation","source":"TED-ED / GOTHIC LITERATURE"},"more":{"label":"OPEN THE ORIGINAL NOVEL","source":"PROJECT GUTENBERG • DRACULA","url":"https://www.gutenberg.org/ebooks/45839","icon":"▤"},"id":"3-3"},{"title":"The Odyssey as a Machine","hook":"Gods, monsters, flashbacks, homecoming, revenge: turn the epic into a visible network.","brief":"The Odyssey is deliberately told out of chronological order. This interactive concept map shows characters, places, episodes, themes, and the difference between when events happened and when Homer tells you about them. It is a good way to see how an enormous story is engineered.","main":{"label":"OPEN THE STORY MAP","source":"KNOGRA • ODYSSEY CONCEPT MAP","url":"https://knogra.io/library/the-odyssey/","icon":"⌘","kind":"CONCEPT MAP","time":"15–30 MIN","mission":"Follow Odysseus through three famous episodes, then switch to the story structure and find one event that Homer tells out of chronological order.","family":"knogra","device":"DESKTOP / LARGE SCREEN","grade":"GOLD"},"watch":{"query":"Odyssey Homer Cyclops Circe short animation","source":"OVERLY SARCASTIC PRODUCTIONS"},"more":{"label":"READ THE ADVENTURE","source":"PROJECT GUTENBERG • THE ODYSSEY","url":"https://www.gutenberg.org/ebooks/1727","icon":"▤"},"id":"3-4"},{"title":"Flip Through Shakespeare’s First Folio","hook":"Macbeth, The Tempest, Julius Caesar, and other plays survive partly because this enormous book was printed in 1623.","brief":"The Folger Shakespeare Library’s bookreader lets you turn and zoom the actual pages of a First Folio copy. It makes Shakespeare physical again: strange spelling, dense type, page layout, and printing artifacts sit beside plays that are usually encountered as clean modern text.","main":{"label":"OPEN THE FIRST FOLIO","source":"FOLGER SHAKESPEARE LIBRARY • BOOKREADER","url":"https://www.folger.edu/explore/shakespeare-in-print/first-folio/bookreader-68/","icon":"▤","kind":"DIGITAL RARE BOOK","time":"12–25 MIN","mission":"Use the table of contents to find Macbeth or The Tempest. Zoom into a page and find three spellings or typographic choices that would never appear in a modern edition.","family":"folger","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"Shakespeare First Folio why it matters short","source":"FOLGER / SHAKESPEARE"},"more":{"label":"READ THE FOLGER TEXTS","source":"FOLGER SHAKESPEARE LIBRARY","url":"https://www.folger.edu/explore/shakespeares-works/","icon":"A"},"id":"3-5"},{"title":"Make a Story With Doors","hook":"Instead of writing “then this happened,” make the reader choose which thing happens next.","brief":"Twine is a real browser tool for nonlinear interactive fiction. Each passage can link to other passages, so a story becomes a map of choices, loops, consequences, secrets, and dead ends rather than a single straight line.","main":{"label":"BUILD A CHOOSE-YOUR-OWN STORY","source":"TWINE • BROWSER EDITOR","url":"https://play.twinery.org/","icon":"⌘","kind":"STORY MAKER","time":"20–∞ MIN","mission":"Make at least three passages and one real choice. Create two different routes that eventually rejoin, play the story yourself, then change one choice so it has a consequence.","family":"twine","device":"DESKTOP PREFERRED • EXPORT WHEN DONE","grade":"GOLD"},"watch":{"query":"Twine interactive fiction beginner tutorial short","source":"TWINE / INTERACTIVE FICTION"},"more":{"label":"PLAY A CLASSIC TEXT ADVENTURE","source":"ZORK I • BROWSER EDITION","url":"https://gtcode.com/zork/","icon":">"},"id":"3-6"},{"title":"Enter Zork","hook":"No map. No buttons. Just a parser, a dark underground empire, and whatever commands you can think to type.","brief":"Zork helped define interactive fiction: the world exists through description and language, and progress depends on asking the parser to do things. It turns reading into exploration because every sentence can suggest an action, object, direction, or puzzle.","main":{"label":"OPEN THE MAILBOX","source":"ZORK I • PLAYABLE BROWSER EDITION","url":"https://gtcode.com/zork/","icon":">","kind":"INTERACTIVE FICTION","time":"15–∞ MIN","mission":"Open the mailbox, get inside the house, and survive long enough to find a light source. Use LOOK and INVENTORY whenever you feel lost instead of immediately seeking a walkthrough.","family":"zork","device":"KEYBOARD BEST","grade":"GOLD"},"watch":{"query":"Zork interactive fiction history parser games short","source":"GAME HISTORY / INTERACTIVE FICTION"},"more":{"label":"MAKE YOUR OWN TEXT ADVENTURE","source":"TWINE • BROWSER EDITOR","url":"https://play.twinery.org/","icon":"⌘"},"id":"3-7"},{"title":"Turn Art Into a Poem","hook":"Pick an artwork, choose a poetic form, add an idea, and see how words reinterpret an image.","brief":"Poem Postcards is an Arts & Culture experiment that generates a poem from an artwork, poetic form, and optional prompt. The interesting part is comparison: the same image can become a sonnet, haiku, limerick, or something stranger depending on the constraints you choose.","main":{"label":"MAKE A POEM POSTCARD","source":"GOOGLE ARTS & CULTURE • POEM POSTCARDS","url":"https://artsandculture.google.com/experiment/ZgG5_uTbBgTpIQ","icon":"✎","kind":"STORY + ART TOY","time":"8–20 MIN","mission":"Choose one artwork and generate two different poetic forms from it. Decide which details the poems noticed, which they invented, and which version feels more faithful to the image.","family":"google-arts-poem","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how haiku sonnet limerick forms work short","source":"POETRY / LITERATURE"},"more":{"label":"MAKE A BRANCHING STORY NEXT","source":"TWINE • BROWSER EDITOR","url":"https://play.twinery.org/","icon":"⌘"},"id":"3-8"},{"title":"Stand in Shakespeare’s Theater","hook":"A play changes when the audience is wrapped around the actors instead of hidden behind a screen.","brief":"Shakespeare’s Globe has created digital ways to inspect the theater space, and the building itself explains part of how the plays work: daylight, open air, a thrust stage, galleries, and an audience close enough to be addressed directly.","main":{"label":"EXPLORE THE GLOBE","source":"SHAKESPEARE’S GLOBE • DIGITAL EXPERIENCE","url":"https://www.shakespearesglobe.com/globe360/","icon":"◌","kind":"VIRTUAL THEATER","time":"10–20 MIN","mission":"Explore the stage and audience areas. Pick one Shakespeare scene you know and decide where an actor could look, enter, hide, or address the crowd differently in this space.","family":"globe360","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Shakespeare Globe theatre stage audience short tour","source":"SHAKESPEARE’S GLOBE"},"more":{"label":"FLIP THROUGH THE FIRST FOLIO","source":"FOLGER • BOOKREADER","url":"https://www.folger.edu/explore/shakespeare-in-print/first-folio/bookreader-68/","icon":"▤"},"id":"3-9"},{"title":"Write a Story That Fights Back","hook":"Write one paragraph, offer two choices, and suddenly your story has become a tiny game.","brief":"Ink is a real narrative scripting language used to build branching games and interactive fiction. InkPad puts the editor and playable story beside each other in the browser, so every choice, variable, and branch can be tested immediately. This is writing, programming, and game design occupying the same page.","main":{"label":"BUILD A BRANCHING STORY","source":"INKPAD • BROWSER INK EDITOR","url":"https://shadowbox.games/inkpad","icon":"✎","kind":"STORY MAKER","time":"20–∞ MIN","mission":"Start from a sample or blank file. Create one choice that splits into two paths, one variable that remembers something, and at least two different endings. Play both routes yourself.","family":"inkpad","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"ink interactive fiction branching narrative tutorial short","source":"INKLE / INTERACTIVE FICTION"},"more":{"label":"LEARN THE LANGUAGE","source":"INKLE • OFFICIAL INK GUIDE","url":"https://www.inklestudios.com/ink/","icon":"▤"},"id":"3-10"}]},{"name":"Philosophy","label":"PHILOSOPHY","glyph":"◇","color":"#53a8ff","tagline":"Philosophy becomes much less polite when the question makes you press a button.","topics":[{"title":"Absurd Trolley Problems","hook":"Ethics gives you a lever. Then it keeps making the lever worse.","brief":"The trolley problem asks whether it can be right to harm one person in order to save several others. Neal.fun turns the thought experiment into an escalating game, forcing you to notice which facts actually change your judgment and which ones only feel emotionally different.","main":{"label":"PULL THE LEVER","source":"NEAL.FUN • ABSURD TROLLEY PROBLEMS","url":"https://neal.fun/absurd-trolley-problems/","icon":"🚋","kind":"ETHICS GAME","time":"10–20 MIN","mission":"Play at least ten scenarios. Find two where your answer changes and identify the exact detail that made you switch sides.","family":"neal-fun","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"trolley problem ethics philosophy short animation","source":"TED-ED / PHILOSOPHY"},"more":{"label":"TRY MORE ETHICAL TRAPS","source":"PHILOSOPHY EXPERIMENTS • GAMES","url":"https://www.philosophyexperiments.com/games","icon":"◇"},"id":"4-0"},{"title":"Ship of Theseus","hook":"If every part of a thing is replaced, when—if ever—does it stop being the same thing?","brief":"The Ship of Theseus looks like a puzzle about a boat, but it attacks a much bigger question: what makes anything remain itself through change? The interactive walks you through replacement, rebuilding, copying, and competing claims to identity without giving you an easy escape.","main":{"label":"REBUILD THE SHIP","source":"BIBBY PHILOSOPHY LAB • INTERACTIVE","url":"https://www.bibbyphilosophy.net/resources/games/ship-of-theseus/","icon":"⛵","kind":"THOUGHT GAME","time":"10–20 MIN","mission":"Make a ruling at every stage. By the end, write one sentence explaining what you think identity depends on: material, continuity, function, history, or something else.","family":"bibby","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Ship of Theseus philosophy identity short animation","source":"TED-ED / PHILOSOPHY"},"more":{"label":"OPEN THE PHILOSOPHY ARCADE","source":"BIBBY PHILOSOPHY LAB • GAMES","url":"https://bibbyphilosophy.net/resources/games/","icon":"◇"},"id":"4-1"},{"title":"Can You Survive Yourself?","hook":"How much of you can change before 'you' are gone?","brief":"Personal identity gets strange once memory, bodies, brains, copies, and gradual replacement enter the picture. Staying Alive is an interactive philosophical test: make choices through a sequence of scenarios and discover whether your own rules remain consistent.","main":{"label":"TRY TO STAY ALIVE","source":"PHILOSOPHY EXPERIMENTS • PERSONAL IDENTITY","url":"https://www.philosophyexperiments.com/stayingalive","icon":"◎","kind":"THOUGHT EXPERIMENT","time":"10–20 MIN","mission":"Answer every scenario quickly the first time. At the end, go back to the case that bothered you most and decide whether your rule needs changing.","family":"philosophy-experiments","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"personal identity philosophy teleportation thought experiment","source":"WIRELESS PHILOSOPHY"},"more":{"label":"TEST YOUR WHOLE WORLDVIEW","source":"PHILOSOPHY EXPERIMENTS • HEALTH TEST","url":"https://www.philosophyexperiments.com/health","icon":"◇"},"id":"4-2"},{"title":"Battleground God","hook":"Can a set of beliefs survive when the same logical rules are applied to all of them?","brief":"This interactive does not try to tell you what to believe. It asks questions, compares your answers, and looks for tensions or contradictions between them. That makes it useful as a logic game: the challenge is whether your reasons fit together, not whether they match somebody else’s.","main":{"label":"ENTER THE BATTLEGROUND","source":"PHILOSOPHY EXPERIMENTS • BELIEF LOGIC","url":"https://www.philosophyexperiments.com/god","icon":"☼","kind":"LOGIC TEST","time":"10–20 MIN","mission":"Answer without trying to 'win.' When the site challenges a pair of answers, decide whether the contradiction is real or whether an important distinction is missing.","family":"philosophy-experiments","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"arguments philosophy religion logic introduction","source":"WIRELESS PHILOSOPHY"},"more":{"label":"CHECK YOUR PHILOSOPHICAL HEALTH","source":"PHILOSOPHY EXPERIMENTS","url":"https://www.philosophyexperiments.com/health","icon":"◇"},"id":"4-3"},{"title":"The Wason Logic Trap","hook":"Four cards can expose how badly human intuition handles a simple rule.","brief":"The Wason selection task is a classic test of conditional reasoning. It looks embarrassingly easy until people choose the wrong cards. The interesting part is not your score; it is discovering exactly what evidence can prove a rule false and why confirming examples are so tempting.","main":{"label":"FLIP THE RIGHT CARDS","source":"PHILOSOPHY EXPERIMENTS • WASON TEST","url":"https://www.philosophyexperiments.com/wason","icon":"▱","kind":"LOGIC PUZZLE","time":"5–10 MIN","mission":"Choose your cards before reading any explanation. If you miss it, reconstruct what kind of hidden card would actually disprove the rule.","family":"philosophy-experiments","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Wason selection task confirmation bias logic short","source":"VERITASIUM / LOGIC"},"more":{"label":"VALID OR INVALID?","source":"PHILOSOPHY EXPERIMENTS • LOGIC GAME","url":"https://www.philosophyexperiments.com/validorinvalid","icon":"✓"},"id":"4-4"},{"title":"Program a Self-Driving Car’s Morals","hook":"The brakes fail. Every option is bad. Which rule should the machine obey?","brief":"MIT’s Moral Machine presents unavoidable-crash dilemmas involving autonomous vehicles and lets you compare your judgments with patterns from other people. The scenarios are simplified on purpose: they expose which features—age, number, lawfulness, action versus inaction—you treat as morally relevant.","main":{"label":"MAKE THE IMPOSSIBLE CHOICES","source":"MIT • MORAL MACHINE","url":"https://www.moralmachine.net/hl/en","icon":"🚗","kind":"ETHICS GAME","time":"10–20 MIN","mission":"Complete a full judgment set, then inspect your result. Find one preference the system inferred that surprises you and decide whether the scenarios actually justify that conclusion.","family":"moral-machine","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"self driving car ethics Moral Machine dilemma short","source":"MIT / ETHICS"},"more":{"label":"TRY CLASSIC MORAL DILEMMAS","source":"PHILOSOPHY EXPERIMENTS • MORALITY PLAY","url":"https://www.philosophyexperiments.com/moralityplay","icon":"◇"},"id":"4-5"},{"title":"Find Your Moral Pattern","hook":"Nineteen scenarios probe whether your moral rules stay stable when the details change.","brief":"Morality Play asks for judgments across a sequence of ethical cases and then analyzes the pattern in your answers. There is no answer key; the interesting result is whether you apply the same principle consistently when the people, stakes, and emotional framing change.","main":{"label":"PLAY MORALITY","source":"PHILOSOPHY EXPERIMENTS • MORALITY PLAY","url":"https://www.philosophyexperiments.com/moralityplay","icon":"◇","kind":"ETHICS EXPERIMENT","time":"12–25 MIN","mission":"Answer quickly enough to preserve your first reaction. When the analysis appears, choose one pair of cases that seems inconsistent and see whether you can defend both answers.","family":"philosophy-morality","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"moral philosophy consequentialism deontology virtue ethics short","source":"CRASH COURSE PHILOSOPHY"},"more":{"label":"LET A CAR FORCE THE QUESTION","source":"MIT • MORAL MACHINE","url":"https://www.moralmachine.net/hl/en","icon":"🚗"},"id":"4-6"},{"title":"The Million-Dollar Prediction Trap","hook":"One box or two boxes? A predictor supposedly already knows what you will decide.","brief":"Newcomb’s paradox pits two plausible ideas against each other: choose the action that causes the best outcome, or choose the action that is evidence of the best prediction. The interactive makes you commit before unpacking why philosophers and decision theorists disagree.","main":{"label":"PLAY THE MILLION-DOLLAR PUZZLE","source":"PHILOSOPHY EXPERIMENTS • NEWCOMB","url":"https://www.philosophyexperiments.com/newcomb","icon":"$","kind":"DECISION PARADOX","time":"8–15 MIN","mission":"Choose before reading outside explanations. After the result, argue for the opposite choice as strongly as you can and identify what assumption the two arguments disagree about.","family":"philosophy-newcomb","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Newcomb paradox decision theory short explanation","source":"PHILOSOPHY / DECISION THEORY"},"more":{"label":"TEST ANOTHER LOGIC TRAP","source":"PHILOSOPHY EXPERIMENTS • MARY","url":"https://www.philosophyexperiments.com/mary","icon":"◇"},"id":"4-7"},{"title":"Argue With God About Goodness","hook":"Is something good because God commands it, or does God command it because it is good?","brief":"The Euthyphro dilemma is an ancient question with a very modern interface here: an argumentative conversational exercise pushes you through consequences of different answers. The goal is not religious persuasion; it is learning how one distinction can open several new philosophical problems.","main":{"label":"ENTER THE EUTHYPHRO DILEMMA","source":"PHILOSOPHY EXPERIMENTS • TALKING WITH GOD","url":"https://www.philosophyexperiments.com/euthyphro","icon":"☼","kind":"THOUGHT EXPERIMENT","time":"10–20 MIN","mission":"Pick the answer that feels strongest to you and follow its consequences. When the program pushes back, identify whether your position changed or whether you found a missing distinction.","family":"philosophy-euthyphro","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Euthyphro dilemma Plato morality religion short","source":"WIRELESS PHILOSOPHY"},"more":{"label":"CHECK YOUR BELIEF SYSTEM","source":"PHILOSOPHY EXPERIMENTS • BATTLGROUND GOD","url":"https://www.philosophyexperiments.com/god","icon":"◇"},"id":"4-8"},{"title":"Fall for the Conjunction Trap","hook":"A detailed story feels more likely than a boring one—even when basic probability says it cannot be.","brief":"What Does Mary Do? is a fast version of the conjunction fallacy made famous by Tversky and Kahneman. It exposes a common reasoning error: a vivid, representative description can overpower the mathematical fact that “A and B” cannot be more likely than “A” alone.","main":{"label":"TAKE THE MARY TEST","source":"PHILOSOPHY EXPERIMENTS • CONJUNCTION FALLACY","url":"https://www.philosophyexperiments.com/mary","icon":"◇","kind":"LOGIC TRAP","time":"5–10 MIN","mission":"Rank the statements before looking anything up. If you fall for the trap, explain in one sentence why adding an extra condition can never increase the probability.","family":"philosophy-mary","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"conjunction fallacy Linda problem visual explanation","source":"BEHAVIORAL ECONOMICS / LOGIC"},"more":{"label":"TRY THE WASON TRAP","source":"PHILOSOPHY EXPERIMENTS • WASON TEST","url":"https://www.philosophyexperiments.com/wason","icon":"▱"},"id":"4-9"},{"title":"What If Nobody Could Catch You?","hook":"Would you still act justly if you became invisible and absolutely certain there would be no consequences?","brief":"Plato's Ring of Gyges is a thought experiment about whether people value justice itself or merely the reputation and rewards that come from appearing just. The interactive makes you answer choices under ordinary observation and then under perfect invisibility, leaving your own pattern of decisions as the evidence.","main":{"label":"PUT ON THE RING","source":"BIBBY PHILOSOPHY • RING OF GYGES","url":"https://bibbyphilosophy.net/resources/games/ring-of-gyges/","icon":"◉","kind":"THOUGHT EXPERIMENT","time":"10–20 MIN","mission":"Answer the visible scenarios first without gaming the result. When the ring makes you unaccountable, notice exactly which choices change and decide what that says about your reasons.","family":"bibby-gyges","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Plato Ring of Gyges justice thought experiment short","source":"PHILOSOPHY / PLATO"},"more":{"label":"OPEN THE PHILOSOPHY LAB","source":"BIBBY PHILOSOPHY • INTERACTIVE GAMES","url":"https://bibbyphilosophy.net/resources/games/","icon":"◇"},"id":"4-10"}]},{"name":"Earth","label":"EARTH","glyph":"⌖","color":"#42d27d","tagline":"Maps, weather, continents, streets, and deep time—preferably moving.","topics":[{"title":"Live Planet Weather","hook":"The atmosphere becomes a moving machine wrapped around the globe.","brief":"Earth Nullschool turns live and forecast data into animated winds, temperatures, ocean currents, waves, chemistry, and other layers on a rotatable globe. Weather stops being a symbol in an app and starts looking like one connected planetary system.","main":{"label":"CONTROL THE PLANET","source":"EARTH NULLSCHOOL • LIVE DATA GLOBE","url":"https://earth.nullschool.net/","icon":"🌎","kind":"LIVE DATA","time":"10–20 MIN","mission":"Spin to your hemisphere, switch from surface wind to a higher altitude, then find a jet stream. Change one more layer—ocean, temperature, or chemistry—and compare the pattern.","family":"earth-nullschool","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"jet stream global weather visualization short","source":"NOAA / WEATHER EXPLAINER"},"more":{"label":"SEE EARTH FROM NASA","source":"NASA EYES • EARTH","url":"https://eyes.nasa.gov/apps/earth/","icon":"◉"},"id":"5-0"},{"title":"Put Your City on Ancient Earth","hook":"Your hometown ha
