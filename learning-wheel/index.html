ual feature let your attention find a target without checking every object.","family":"psytoolkit","device":"KEYBOARD / DESKTOP","grade":"GOLD"},"watch":{"query":"visual search attention pop out feature integration short","source":"COGNITIVE PSYCHOLOGY"},"more":{"label":"FOOL YOUR VISUAL SYSTEM","source":"MICHAEL BACH • ILLUSION LAB","url":"https://michaelbach.de/ot/","icon":"◉"},"id":"11-7"},{"title":"Your Hands Obey Irrelevant Space","hook":"A word tells you LEFT while appearing on the right, and your reaction time reveals that location got into the decision anyway.","brief":"The Simon effect shows that irrelevant spatial information can speed or slow a response. The touchscreen version makes the conflict immediately noticeable: you know which answer is correct, but your body is still slightly influenced by where the stimulus appeared.","main":{"label":"RUN THE SIMON TASK","source":"PSYTOOLKIT • TOUCH SIMON","url":"https://us.psytoolkit.org/experiment-library/touch_simon.html","icon":"↔","kind":"REACTION-TIME EXPERIMENT","time":"5–10 MIN","mission":"Finish the task and compare compatible with incompatible response times. Try to consciously ignore location on a second run and see whether knowing about the effect makes it disappear.","family":"psytoolkit","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Simon effect stimulus response compatibility short","source":"PSYCHOLOGY / ATTENTION"},"more":{"label":"TRY THE STROOP CONFLICT","source":"PSYTOOLKIT • STROOP","url":"https://www.psytoolkit.org/experiment-library/stroop_phone.html","icon":"🧠"},"id":"11-8"},{"title":"Hold Two Steps of Memory at Once","hook":"Every new letter forces you to compare the present with something that happened two turns ago.","brief":"The 2-back task continuously updates working memory: remember recent items, discard old ones, and detect matches two positions back. It feels simple in the instructions and surprisingly demanding once the stream speeds up.","main":{"label":"RUN THE 2-BACK","source":"PSYTOOLKIT • TOUCH N-BACK","url":"https://us.psytoolkit.org/experiment-library/touch_nback2.html","icon":"2","kind":"WORKING-MEMORY TEST","time":"8–15 MIN","mission":"Complete one full run, note where errors cluster, then try again using a deliberate strategy. Decide whether the strategy helps accuracy, speed, or neither.","family":"psytoolkit","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"working memory n back task neuroscience short","source":"COGNITIVE SCIENCE"},"more":{"label":"COMPARE WITH OTHER BRAIN TESTS","source":"HUMAN BENCHMARK","url":"https://humanbenchmark.com/","icon":"◎"},"id":"11-9"},{"title":"Run a Tiny Brain Lab","hook":"Reaction time, Stroop interference, memory, hearing, pitch, and perception become experiments you can perform on yourself.","brief":"Brain Lab collects short browser demonstrations of classic cognitive-science effects. They are not intelligence or medical tests; the point is to feel the experimental effect directly and then compare what happened with the method researchers use to study it.","main":{"label":"EXPERIMENT ON YOURSELF","source":"BRAINMATTER • BRAIN LAB","url":"https://brainmatter.com/brain-lab","icon":"🧠","kind":"COGNITIVE LAB","time":"12–30 MIN","mission":"Try three different demonstrations, including Stroop if available. Repeat one task and ask whether improvement came from your brain changing or simply from learning the rules.","family":"brain-lab","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Stroop effect working memory reaction time cognitive science short","source":"PSYCHOLOGY / COGNITION"},"more":{"label":"PLAY A FAST PERCEPTION SET","source":"PERCEPTLE • DAILY PERCEPTION GAME","url":"https://perceptle.org/","icon":"◎"},"id":"11-10"}]},{"name":"Systems","label":"SYSTEMS","glyph":"↻","color":"#efb64f","tagline":"Draw the arrows, move the people, change the incentives, then watch the whole thing behave differently.","topics":[{"title":"Draw a System and Make It Run","hook":"Circles and arrows become a live simulation of feedback loops.","brief":"LOOPY is a sketching tool for systems thinking. Draw variables, connect them with positive or negative arrows, press play, and poke the model. You can build anything from predator-prey cycles to rumors, money, mood, traffic, or ridiculous self-reinforcing machines.","main":{"label":"BUILD A FEEDBACK LOOP","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻","kind":"SYSTEM BUILDER","time":"15–30 MIN","mission":"Make a three-part system with at least one positive and one negative connection. Press play, disturb one variable, and see whether the system stabilizes or runs away.","family":"ncase","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"feedback loops systems thinking positive negative loop short","source":"SYSTEMS THINKING / VISUAL"},"more":{"label":"SEE ATTRACTORS NEXT","source":"NCASE • ATTRACTOR LANDSCAPES","url":"https://ncase.me/attractors/","icon":"∞"},"id":"12-0"},{"title":"The Evolution of Trust","hook":"Cheaters, cooperators, mistakes, repeated games—and why the environment changes which strategy survives.","brief":"This interactive game begins with a simple choice to cooperate or cheat, then expands into tournaments and populations. By changing repetition, mistakes, and payoffs, you discover that 'trust' is not only a personality trait; it can emerge or collapse because of the rules around people.","main":{"label":"PLAY THE TRUST GAME","source":"NCASE • THE EVOLUTION OF TRUST","url":"https://ncase.me/trust/","icon":"♟","kind":"GAME THEORY","time":"25–35 MIN","mission":"Play through the story, but pause whenever a new rule appears. Predict which strategy should win before you run the tournament.","family":"ncase","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"game theory cooperation prisoner's dilemma short visual","source":"3BLUE1BROWN / GAME THEORY"},"more":{"label":"MODEL YOUR OWN SOCIAL SYSTEM","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"12-1"},{"title":"Small Bias, Big Segregation","hook":"Nobody has to demand total separation for a whole city to separate itself.","brief":"Parable of the Polygons is a playable version of a famous segregation model. Each little shape has only a mild neighborhood preference, yet those local choices can produce strong global separation. Then you can change the preferences and test what is required to reverse it.","main":{"label":"MOVE THE POLYGONS","source":"NCASE • PARABLE OF THE POLYGONS","url":"https://ncase.me/polygons/","icon":"◆","kind":"SOCIAL SIMULATION","time":"15–25 MIN","mission":"Run the model with mild bias, then lower the bias to zero. Notice whether the already-segregated pattern fixes itself. Then experiment with a small preference for diversity.","family":"ncase","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Schelling segregation model simulation short","source":"ECONOMICS / SOCIAL SCIENCE"},"more":{"label":"DRAW THE SAME IDEA AS A LOOP","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"12-2"},{"title":"Wisdom or Madness of Crowds","hook":"Change who is connected to whom and watch information, behavior, and groupthink spread.","brief":"This interactive explores network science by letting you draw connections among people and then run contagions through the network. It turns abstract ideas like echo chambers, bridging ties, majority illusions, and groupthink into puzzles you solve by rewiring the crowd.","main":{"label":"REWIRE THE CROWD","source":"NCASE • WISDOM AND/OR MADNESS OF CROWDS","url":"https://ncase.me/crowds/","icon":"●","kind":"NETWORK GAME","time":"25–35 MIN","mission":"Solve at least two network puzzles. In sandbox mode, try making one network where information spreads fast and another where it gets trapped.","family":"ncase","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"network science social contagion groupthink short visual","source":"VERITASIUM / NETWORKS"},"more":{"label":"MAKE A SIMPLER NETWORK MODEL","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"12-3"},{"title":"Roll a Ball Through Reality","hook":"Stable states, tipping points, and sudden change become a landscape you can reshape.","brief":"An attractor is a state a system tends to fall toward. Nicky Case’s interactive turns the idea into literal hills and valleys where balls roll. Change the landscape and you can make a stable system suddenly flip into another state—a useful mental model for ecosystems, climate, habits, markets, and more.","main":{"label":"RESHAPE THE LANDSCAPE","source":"NCASE • ATTRACTOR LANDSCAPES","url":"https://ncase.me/attractors/","icon":"∞","kind":"SYSTEM SIMULATION","time":"15–25 MIN","mission":"Create two stable valleys, then slowly alter the landscape until a ball suddenly tips from one to the other. Identify the point where gradual change produced a sudden result.","family":"ncase","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"attractors tipping points dynamical systems visual","source":"MATH / SYSTEMS EXPLAINER"},"more":{"label":"BUILD YOUR OWN FEEDBACK MODEL","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"12-4"},{"title":"Create Life From Four Rules","hook":"Tiny black cells live, die, and reproduce until spaceships, oscillators, chaos, and stable structures emerge.","brief":"Conway’s Game of Life is a cellular automaton with no players and only a few local rules. Yet large-scale patterns can move, reproduce, oscillate, or compute. It is one of the cleanest demonstrations that complicated behavior does not require complicated instructions.","main":{"label":"SEED THE GRID","source":"GAME OF LIFE • INTERACTIVE","url":"https://playgameoflife.com/","icon":"▦","kind":"CELLULAR AUTOMATON","time":"15–∞ MIN","mission":"Place a small random cluster and run it. Then load or build a known glider, observe how local birth/death rules create motion, and try to invent a repeating oscillator.","family":"game-of-life","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Conway Game of Life emergent complexity glider short","source":"MATH / COMPLEX SYSTEMS"},"more":{"label":"BUILD A DIFFERENT FEEDBACK SYSTEM","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"12-5"},{"title":"Draw the Political Lines Yourself","hook":"Move one boundary and thousands of voters change districts without anyone moving house.","brief":"Districtr is a real browser-based redistricting tool built for public participation. Drawing districts exposes the system problem immediately: compactness, population equality, communities, geography, and political consequences can pull a map in different directions at the same time.","main":{"label":"DRAW A DISTRICT MAP","source":"DISTRICTR • REDISTRICTING TOOL","url":"https://districtr.org/draw","icon":"⌖","kind":"CIVIC MAP TOOL","time":"20–∞ MIN","mission":"Choose a state or locality and draw several districts. Try making them population-balanced and geographically sensible, then notice which communities or boundaries make the task difficult.","family":"districtr","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"redistricting gerrymandering geometry interactive explanation short","source":"CIVICS / MAPS"},"more":{"label":"BREAK AN ELECTION ANOTHER WAY","source":"NCASE • BALLOT SIMULATOR","url":"https://ncase.me/ballot/","icon":"✓"},"id":"12-6"},{"title":"Cause a Traffic Jam With One Click","hook":"No crash, no construction—sometimes traffic emerges because drivers react to drivers reacting to drivers.","brief":"The traffic-flow simulations at traffic-simulation.de model car-following and lane-changing behavior. You can disturb the road, alter inflow, add obstacles, change driver parameters, and watch stop-and-go waves form from interactions rather than from a single obvious cause.","main":{"label":"BREAK THE HIGHWAY","source":"TRAFFIC-SIMULATION.DE • MICROSIMULATION","url":"https://www.traffic-simulation.de/","icon":"🚗","kind":"TRAFFIC SIMULATION","time":"15–25 MIN","mission":"Run a freeway or ring-road simulation, disturb traffic once, and watch whether the jam grows or dissolves. Change one driver parameter and see whether the same disturbance behaves differently.","family":"traffic-sim","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"phantom traffic jam shockwave drivers short visual","source":"TRAFFIC FLOW / SYSTEMS"},"more":{"label":"DRAW THE FEEDBACK LOOP","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"12-7"},{"title":"Make All the Paperclips","hook":"A harmless factory optimization game becomes a lesson in exponential growth, resources, automation, and badly specified goals.","brief":"Universal Paperclips begins with one button that makes one paperclip. Automation compounds, markets appear, resources become constraints, and the system expands far beyond what its opening screen suggests. It is a darkly funny systems game about optimization taken literally.","main":{"label":"MAKE A PAPERCLIP","source":"UNIVERSAL PAPERCLIPS • DECISION PROBLEM","url":"https://www.decisionproblem.com/paperclips/index2.html","icon":"📎","kind":"SYSTEMS GAME","time":"30–∞ MIN","mission":"Play without a guide until the game changes scale at least once. Each time a new resource appears, identify the bottleneck and decide whether your previous strategy still makes sense.","family":"paperclips","device":"DESKTOP PREFERRED • LONG SESSION","grade":"GOLD"},"watch":{"query":"Universal Paperclips AI instrumental convergence game discussion","source":"AI / SYSTEMS"},"more":{"label":"MODEL A SMALLER SYSTEM","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"12-8"},{"title":"Balance Wolves and Sheep","hook":"Predators eat prey, prey reproduce, grass regrows, and one slider can collapse the whole ecosystem.","brief":"NetLogo’s Wolf Sheep Predation model is a classic agent-based simulation. Individual animals follow simple rules, but population booms and crashes emerge at the system level. Changing reproduction, energy, or food makes the model behave like an experimental ecosystem.","main":{"label":"RUN THE PREDATOR–PREY MODEL","source":"NETLOGO • WOLF SHEEP PREDATION","url":"https://ccl.northwestern.edu/netlogo/models/WolfSheepPredation%28SystemDynamics%29","icon":"🐺","kind":"ECOSYSTEM MODEL","time":"15–30 MIN","mission":"Use the link to run it in NetLogo Web, establish a stable-looking cycle, then change one birth/death parameter until one population collapses. Try to recover the balance.","family":"netlogo","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"predator prey population cycles Lotka Volterra short visual","source":"ECOLOGY / SYSTEMS"},"more":{"label":"SEE REAL SPECIES RELATIONSHIPS","source":"ONEZOOM • TREE OF LIFE","url":"https://www.onezoom.org/","icon":"🌳"},"id":"12-9"},{"title":"Make a Flock With No Leader","hook":"Hundreds of agents can wheel like birds even though not one of them knows where the flock is going.","brief":"Boids simulations create flocking from a few local rules: avoid crowding, align with nearby motion, and stay close to neighbors. Open World Lab lets you tune those rules live, add a predator, disturb the flock with the pointer, and watch global order emerge from agents following only local information.","main":{"label":"CONTROL THE FLOCK","source":"OPEN WORLD LAB • FLOCKING SIMULATOR","url":"https://openworldlab.org/fun/flocking","icon":"➤","kind":"EMERGENCE SIMULATOR","time":"12–25 MIN","mission":"Set alignment to zero and watch the flock break down. Restore it, then change cohesion and separation one at a time. Finally add a hawk and watch how local panic spreads.","family":"owl-flocking","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"boids flocking emergence Craig Reynolds three rules short","source":"COMPLEX SYSTEMS / EMERGENCE"},"more":{"label":"BUILD A DIFFERENT EMERGENT SYSTEM","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"12-10"}]},{"name":"Space","label":"SPACE","glyph":"✦","color":"#6f7cff","tagline":"Space should feel enormous, dangerous, mechanical, and real.","topics":[{"title":"Drop an Asteroid Anywhere","hook":"Pick a city, choose a rock, choose a speed, choose an angle, and ruin everybody’s afternoon.","brief":"Asteroid Launcher turns impact physics into a map-based disaster toy. Diameter, material, speed, and impact angle change crater size, blast effects, heat, and other consequences. The uncomfortable scale is the point: relatively small cosmic objects carry absurd amounts of energy.","main":{"label":"LAUNCH THE ASTEROID","source":"NEAL.FUN • ASTEROID LAUNCHER","url":"https://neal.fun/asteroid-launcher/","icon":"☄","kind":"PHYSICS TOY","time":"10–20 MIN","mission":"Start with a small rock, then increase only one variable at a time. Find the smallest impactor that produces consequences much larger than you expected.","family":"neal-fun","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"asteroid impact energy crater physics short","source":"NASA / PLANETARY SCIENCE"},"more":{"label":"SEE THE SOLAR SYSTEM IN 3D","source":"NASA EYES • ORRERY","url":"https://eyes.nasa.gov/apps/orrery/?source=solar-system","icon":"◉"},"id":"13-0"},{"title":"Ride the Space Elevator","hook":"Scroll upward past birds, jets, weather balloons, meteors, satellites, and the edge of ordinary life.","brief":"Space Elevator turns altitude into one enormous visual scale. Instead of memorizing that the atmosphere is 'thin,' you spend time traveling through it and watching familiar objects vanish below. By the time you reach orbital heights, the planet has started to feel different.","main":{"label":"GO STRAIGHT UP","source":"NEAL.FUN • SPACE ELEVATOR","url":"https://neal.fun/space-elevator/","icon":"↑","kind":"SCALE JOURNEY","time":"10–20 MIN","mission":"Stop at the highest bird, the highest balloon or aircraft, and low Earth orbit. Compare those altitudes with the total distance you have traveled.","family":"neal-fun","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"layers of atmosphere edge of space short animation","source":"NASA / SPACE"},"more":{"label":"ZOOM OUT EVEN FARTHER","source":"NEAL.FUN • SIZE OF SPACE","url":"https://neal.fun/size-of-space/","icon":"↔"},"id":"13-1"},{"title":"Drive Curiosity on Mars","hook":"A billion-dollar rover becomes a machine you can walk around, inspect, and drive in 3D.","brief":"NASA’s Experience Curiosity recreates the Mars rover and its environment as an interactive 3D experience. You can move around the rover, inspect its instruments, and understand that exploring Mars means combining geology with an extremely complicated robot.","main":{"label":"TAKE THE ROVER","source":"NASA EYES • EXPERIENCE CURIOSITY","url":"https://eyes.nasa.gov/curiosity","icon":"🤖","kind":"3D EXPLORER","time":"12–25 MIN","mission":"Walk around the rover, identify at least three instruments, then use the driving or terrain features to understand what the rover can and cannot do on Mars.","family":"nasa-eyes","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"Curiosity rover instruments how it works short NASA","source":"NASA JPL"},"more":{"label":"FOLLOW MARS 2020","source":"NASA EYES • MARS 2020","url":"https://eyes.nasa.gov/apps/mars2020/","icon":"🚀"},"id":"13-2"},{"title":"Listen to Deep Space Right Now","hook":"Somewhere in the solar system, enormous dishes are talking to robots—and this page shows the traffic live.","brief":"NASA’s Deep Space Network communicates with spacecraft far beyond Earth. DSN Now visualizes which antennas are talking to which missions and updates continuously. It is one of the best reminders that planetary exploration is not history: the radio links are operating right now.","main":{"label":"OPEN THE DEEP SPACE NETWORK","source":"NASA • DSN NOW","url":"https://eyes.nasa.gov/apps/dsn-now/dsn.html","icon":"◉","kind":"LIVE SPACE DATA","time":"8–20 MIN","mission":"Find one antenna currently receiving data and one spacecraft it is talking to. Notice the signal distance or mission location and imagine the delay involved.","family":"nasa-dsn","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"NASA Deep Space Network how it works short","source":"NASA JPL"},"more":{"label":"SEE WHERE THE SPACECRAFT ARE","source":"NASA EYES • SOLAR SYSTEM","url":"https://eyes.nasa.gov/apps/orrery/?source=solar-system","icon":"⌖"},"id":"13-3"},{"title":"Turn Off the City Lights","hook":"Point a planetarium anywhere in the sky and reveal what is actually overhead.","brief":"Stellarium Web is a browser planetarium built from astronomical data. You can change location and time, pan across the sky, identify stars and planets, and make daylight or light pollution stop getting in the way of the underlying geometry.","main":{"label":"OPEN THE SKY","source":"STELLARIUM WEB • PLANETARIUM","url":"https://stellarium-web.org/","icon":"✦","kind":"SKY SIMULATOR","time":"10–∞ MIN","mission":"Set your location, find the Moon and at least one planet or bright star, then advance time several hours and watch the sky rotate.","family":"stellarium","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how to read night sky constellations planets short","source":"ASTRONOMY EXPLAINER"},"more":{"label":"EXPLORE THE SOLAR SYSTEM","source":"NASA EYES • ORRERY","url":"https://eyes.nasa.gov/apps/orrery/?source=solar-system","icon":"◉"},"id":"13-4"},{"title":"Visit Every Known Exoplanet","hook":"Thousands of alien worlds become a navigable 3D neighborhood instead of a table of names.","brief":"NASA’s Eyes on Exoplanets places discovered planetary systems into a scientifically grounded 3D universe. You can compare planet sizes and orbits, look at discovery methods, inspect habitable zones, and move between systems that are otherwise just dots in a catalog.","main":{"label":"FLY TO AN EXOPLANET","source":"NASA EYES • EXOPLANETS","url":"https://eyes.nasa.gov/apps/exo/","icon":"◉","kind":"3D SPACE EXPLORER","time":"15–∞ MIN","mission":"Visit three systems: one with a planet near Earth-size, one giant planet, and one multi-planet system. Compare their orbital layouts with our solar system.","family":"nasa-exoplanets","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"exoplanets transit method habitable zone NASA short","source":"NASA EXOPLANETS"},"more":{"label":"OPEN THE WHOLE SOLAR SYSTEM","source":"NASA EYES • ORRERY","url":"https://eyes.nasa.gov/apps/orrery/?source=solar-system","icon":"🚀"},"id":"13-5"},{"title":"Walk Through the Asteroid Swarm","hook":"Near-Earth asteroids are not a belt of identical rocks; they are tracked objects with individual orbits and close approaches.","brief":"NASA Eyes on Asteroids visualizes tens of thousands of near-Earth objects in a real-time 3D solar-system model. You can inspect close approaches and missions while seeing why “near Earth” is a geometric and orbital category, not a prediction of impact.","main":{"label":"OPEN THE ASTEROID FIELD","source":"NASA EYES • ASTEROIDS","url":"https://eyes.nasa.gov/apps/asteroids/","icon":"☄","kind":"3D LIVE DATA","time":"15–25 MIN","mission":"Find the next close approach, inspect its orbit, then compare it with a different asteroid. Decide why crossing Earth’s orbital distance does not automatically mean a collision.","family":"nasa-asteroids","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"near Earth asteroids orbit impact risk NASA short","source":"NASA PLANETARY DEFENSE"},"more":{"label":"THEN DROP ONE YOURSELF","source":"NEAL.FUN • ASTEROID LAUNCHER","url":"https://neal.fun/asteroid-launcher/","icon":"☄"},"id":"13-6"},{"title":"Operate a Pocket Solar System","hook":"Move time forward, change viewpoints, inspect planets and moons, and make orbital geometry visible.","brief":"Solar System Scope is a 3D model of the solar system and night sky designed for exploration. It makes spatial relationships much easier to grasp than static diagrams because you can move the camera and the clock yourself.","main":{"label":"SPIN THE SOLAR SYSTEM","source":"SOLAR SYSTEM SCOPE • 3D MODEL","url":"https://www.solarsystemscope.com/","icon":"◌","kind":"3D PLANETARIUM","time":"15–∞ MIN","mission":"Find the inner planets, tilt the view until you can see orbital planes, then speed time forward. Pick one planet and follow it through enough time to see how its year differs from Earth’s.","family":"solar-system-scope","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"solar system orbital periods scale visual short","source":"ASTRONOMY / PLANETS"},"more":{"label":"COMPARE WITH NASA DATA","source":"NASA EYES • SOLAR SYSTEM","url":"https://eyes.nasa.gov/apps/orrery/?source=solar-system","icon":"◉"},"id":"13-7"},{"title":"Scroll to Pluto One Pixel at a Time","hook":"Space is mostly the part between things. This map refuses to compress that away.","brief":"If the Moon Were Only 1 Pixel is a tediously accurate horizontal scale model of the solar system. The planets are tiny, but the distances remain proportional, so traveling by scrolling becomes the lesson: the emptiness is not decoration—it is most of the system.","main":{"label":"START SCROLLING","source":"JOSH WORTH • IF THE MOON WERE ONLY 1 PIXEL","url":"https://www.joshworth.com/dev/pixelspace/pixelspace_solarsystem.html","icon":"→","kind":"SCALE JOURNEY","time":"10–20 MIN","mission":"Scroll from the Sun to at least Jupiter without using a jump shortcut. Notice how long nothing happens, then compare planet diameters with the distance you just crossed.","family":"pixelspace","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"solar system scale distances planets visual comparison","source":"SPACE / SCALE"},"more":{"label":"ZOOM THE ENTIRE UNIVERSE","source":"SCALE OF THE UNIVERSE","url":"https://scaleofuniverse.com/en","icon":"↔"},"id":"13-8"},{"title":"Classify Real Galaxies","hook":"Astronomers have too many galaxy images for one research team; your eyes can become part of the pipeline.","brief":"Galaxy Zoo on Zooniverse asks volunteers to classify real telescope images by visible structure. The current project includes data from the Vera C. Rubin Observatory, so the activity is not a classroom imitation—it contributes to people-powered research.","main":{"label":"CLASSIFY THE GALAXIES","source":"ZOONIVERSE • GALAXY ZOO","url":"https://www.zooniverse.org/projects/zookeeper/galaxy-zoo/classify","icon":"◎","kind":"CITIZEN SCIENCE","time":"10–30 MIN","mission":"Classify at least ten galaxies. Keep track of one image where the answer is genuinely uncertain and identify which visible feature made classification difficult.","family":"zooniverse-galaxy","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"galaxy shapes spiral elliptical classification short","source":"ASTRONOMY / GALAXIES"},"more":{"label":"FLY THROUGH KNOWN WORLDS","source":"NASA EYES • EXOPLANETS","url":"https://eyes.nasa.gov/apps/exo/","icon":"◉"},"id":"13-9"},{"title":"Measure a Crater on Another World","hook":"NASA gives you the same kind of terrain data used for planetary exploration. Draw a line and make the landscape answer.","brief":"Solar System Treks are browser portals built from spacecraft data for the Moon, Mars, asteroids, and other worlds. You can fly over terrain in 3D, change map projections, measure distance, and draw elevation profiles across craters and mountains instead of only looking at photographs.","main":{"label":"TREK ANOTHER WORLD","source":"NASA JPL • SOLAR SYSTEM TREKS","url":"https://trek.nasa.gov/home/","icon":"☾","kind":"PLANETARY MAP LAB","time":"15–35 MIN","mission":"Choose the Moon or Mars, find one major crater, then use a distance or elevation tool to measure it. Compare the number you get with the scale your eyes guessed at first.","family":"nasa-treks","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"NASA planetary mapping craters Moon Mars elevation short","source":"NASA JPL / PLANETARY SCIENCE"},"more":{"label":"OPEN THE SOLAR SYSTEM ORRERY","source":"NASA EYES • 3D SOLAR SYSTEM","url":"https://eyes.nasa.gov/apps/orrery/?source=solar-system","icon":"◉"},"id":"13-10"}]},{"name":"Weird","label":"WEIRD","glyph":"?","color":"#38d6ff","tagline":"Strange corners of knowledge that justify themselves by being impossible not to poke.","topics":[{"title":"Walk a Non-Euclidean City","hook":"Move through a world where ordinary geometry quietly stops behaving.","brief":"Hiperbolia is a 3D environment built in hyperbolic geometry. The space has more room in it than Euclidean intuition expects, so straight lines, distances, and repeated structures behave strangely. Walking through it is far more convincing than being told that alternative geometries exist.","main":{"label":"ENTER HIPERBOLIA","source":"HIPERBOLIA • HYPERBOLIC 3D WORLD","url":"https://www.hiperbolia.com/","icon":"◌","kind":"3D WORLD","time":"12–25 MIN","mission":"Walk until you find a structure that looks impossible from ordinary geometric intuition. Turn around, retrace your path, and notice whether distance behaves the way you expect.","family":"hiperbolia","device":"BEST ON A BIG SCREEN","grade":"GOLD"},"watch":{"query":"hyperbolic geometry visual explanation","source":"3BLUE1BROWN / GEOMETRY"},"more":{"label":"PLAY WITH FRACTALS","source":"MATHIGON • FRACTALS","url":"https://mathigon.org/course/fractals/introduction","icon":"✣"},"id":"14-0"},{"title":"Internet Archaeology","hook":"Scroll through pop-ups, webcams, GeoCities, dancing babies, Flash, memes, and the machinery that built online culture.","brief":"Internet Artifacts treats the web itself as archaeology. Instead of a timeline made of dates, you encounter working or reconstructed artifacts from different eras and feel how quickly the internet’s aesthetics, technology, and behavior mutated.","main":{"label":"DIG THROUGH THE OLD INTERNET","source":"NEAL.FUN • INTERNET ARTIFACTS","url":"https://neal.fun/internet-artifacts/","icon":"◎","kind":"INTERACTIVE TIMELINE","time":"12–25 MIN","mission":"Stop at one artifact from before you were born, one from the early social-web era, and one you recognize. Compare what each one assumed people wanted from the internet.","family":"neal-fun","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"internet history GeoCities Flash early web short","source":"COMPUTERPHILE / INTERNET HISTORY"},"more":{"label":"BOOT AN OLD BROWSER","source":"OLDWEB.TODAY","url":"https://oldweb.today/","icon":"▣"},"id":"14-1"},{"title":"The Talking Museum","hook":"Pick up 3D artifacts, rotate them, listen, and interrogate the collection.","brief":"The Talking Museum is a recent Google Arts & Culture experiment built around a large set of 3D museum objects. The interesting shift is from 'look at this object' to 'handle it and ask about it': scale, material, use, origin, and detail become directions for exploration.","main":{"label":"PICK UP AN ARTIFACT","source":"GOOGLE ARTS & CULTURE • THE TALKING MUSEUM","url":"https://artsandculture.google.com/experiment/the-talking-museum/XAHyUTtHIxB_tw","icon":"◈","kind":"3D MUSEUM","time":"12–25 MIN","mission":"Choose an object you know nothing about. Rotate it before reading. Guess what it was for, then investigate until you can say what clue fooled or helped you.","family":"google-arts","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"museum object detective archaeology artifact clues short","source":"SMITHSONIAN / MUSEUM"},"more":{"label":"OPEN SMITHSONIAN 3D","source":"SMITHSONIAN • 3D COLLECTIONS","url":"https://3d.si.edu/","icon":"◈"},"id":"14-2"},{"title":"Read Earth's Reviews","hook":"If the planet had customer reviews, what would one star look like?","brief":"Earth Reviews is a deliberately ridiculous way to think about familiar natural features and human expectations. It works as a perspective machine: oceans, weather, gravity, animals, and geography become things an imaginary visitor can complain about.","main":{"label":"READ THE PLANET'S REVIEWS","source":"NEAL.FUN • EARTH REVIEWS","url":"https://neal.fun/earth-reviews/","icon":"★","kind":"WEIRD EXPLORER","time":"8–15 MIN","mission":"Read until you find the review that makes you laugh hardest and the one that accidentally teaches you something real. Decide which natural feature would get your own one-star review.","family":"neal-fun","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"strange facts about Earth geology animals weather short","source":"VSAUCE / EARTH"},"more":{"label":"OPEN THE REAL PLANET","source":"GOOGLE EARTH","url":"https://earth.google.com/web/","icon":"🌎"},"id":"14-3"},{"title":"Become a Pirate Trader","hook":"Ports, cargo, risk, distance, and the Golden Age of Piracy become a trading game.","brief":"Silver & Sails is built around the economics and geography of Atlantic piracy. You are not just reading that pirates operated inside trade networks; you make route and cargo decisions yourself while the historical setting pushes back.","main":{"label":"SET SAIL","source":"SILVER & SAILS • PIRATE TRADING GAME","url":"https://silverandsails.com/","icon":"☠","kind":"HISTORY GAME","time":"15–30 MIN","mission":"Make several trades and try to increase your wealth. Notice which decisions are really about geography and economics rather than sword fighting.","family":"silver-sails","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Golden Age piracy trade routes pirate economy short","source":"HISTORY / PIRACY"},"more":{"label":"FLY OVER THE CARIBBEAN","source":"GOOGLE EARTH","url":"https://earth.google.com/web/","icon":"⌖"},"id":"14-4"},{"title":"Tour the World’s Weirdest Street Views","hook":"The planet has been accidentally photographed doing some deeply strange things.","brief":"Wonders of Street View is a curated trip through bizarre, funny, beautiful, and confusing places captured by Street View. It is geography filtered through surprise: every jump raises the question “where on Earth is this, and why does it look like that?”","main":{"label":"OPEN THE WEIRD WORLD","source":"NEAL.FUN • WONDERS OF STREET VIEW","url":"https://neal.fun/wonders-of-street-view/","icon":"⌖","kind":"WEIRD WORLD TOUR","time":"10–∞ MIN","mission":"Visit at least ten locations without rushing. Pick the strangest one, open its geographic context, and figure out whether the weirdness is natural, cultural, accidental, or staged.","family":"neal-wonders","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"strangest Google Street View places geography short","source":"GEOGRAPHY / INTERNET CULTURE"},"more":{"label":"GET DROPPED SOMEWHERE RANDOM","source":"MAPCRUNCH","url":"https://www.mapcrunch.com/","icon":"🌎"},"id":"14-5"},{"title":"Try to Draw a Perfect Circle","hook":"One stupidly simple challenge turns hand-eye coordination and geometry into a score you will irrationally care about.","brief":"Draw a Perfect Circle gives you almost nothing except a target and a percentage. That constraint is the whole appeal: your hand tries to produce a geometric ideal, and the score reveals how much “circle” is perception, motor control, and mathematical symmetry.","main":{"label":"DRAW THE CIRCLE","source":"NEAL.FUN • PERFECT CIRCLE","url":"https://neal.fun/perfect-circle/","icon":"◯","kind":"MICRO GAME","time":"5–15 MIN","mission":"Take ten attempts. Do not trace slowly: try different speeds and starting points, record your best score, and decide which movement strategy produces the roundest result.","family":"neal-circle","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"why circle geometry pi symmetry visual short","source":"MATH / GEOMETRY"},"more":{"label":"DRAW EQUATIONS AS SHAPES","source":"DESMOS","url":"https://www.desmos.com/calculator","icon":"∿"},"id":"14-6"},{"title":"Zoom From Quarks to the Observable Universe","hook":"Everything you know fits somewhere on one absurd ladder of size.","brief":"Scale of the Universe places subatomic particles, cells, animals, planets, stars, galaxies, and cosmic structures on a continuous zoom. The surprise is not only what is large or small, but how many orders of magnitude sit between familiar things.","main":{"label":"ZOOM EVERYTHING","source":"SCALE OF THE UNIVERSE","url":"https://scaleofuniverse.com/en","icon":"↔","kind":"SCALE EXPLORER","time":"10–20 MIN","mission":"Start near human size and zoom all the way to both extremes. Stop whenever a familiar object disappears from intuition and compare its scale with the nearest thing you understand.","family":"scale-universe","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"powers of ten scale universe short visual","source":"COSMIC SCALE / SCIENCE"},"more":{"label":"DO THE SAME FOR LIVING THINGS","source":"NEAL.FUN • SIZE OF LIFE","url":"https://neal.fun/size-of-life/","icon":"🧬"},"id":"14-7"},{"title":"Build the Most Chaotic Soundscape Possible","hook":"Rain, traffic, keyboards, birds, crowds, machinery—stack ordinary noises until the room becomes somewhere else.","brief":"Ambient Chaos is a playful sound mixer built around environmental audio. It is less “music” than sound design: combining layers changes the imagined place, mood, and attention in ways that reveal how strongly background sound shapes experience.","main":{"label":"MIX THE CHAOS","source":"NEAL.FUN • AMBIENT CHAOS","url":"https://neal.fun/ambient-chaos/","icon":"🔊","kind":"SOUND TOY","time":"8–20 MIN","mission":"Create one believable environment and one impossible environment. Close your eyes for thirty seconds with each and decide which sound layer contributes most to the sense of place.","family":"neal-ambient","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"soundscape environmental sound design perception short","source":"SOUND DESIGN / PSYCHOLOGY"},"more":{"label":"TURN SOUND INTO RHYTHM","source":"PATATAP","url":"https://patatap.com/","icon":"●"},"id":"14-8"},{"title":"Click Until the Internet Eats Your Brain","hook":"A satire of engagement mechanics becomes a deliberately absurd clicker game.","brief":"Stimulation Clicker piles notifications, streaks, numbers, noises, upgrades, and distractions on top of one another. The joke works because the mechanics resemble real attention systems: feedback gets faster while meaning gets thinner.","main":{"label":"START CLICKING","source":"NEAL.FUN • STIMULATION CLICKER","url":"https://neal.fun/stimulation-clicker/","icon":"☝","kind":"SATIRICAL CLICKER","time":"10–25 MIN","mission":"Play until the screen becomes difficult to track. Notice the exact point where you stop choosing carefully and start responding automatically to numbers, alerts, or rewards.","family":"neal-stimulation","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"variable rewards notifications attention design short","source":"PSYCHOLOGY / DESIGN"},"more":{"label":"MODEL THE FEEDBACK LOOP","source":"NCASE • LOOPY","url":"https://ncase.me/loopy/","icon":"↻"},"id":"14-9"},{"title":"Put Everything in the Right Century","hook":"A dinosaur, Julius Caesar, the steam engine, a music album, and the first iPhone all share one ridiculous timeline.","brief":"QuoAnno mixes natural history, ancient civilizations, science, technology, art, internet culture, space, and everyday events on one continuous time scale. You usually do not know the exact date; the game rewards reasoning from anchor points and tells you how far your mental timeline was off.","main":{"label":"GUESS WHEN","source":"QUOANNO • TIMELINE GAME","url":"https://quoanno.com/","icon":"⌛","kind":"TIMELINE GAME","time":"10–∞ MIN","mission":"Play at least ten events without searching. For every miss, say whether your guess was too early or too late. At the end, identify the historical era your intuition handles worst.","family":"quoanno","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"how to estimate historical dates timeline anchor points short","source":"HISTORY + DEEP TIME"},"more":{"label":"LEARN THE ANCHOR TRICK","source":"QUOANNO • HOW TO GUESS THE YEAR","url":"https://quoanno.com/learn/guess-the-year","icon":"↔"},"id":"14-10"}]},{"name":"Wild","label":"WILD","glyph":"✦","color":"#ff4ecd","tagline":"No curriculum excuse required. The thing was too good not to put on the wheel.","topics":[{"title":"Blob Beats","hook":"Classical music becomes a rhythm arcade starring singing blobs.","brief":"Blob Beats turns famous classical pieces into a timing game. You follow the beat first and absorb composers, melodies, and musical structure through play. It is exactly the kind of accidental education the Wild wedge is for.","main":{"label":"PLAY THE BLOBS","source":"GOOGLE ARTS & CULTURE • BLOB BEATS","url":"https://artsandculture.google.com/experiment/blob-beats/ZgF_e3-CO-iRPw","icon":"●","kind":"RHYTHM GAME","time":"8–20 MIN","mission":"Play several tracks and replay one until your score improves. Notice whether recognizing the musical pattern makes the rhythm easier.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"Blob Beats classical music game demo","source":"GOOGLE ARTS & CULTURE"},"more":{"label":"CONDUCT BLOB OPERA","source":"GOOGLE ARTS & CULTURE • BLOB OPERA","url":"https://artsandculture.google.com/experiment/blob-opera/AAHWrq360NcGbw","icon":"♪"},"id":"15-0"},{"title":"Match Art to Sound","hook":"Two paintings. One piece of music. Pick which image the machine thinks belongs with the sound.","brief":"One Sound, Two Frames is a fast experiment in cross-sensory association. You hear music and choose between artworks, comparing your own visual-musical intuition with patterns generated by an AI system. There is no important grade here; the interesting part is noticing why a sound seems to 'fit' a picture.","main":{"label":"MATCH THE SOUND","source":"GOOGLE ARTS & CULTURE • ONE SOUND, TWO FRAMES","url":"https://artsandculture.google.com/experiment/one-sound-two-frames/IQFz5C4K_sgFpg","icon":"♫","kind":"ART + SOUND GAME","time":"8–15 MIN","mission":"Play enough rounds to notice your own rule. Are you matching color, motion, mood, density, age, or something else?","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"music visual art emotion association short","source":"ART + MUSIC"},"more":{"label":"PAINT WITH MUSIC","source":"GOOGLE ARTS & CULTURE • PAINT WITH MUSIC","url":"https://artsandculture.google.com/experiment/paint-with-music/YAGuJyDB-XbbWg","icon":"✎"},"id":"15-1"},{"title":"Guess Where the Artwork Came From","hook":"An artifact appears. You have a globe. Good luck.","brief":"Geo Artwork turns museum objects into a geography guessing game. Style, material, clothing, subject, technique, and cultural clues become evidence while you place a guess on the planet. Even wrong answers are useful because the distance between your guess and the real origin teaches scale.","main":{"label":"GUESS THE ORIGIN","source":"GOOGLE ARTS & CULTURE • GEO ARTWORK","url":"https://artsandculture.google.com/experiment/wgEPVBAUiRVlEQ","icon":"⌖","kind":"GEOGRAPHY GAME","time":"8–20 MIN","mission":"Play several rounds without searching. Before placing each guess, name one visual clue you are using. Keep track of your worst miss.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how archaeologists identify artifacts origin style materials short","source":"MUSEUM / ARCHAEOLOGY"},"more":{"label":"RANDOMLY TELEPORT AFTERWARD","source":"MAPCRUNCH","url":"https://www.mapcrunch.com/","icon":"🌎"},"id":"15-2"},{"title":"What Came First?","hook":"Two inventions, artworks, events, or cultural objects enter. Only one is older.","brief":"What Came First? is a rapid chronology game using hundreds of cultural items. It is excellent at exposing fake certainty: things that feel obviously ancient can be surprisingly recent, and familiar inventions often overlap in time in ways you would not guess.","main":{"label":"PICK THE OLDER ONE","source":"GOOGLE ARTS & CULTURE • WHAT CAME FIRST?","url":"https://artsandculture.google.com/experiment/what-came-first/ZQGBUPErEE3bVg?cp=1","icon":"⏳","kind":"TIMELINE GAME","time":"8–15 MIN","mission":"Play until you miss at least three. For the most surprising miss, remember both dates rather than just the right answer.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"surprising invention timeline history short","source":"HISTORY / TIMELINE"},"more":{"label":"MOVE THROUGH REAL POLITICAL TIME","source":"THE WORLD THROUGH TIME","url":"https://www.theworldthroughtime.com/app","icon":"⌖"},"id":"15-3"},{"title":"Let Dead Composers Hijack Your Melody","hook":"Write a tune, then make Mozart or Beethoven-style harmonization appear around it.","brief":"Assisted Melody is a composition toy that lets you enter a melody and hear algorithmically generated accompaniment inspired by famous composers. It is not a substitute for those composers; it is a very effective excuse to hear how harmony can change the identity of the same melodic line.","main":{"label":"WRITE THE MELODY","source":"GOOGLE ARTS & CULTURE • ASSISTED MELODY","url":"https://artsandculture.google.com/experiment/cAGcgh18Zi7DqQ?cp=1","icon":"♫","kind":"MUSIC MAKER","time":"10–20 MIN","mission":"Write a short melody you can remember. Hear it with more than one accompaniment style and decide which changes its mood the most.","family":"google-arts","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"melody harmony Mozart Beethoven visual music theory","source":"DAVID BENNETT PIANO"},"more":{"label":"BUILD A SONG FROM SCRATCH","source":"CHROME MUSIC LAB • SONG MAKER","url":"https://musiclab.chromeexperiments.com/Song-Maker","icon":"♪"},"id":"15-4"},{"title":"Fall Through a Museum Without Touching Art","hook":"Museum etiquette becomes an arcade game where the floor has disappeared.","brief":"Don’t Touch the Art turns real collection images into obstacles in a gravity-defying falling game. It is proudly backwards: instead of carefully approaching the artwork, you desperately avoid colliding with it—and end up staring at a lot of art along the way.","main":{"label":"DON’T TOUCH ANYTHING","source":"GOOGLE ARTS & CULTURE • DON’T TOUCH THE ART","url":"https://artsandculture.google.com/experiment/don-t-touch-the-art/EwElh6DBf5inTA?hl=en","icon":"↓","kind":"ARCADE ART GAME","time":"8–20 MIN","mission":"Play until you beat your first score by a noticeable margin. On the best run, identify one artwork you only noticed because you nearly crashed into it.","family":"google-arts-dont-touch","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"museum art handling gallery rules short fun","source":"MUSEUM / ART"},"more":{"label":"TRY THE NATIONAL GALLERY VERSION","source":"GOOGLE ARTS & CULTURE • NGA EDITION","url":"https://artsandculture.google.com/experiment/don-t-touch-the-art-at-the-national-gallery-of-art-washington-d-c/6gFFxOZaOc9WwQ","icon":"🖼"},"id":"15-5"},{"title":"Solve Culture as a Crossword","hook":"History, art, yoga, textiles, objects, and famous faces get turned into clue boxes.","brief":"Cultural Crosswords uses Google Arts & Culture collections as the clue bank for playable crosswords. A right answer immediately opens another little rabbit hole, so a word puzzle becomes a launchpad into whatever object or idea produced the clue.","main":{"label":"OPEN THE CROSSWORD","source":"GOOGLE ARTS & CULTURE • CULTURAL CROSSWORDS","url":"https://artsandculture.google.com/experiment/cultural-crosswords/JgGaXxGHVxpn4A","icon":"▦","kind":"CULTURE PUZZLE","time":"10–25 MIN","mission":"Finish as much of one puzzle as you can without searching. For one clue you miss, follow the revealed answer into the collection and learn why it mattered.","family":"google-arts-crosswords","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"how crossword clues wordplay work short","source":"PUZZLES / LANGUAGE"},"more":{"label":"TRY VISUAL CROSSWORDS","source":"GOOGLE ARTS & CULTURE","url":"https://artsandculture.google.com/experiment/visual-crosswords/JwGOLSD8LODzyQ?cp=1","icon":"◈"},"id":"15-6"},{"title":"Prompt an Image Without Seeing the Prompt","hook":"Describe what you see well enough that an image model recreates the important parts.","brief":"Say What You See turns image prompting into a perception game. You inspect an AI-generated image, write a description, and learn whether your words captured the visual features that mattered. It is partly about AI, but mostly about looking carefully.","main":{"label":"DESCRIBE THE IMAGE","source":"GOOGLE ARTS & CULTURE • SAY WHAT YOU SEE","url":"https://artsandculture.google.com/experiment/say-what-you-see/jwG3m7wQShZngw","icon":"👁","kind":"AI + ART GAME","time":"10–20 MIN","mission":"Reach at least the second difficulty level. Compare a failed prompt with a successful one and identify which missing visual detail caused the biggest change.","family":"google-arts-prompt","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"image prompting descriptive language computer vision short","source":"AI + VISUAL LITERACY"},"more":{"label":"MAKE THE AI GUESS YOUR DRAWING","source":"GOOGLE • QUICK, DRAW!","url":"https://quickdraw.withgoogle.com/","icon":"✎"},"id":"15-7"},{"title":"Make a Painting Sing","hook":"One brushstroke can become a note, a trail, and part of a composition at the same time.","brief":"Paint With Music connects drawing gestures to generated sound. It does not demand that you understand notation first; the relationship between movement, pitch, density, and repetition appears while you paint.","main":{"label":"PAINT WITH SOUND","source":"GOOGLE ARTS & CULTURE • PAINT WITH MUSIC","url":"https://artsandculture.google.com/experiment/paint-with-music/YAGuJyDB-XbbWg","icon":"✎","kind":"CREATIVE MUSIC TOY","time":"10–25 MIN","mission":"Make one sparse drawing and one dense drawing with the same instrument. Listen with your eyes closed and decide which visual choices you can still hear.","family":"google-arts-paint-music","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"visual music synesthesia Kandinsky sound art short","source":"ART + MUSIC"},"more":{"label":"DRAW SOUND DIFFERENTLY","source":"CHROME MUSIC LAB • KANDINSKY","url":"https://musiclab.chromeexperiments.com/Kandinsky/","icon":"♫"},"id":"15-8"},{"title":"Play a Visual Crossword","hook":"Pictures replace words, categories overlap, and paintings become puzzle pieces in a logic grid.","brief":"Visual Crosswords asks you to drag artworks into the correct intersections of visual or historical categories. It is a fast pattern-recognition game, but the art makes every rule richer than a normal sorting puzzle because style, period, artist, and subject can overlap.","main":{"label":"SOLVE WITH PICTURES","source":"GOOGLE ARTS & CULTURE • VISUAL CROSSWORDS","url":"https://artsandculture.google.com/experiment/visual-crosswords/JwGOLSD8LODzyQ?cp=1","icon":"◈","kind":"VISUAL PUZZLE","time":"10–20 MIN","mission":"Complete several levels. Before dropping each artwork, state the visual clue you are using—color, style, subject, period, or artist—and notice when a guess relies only on vibe.","family":"google-arts-visual-crossword","device":"TOUCH FRIENDLY","grade":"GOLD"},"watch":{"query":"how to recognize art styles visual clues short","source":"ART HISTORY / VISUAL LITERACY"},"more":{"label":"TURN THE ART INTO JIGSAWS","source":"GOOGLE ARTS • PUZZLE PARTY","url":"https://artsandculture.google.com/experiment/puzzle-party/EwGBPZlIzv0KRw?hl=en","icon":"🧩"},"id":"15-9"},{"title":"Whisper to a Digital Flock","hook":"A 3D swarm can react to your pointer, your voice, your camera, and even the rhythm of guided breathing.","brief":"Murmur is a playful boids simulation built around collective motion. The flock scatters from the pointer, gathers toward a held light, can respond to microphone sounds, and can form silhouettes from the camera. It is equal parts emergent-systems demo, audiovisual toy, and strange digital pet.","main":{"label":"WAKE THE FLOCK","source":"MURMUR • INTERACTIVE 3D BOIDS","url":"https://murmurations.app/","icon":"✦","kind":"INTERACTIVE SWARM","time":"10–∞ MIN","mission":"Scatter the flock, gather it again, then try one unusual control such as microphone or camera if you are comfortable granting permission. Watch how a local input changes the whole group.","family":"murmur-boids","device":"TOUCH + DESKTOP","grade":"GOLD"},"watch":{"query":"boids flocking algorithm emergent behavior visual short","source":"CREATIVE CODING / EMERGENCE"},"more":{"label":"MAKE A DIFFERENT KIND OF CHAOS","source":"PATATAP • AUDIOVISUAL INSTRUMENT","url":"https://patatap.com/","icon":"♫"},"id":"15-10"}]}]};
const $=s=>document.querySelector(s);
const cv=$("#wheel"),ctx=cv.getContext("2d"),reveal=$("#reveal"),labelRotor=$("#labelRotor");
const glyphs={"History":"⚔","Science":"⚛","Math":"∑","Stories":"A","Philosophy":"◇","Earth":"⌖","Life":"🧬","Machines":"⚙","Art":"✦","Music":"♪","Technology":"◉","People":"◎","Systems":"↻","Space":"✦","Weird":"?","Wild":"✦"},wheelLabels={"History":"HISTORY","Science":"SCIENCE","Math":"MATH","Stories":"STORIES","Philosophy":"PHILOSOPHY","Earth":"EARTH","Life":"LIFE","Machines":"MACHINES","Art":"ART","Music":"MUSIC","Technology":"TECH","People":"PEOPLE","Systems":"SYSTEMS","Space":"SPACE","Weird":"WEIRD","Wild":"WILD"};
const st={rot:-Math.PI/2,spin:false,muted:localStorage.getItem("woe:v26:muted")==="1",recent:JSON.parse(localStorage.getItem("woe:v26:recent")||"[]"),families:JSON.parse(localStorage.getItem("woe:v26:families")||"[]")};
let audioCtx;
function norm(a){a%=Math.PI*2;return a<0?a+Math.PI*2:a}
function shade(hex,amt){let c=hex.replace("#",""),n=parseInt(c,16),r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;return "#"+(0x1000000+(Math.max(0,Math.min(255,r))<<16)+(Math.max(0,Math.min(255,g))<<8)+Math.max(0,Math.min(255,b))).toString(16).slice(1)}
function fit(){const dpr=Math.min(devicePixelRatio||1,3),size=Math.max(320,Math.min(760,cv.parentElement.clientWidth));cv.width=Math.round(size*dpr);cv.height=Math.round(size*dpr);cv.style.width=size+"px";cv.style.height=size+"px";ctx.setTransform(dpr,0,0,dpr,0,0);layoutLabels(size);draw()}
addEventListener("resize",fit);
function buildLabels(){labelRotor.innerHTML="";DATA.subjects.forEach((s,i)=>{const el=document.createElement("span");el.className="wheel-label";el.textContent=wheelLabels[s.name]||s.name.toUpperCase();el.dataset.index=i;labelRotor.appendChild(el)})}
function layoutLabels(size){const n=DATA.subjects.length,a=Math.PI*2/n,radiusPct=33.2,fs=Math.max(10.2,Math.min(13.9,size*.0182)),width=Math.max(74,Math.min(116,size*.155));[...labelRotor.children].forEach((el,i)=>{const mid=i*a+a/2,x=50+Math.cos(mid)*radiusPct,y=50+Math.sin(mid)*radiusPct;el.style.left=x+"%";el.style.top=y+"%";el.style.width=width+"px";el.style.height=Math.max(22,fs*1.8)+"px";el.style.fontSize=fs+"px";el.style.transform=`translate(-50%,-50%) rotate(${mid+Math.PI/2}rad)`})}
buildLabels();
function draw(){const size=parseFloat(cv.style.width)||650,c=size/2,r=size*.455,n=DATA.subjects.length,a=Math.PI*2/n;labelRotor.style.transform=`rotate(${st.rot}rad)`;ctx.clearRect(0,0,size,size);ctx.save();ctx.translate(c,c);ctx.rotate(st.rot);DATA.subjects.forEach((s,i)=>{const a0=i*a,a1=a0+a,gr=ctx.createRadialGradient(0,0,r*.08,0,0,r);gr.addColorStop(0,shade(s.color,30));gr.addColorStop(.68,s.color);gr.addColorStop(1,shade(s.color,-38));ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a1);ctx.closePath();ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle="rgba(255,255,255,.30)";ctx.lineWidth=2;ctx.stroke();});ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle="rgba(255,255,255,.94)";ctx.lineWidth=7;ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.91,0,Math.PI*2);ctx.strokeStyle="rgba(0,0,0,.18)";ctx.lineWidth=2;ctx.stroke();for(let i=0;i<52;i++){let ang=i/52*Math.PI*2,rr=r*1.012;ctx.beginPath();ctx.arc(Math.cos(ang)*rr,Math.sin(ang)*rr,i%3?2.4:3.7,0,Math.PI*2);ctx.fillStyle=i%3?"rgba(255,255,255,.75)":"#fff2a8";ctx.fill()}ctx.restore();const h=ctx.createRadialGradient(c-size*.035,c-size*.035,2,c,c,size*.10);h.addColorStop(0,"#fffbd5");h.addColorStop(.28,"#ffd166");h.addColorStop(1,"#9f4a00");ctx.beginPath();ctx.arc(c,c,size*.09,0,Math.PI*2);ctx.fillStyle=h;ctx.fill();ctx.strokeStyle="rgba(255,255,255,.78)";ctx.lineWidth=4;ctx.stroke()}
function ac(){if(st.muted)return null;if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}
function tone(f=440,d=.06,type="square",gain=.03,delay=0){const a=ac();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+delay);g.gain.setValueAtTime(gain,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+d);o.connect(g).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d)}
function tick(){tone(185,.025,"square",.015)}function fan(){[392,523,659,784].forEach((f,i)=>tone(f,.28,"sawtooth",.036,i*.07));tone(196,.5,"triangle",.03,.12)}
function choose(s){let pool=s.topics.filter(t=>!st.recent.slice(0,24).includes(t.id));if(!pool.length)pool=s.topics.slice();const fresher=pool.filter(t=>!st.families.slice(0,3).includes(t.main.family));if(fresher.length)pool=fresher;return pool[Math.floor(Math.random()*pool.length)]}
function spin(){if(st.spin)return;st.spin=true;$("#spin").disabled=true;reveal.classList.remove("ready");const n=DATA.subjects.length,a=Math.PI*2/n,i=Math.floor(Math.random()*n),center=i*a+a/2,desired=-Math.PI/2-center,current=norm(st.rot);let delta=norm(desired-current);if(delta<0)delta+=Math.PI*2;const start=st.rot,target=start+(5+Math.floor(Math.random()*4))*Math.PI*2+delta,dur=4300+Math.random()*1500,t0=performance.now();let last=-1;burst(18,"#fff",.35);function frame(now){let p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4.15);st.rot=start+(target-start)*e;draw();let seg=Math.floor(norm(-Math.PI/2-st.rot)/a)%n;if(seg!==last){if(last>=0)tick();last=seg;let pt=$(".pointer");pt.classList.remove("kick");void pt.offsetWidth;pt.classList.add("kick")}if(p<1)requestAnimationFrame(frame);else{st.rot=target;st.spin=false;$("#spin").disabled=false;land(i)}}requestAnimationFrame(frame)}
function youtubeURL(q){return "https://www.youtube.com/results?search_query="+encodeURIComponent(q)}
function land(i){const s=DATA.subjects[i],t=choose(s);st.recent=[t.id,...st.recent.filter(x=>x!==t.id)].slice(0,32);st.families=[t.main.family,...st.families.filter(x=>x!==t.main.family)].slice(0,8);localStorage.setItem("woe:v26:recent",JSON.stringify(st.recent));localStorage.setItem("woe:v26:families",JSON.stringify(st.families));document.documentElement.style.setProperty("--accent",s.color);$("#subject").textContent=s.name.toUpperCase();$("#title").textContent=t.title;$("#hook").textContent=t.hook;$("#glyph").textContent=glyphs[s.name]||"✦";$("#overviewText").textContent=t.brief;$("#mainEvent").href=t.main.url;$("#mainKind").textContent=t.main.kind;$("#mainTime").textContent=t.main.time;$("#mainDevice").textContent=t.main.device;$("#mainIcon").textContent=t.main.icon;$("#mainLabel").textContent=t.main.label;$("#mainSource").textContent=t.main.source;$("#mainMission").textContent=t.main.mission;$("#watch").href=youtubeURL(t.watch.query);$("#watchSub").textContent=t.watch.source+" • YOUTUBE";$("#more").href=t.more.url;$("#moreIcon").textContent=t.more.icon||"↗";$("#moreLabel").textContent=t.more.label;$("#moreSub").textContent=t.more.source;reveal.classList.add("ready");const fl=$("#flash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");fan();burst(120,s.color,1);setTimeout(()=>burst(70,"#fff",.85),160);if(innerWidth<1050)setTimeout(()=>reveal.scrollIntoView({behavior:"smooth",block:"start"}),150)}
function burst(c,color,f){let b=cv.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height*.28;for(let i=0;i<c;i++){let p=document.createElement("i"),a=Math.random()*Math.PI*2,d=(65+Math.random()*420)*f,z=2+Math.random()*7;p.className=Math.random()<.25?"spark star":"spark";p.style.cssText=`--x0:${x}px;--y0:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d+170*f}px;--rot:${Math.random()*900-450}deg;--dur:${700+Math.random()*950}ms;width:${z}px;height:${z}px;background:${color}`;$("#fx").appendChild(p);setTimeout(()=>p.remove(),1800)}}
$("#spin").addEventListener("click",spin);cv.addEventListener("click",spin);$("#again").addEventListener("click",()=>{if(innerWidth<1050)window.scrollTo({top:0,behavior:"smooth"});spin()});$("#sound").textContent=st.muted?"🔇":"🔊";$("#sound").addEventListener("click",()=>{st.muted=!st.muted;localStorage.setItem("woe:v26:muted",st.muted?"1":"0");$("#sound").textContent=st.muted?"🔇":"🔊";if(!st.muted)tone(440,.08,"sine",.03)});fit();
</script>
